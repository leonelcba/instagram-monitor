name: DIAGNOSTICO Instagram

on:
  workflow_dispatch:

jobs:
  diagnostico:
    runs-on: ubuntu-latest

    steps:
      - name: Instalar Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Ejecutar diagnóstico
        shell: python
        run: |
          import time
          from playwright.sync_api import sync_playwright

          PROFILE = "laderechadiario"
          PROFILE_URL = f"https://www.instagram.com/{PROFILE}/"
          NEEDLE = "media.sssinstagram.com/get"

          def count_urls(page):
              return page.evaluate("""
              needle => {
                  let result = [];

                  for (const el of document.querySelectorAll('*')) {
                      for (const attr of el.attributes) {
                          if ((attr.value || '').includes(needle)) {
                              result.push({
                                  tag: el.tagName,
                                  attr: attr.name,
                                  value: attr.value.substring(0, 200),
                                  className: typeof el.className === 'string'
                                      ? el.className.substring(0, 150)
                                      : ''
                              });
                          }
                      }
                  }

                  return result;
              }
              """, NEEDLE)

          def show_scan(page, title):
              print("")
              print("=" * 70)
              print(title)
              print("=" * 70)

              matches = count_urls(page)

              print(f"Total encontrados: {len(matches)}")

              by_tag = {}

              for item in matches:
                  tag = item["tag"]
                  by_tag[tag] = by_tag.get(tag, 0) + 1

              print("Por etiqueta:", by_tag)

              for n, item in enumerate(matches, 1):
                  print("")
                  print(f"[{n}] <{item['tag'].lower()}>")
                  print(f"    atributo: {item['attr']}")
                  print(f"    clase: {item['className']}")
                  print(f"    URL: {item['value']}")

              return matches

          def get_scrollables(page):
              return page.evaluate("""
              () => {
                  const result = [];

                  for (const el of document.querySelectorAll('*')) {
                      const style = getComputedStyle(el);

                      if (
                          el.scrollHeight > el.clientHeight + 100 &&
                          (
                              style.overflowY === 'auto' ||
                              style.overflowY === 'scroll' ||
                              style.overflow === 'auto' ||
                              style.overflow === 'scroll'
                          )
                      ) {
                          result.push({
                              tag: el.tagName,
                              id: el.id || '',
                              className: typeof el.className === 'string'
                                  ? el.className.substring(0, 200)
                                  : '',
                              scrollHeight: el.scrollHeight,
                              clientHeight: el.clientHeight,
                              scrollTop: el.scrollTop
                          });
                      }
                  }

                  return result;
              }
              """)

          with sync_playwright() as p:

              print("=" * 70)
              print("INICIANDO DIAGNÓSTICO")
              print("=" * 70)
              print(f"Cuenta: {PROFILE}")

              browser = p.chromium.launch(
                  headless=True,
                  args=["--disable-blink-features=AutomationControlled"]
              )

              page = browser.new_page(
                  viewport={"width": 1440, "height": 1200}
              )

              page.set_default_timeout(30000)

              print("")
              print("Abriendo SSSInstagram...")

              page.goto(
                  "https://sssinstagram.com/es/story-saver",
                  wait_until="domcontentloaded",
                  timeout=60000
              )

              time.sleep(3)

              print("Página abierta correctamente.")

              # Buscar campo de URL
              inputs = page.locator("input")

              print(f"Inputs encontrados: {inputs.count()}")

              target = None

              for i in range(inputs.count()):
                  inp = inputs.nth(i)

                  placeholder = inp.get_attribute("placeholder") or ""
                  name = inp.get_attribute("name") or ""
                  input_type = inp.get_attribute("type") or ""

                  text = (
                      placeholder.lower()
                      + " "
                      + name.lower()
                  )

                  if (
                      "instagram" in text
                      or "url" in text
                      or input_type == "text"
                  ):
                      target = inp
                      break

              if target is None and inputs.count() > 0:
                  target = inputs.nth(0)

              if target is None:
                  raise Exception("NO SE ENCONTRO EL CAMPO DE URL")

              print("Campo encontrado.")

              target.fill(PROFILE_URL)

              print("Perfil introducido.")

              # Buscar Descargar
              buttons = page.locator("button")

              print(f"Botones encontrados: {buttons.count()}")

              clicked = False

              for i in range(buttons.count()):

                  try:
                      text = buttons.nth(i).inner_text().strip()

                      if "descargar" in text.lower():

                          print(f"Botón encontrado: {text}")

                          buttons.nth(i).click()

                          clicked = True
                          break

                  except:
                      pass

              if not clicked:

                  links = page.locator("a")

                  for i in range(links.count()):

                      try:
                          text = links.nth(i).inner_text().strip()

                          if "descargar" in text.lower():

                              print(f"Enlace encontrado: {text}")

                              links.nth(i).click()

                              clicked = True
                              break

                      except:
                          pass

              if not clicked:
                  raise Exception("NO SE ENCONTRO EL BOTON DESCARGAR")

              print("Descargar pulsado.")

              print("Esperando resultados...")

              time.sleep(6)

              print("URL actual:", page.url)

              # Buscar Stories
              stories = page.get_by_text("STORIES", exact=True)

              if stories.count() == 0:
                  stories = page.get_by_text("Stories", exact=True)

              if stories.count() == 0:
                  stories = page.get_by_text("stories", exact=True)

              print(f"Elementos Stories encontrados: {stories.count()}")

              if stories.count() > 0:

                  try:
                      stories.first.click()
                      print("Stories pulsado.")
                  except:
                      print("No se pudo pulsar Stories.")

              time.sleep(4)

              # --------------------------------------------------
              # ESCANEO INICIAL
              # --------------------------------------------------

              initial = show_scan(
                  page,
                  "ESCANEO INICIAL"
              )

              # --------------------------------------------------
              # ELEMENTOS CON SCROLL
              # --------------------------------------------------

              print("")
              print("=" * 70)
              print("CONTENEDORES CON SCROLL")
              print("=" * 70)

              scrollables = get_scrollables(page)

              print(
                  f"Contenedores con scroll interno: "
                  f"{len(scrollables)}"
              )

              for i, item in enumerate(scrollables, 1):

                  print("")
                  print(f"SCROLL {i}")
                  print(f"  tag: {item['tag']}")
                  print(f"  id: {item['id']}")
                  print(f"  class: {item['className']}")
                  print(
                      f"  scrollHeight: "
                      f"{item['scrollHeight']}"
                  )
                  print(
                      f"  clientHeight: "
                      f"{item['clientHeight']}"
                  )
                  print(
                      f"  scrollTop: "
                      f"{item['scrollTop']}"
                  )

              # --------------------------------------------------
              # SCROLL INTERNO
              # --------------------------------------------------

              print("")
              print("=" * 70)
              print("PROBANDO SCROLL INTERNO")
              print("=" * 70)

              previous_count = len(initial)

              for round_number in range(1, 11):

                  print("")
                  print(
                      f"RONDA {round_number}/10"
                  )

                  moved = page.evaluate("""
                  () => {

                      const elements =
                          [...document.querySelectorAll('*')];

                      const scrollables =
                          elements.filter(el => {

                              const style =
                                  getComputedStyle(el);

                              return (
                                  el.scrollHeight >
                                  el.clientHeight + 100
                                  &&
                                  (
                                      style.overflowY === 'auto' ||
                                      style.overflowY === 'scroll' ||
                                      style.overflow === 'auto' ||
                                      style.overflow === 'scroll'
                                  )
                              );
                          });

                      let count = 0;

                      for (const el of scrollables) {

                          const oldTop =
                              el.scrollTop;

                          const amount =
                              Math.max(
                                  400,
                                  Math.floor(
                                      el.clientHeight * 0.8
                                  )
                              );

                          el.scrollTop =
                              Math.min(
                                  oldTop + amount,
                                  el.scrollHeight
                              );

                          if (
                              el.scrollTop !== oldTop
                          ) {
                              count++;
                          }
                      }

                      return count;
                  }
                  """)

                  print(
                      f"Contenedores desplazados: {moved}"
                  )

                  time.sleep(2)

                  current = count_urls(page)

                  current_count = len(current)

                  print(
                      f"URLs encontradas ahora: "
                      f"{current_count}"
                  )

                  if current_count > previous_count:

                      print(
                          f"🔥 APARECIERON "
                          f"{current_count - previous_count} "
                          f"URLs NUEVAS"
                      )

                      show_scan(
                          page,
                          f"URLs DESPUÉS DE RONDA {round_number}"
                      )

                      previous_count = current_count

                  else:

                      print(
                          "No aparecieron URLs nuevas."
                      )

              # --------------------------------------------------
              # BUSCAR URLs EN TODO TIPO DE ELEMENTOS
              # --------------------------------------------------

              print("")
              print("=" * 70)
              print("ELEMENTOS MULTIMEDIA")
              print("=" * 70)

              for tag in [
                  "a",
                  "img",
                  "video",
                  "source",
                  "button"
              ]:

                  locator = page.locator(tag)

                  print(
                      f"<{tag}>: "
                      f"{locator.count()}"
                  )

                  found = 0

                  for i in range(locator.count()):

                      if found >= 30:
                          break

                      el = locator.nth(i)

                      try:

                          attrs = page.evaluate(
                              """
                              el => {
                                  const result = {};

                                  for (
                                      const attr
                                      of el.attributes
                                  ) {
                                      result[attr.name] =
                                          attr.value;
                                  }

                                  return result;
                              }
                              """,
                              el
                          )

                          serialized = str(attrs)

                          if (
                              NEEDLE in serialized
                              or tag in [
                                  "img",
                                  "video",
                                  "source"
                              ]
                          ):

                              print("")
                              print(
                                  f"{tag.upper()} #{i}"
                              )

                              print(
                                  serialized[:500]
                              )

                              found += 1

                      except:
                          pass

              # --------------------------------------------------
              # FINAL
              # --------------------------------------------------

              final = show_scan(
                  page,
                  "ESCANEO FINAL"
              )

              print("")
              print("=" * 70)
              print("DIAGNÓSTICO TERMINADO")
              print("=" * 70)

              print(
                  f"URLs iniciales: {len(initial)}"
              )

              print(
                  f"URLs finales: {len(final)}"
              )

              print(
                  "No se modificó ningún archivo "
                  "del monitor."
              )

              print(
                  "No se envió nada a Telegram."
              )

              browser.close()
