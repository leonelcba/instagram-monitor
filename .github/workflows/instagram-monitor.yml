                  )

                  print("")
                  print(
                      "ELEMENTOS QUE CONTIENEN "
                      "MEDIA:"
                  )

                  for i, item in enumerate(
                      summary["elements"][:200]
                  ):

                      print("")
                      print(
                          f"MEDIA ELEMENT #{i}"
                      )

                      print(
                          f"  tag: "
                          f"{item['tag']}"
                      )

                      print(
