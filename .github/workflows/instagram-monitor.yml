```yaml
name: Instagram Stories Monitor

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. DESCARGAR REPOSITORIO
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. INSTALAR DEPENDENCIAS
      # ============================================================

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests
          playwright install --with-deps chromium


      # ============================================================
      # 3. CREAR MONITOR
      # ============================================================

      - name: Crear monitor
        run: |
          cat > monitor_instagram.py <<'PY'

          import os
          import json
          import time
          import hashlib
          import re
          from pathlib import Path
          from urllib.parse import urlparse

          import requests
          from playwright.sync_api import sync_playwright


          # ============================================================
          # CONFIGURACIÓN
          # ============================================================

          SNAPGRAM_URL = (
              "https://www.snapgram.io/instagram-story-downloader/"
          )

          ACCOUNTS_FILE = Path(
              "data/instagram-accounts.json"
          )

          STATE_FILE = Path(
              "data/instagram-state.json"
          )

          DOWNLOAD_DIR = Path(
              "downloads"
          )

          TELEGRAM_BOT_TOKEN = os.environ.get(
              "TELEGRAM_BOT_TOKEN"
          )

          TELEGRAM_CHAT_ID = os.environ.get(
              "TELEGRAM_CHAT_ID"
          )

          # ------------------------------------------------------------
          # TRUE solamente durante esta prueba.
          # Cuando comprobemos que funciona, poner FALSE.
          # ------------------------------------------------------------

          FORCE_RESEND = True


          # ============================================================
          # CUENTAS
          # ============================================================

          def load_accounts():

              with open(
                  ACCOUNTS_FILE,
                  "r",
                  encoding="utf-8"
              ) as f:

                  accounts = json.load(f)

              result = []

              for account in accounts:

                  account = str(account).strip()

                  if account.startswith("@"):
                      account = account[1:]

                  if (
                      "instagram.com/" in account
                  ):

                      account = (
                          account
                          .split(
                              "instagram.com/",
                              1
                          )[1]
                          .split("/", 1)[0]
                          .split("?", 1)[0]
                      )

                  if account and account not in result:
                      result.append(account)

              return result


          # ============================================================
          # ESTADO
          # ============================================================

          def load_state():

              if not STATE_FILE.exists():
                  return {}

              try:

                  with open(
                      STATE_FILE,
                      "r",
                      encoding="utf-8"
                  ) as f:

                      state = json.load(f)

                  if isinstance(state, dict):
                      return state

              except Exception as e:

                  print(
                      f"⚠️ No se pudo leer el estado: {e}"
                  )

              return {}


          def save_state(state):

              STATE_FILE.parent.mkdir(
                  parents=True,
                  exist_ok=True
              )

              with open(
                  STATE_FILE,
                  "w",
                  encoding="utf-8"
              ) as f:

                  json.dump(
                      state,
                      f,
                      indent=2,
                      ensure_ascii=False
                  )


          # ============================================================
          # SHA-256
          # ============================================================

          def sha256_file(path):

              sha256 = hashlib.sha256()

              with open(
                  path,
                  "rb"
              ) as f:

                  while True:

                      chunk = f.read(
                          1024 * 1024
                      )

                      if not chunk:
                          break

                      sha256.update(chunk)

              return sha256.hexdigest()


          # ============================================================
          # EXTENSIÓN
          # ============================================================

          def extension_from_response(
              content_type,
              url
          ):

              content_type = (
                  content_type
                  .lower()
                  .split(";")[0]
                  .strip()
              )

              if content_type.startswith(
                  "video/"
              ):
                  return ".mp4"

              if content_type == "image/png":
                  return ".png"

              if content_type == "image/webp":
                  return ".webp"

              if content_type.startswith(
                  "image/"
              ):
                  return ".jpg"

              path = urlparse(
                  url
              ).path.lower()

              if ".mp4" in path:
                  return ".mp4"

              if ".webm" in path:
                  return ".mp4"

              if ".png" in path:
                  return ".png"

              if ".webp" in path:
                  return ".webp"

              return ".jpg"


          # ============================================================
          # TELEGRAM
          # ============================================================

          def send_telegram(
              path,
              account,
              media_type
          ):

              if media_type == "video":

                  endpoint = (
                      "https://api.telegram.org/"
                      f"bot{TELEGRAM_BOT_TOKEN}/"
                      "sendVideo"
                  )

                  field = "video"

                  mime = "video/mp4"

              else:

                  endpoint = (
                      "https://api.telegram.org/"
                      f"bot{TELEGRAM_BOT_TOKEN}/"
                      "sendPhoto"
                  )

                  field = "photo"

                  mime = "image/jpeg"


              caption = (
                  "📱 Instagram Monitor\n"
                  f"@{account}\n"
                  "Nueva Story"
              )


              try:

                  with open(
                      path,
                      "rb"
                  ) as f:

                      response = requests.post(

                          endpoint,

                          data={
                              "chat_id":
                                  TELEGRAM_CHAT_ID,

                              "caption":
                                  caption
                          },

                          files={
                              field: (
                                  path.name,
                                  f,
                                  mime
                              )
                          },

                          timeout=180
                      )


                  print(
                      "Telegram HTTP:",
                      response.status_code
                  )

                  print(
                      response.text
                  )


                  if not response.ok:
                      return False


                  result = response.json()

                  return (
                      result.get("ok")
                      is True
                  )


              except Exception as e:

                  print(
                      f"❌ Error Telegram: {e}"
                  )

                  return False


          # ============================================================
          # ABRIR SNAPGRAM
          # ============================================================

          def open_snapgram(
              page,
              account
          ):

              print()
              print(
                  "Abriendo Snapgram..."
              )

              page.goto(
                  SNAPGRAM_URL,
                  wait_until="domcontentloaded",
                  timeout=60000
              )

              page.wait_for_timeout(
                  4000
              )


              profile_url = (
                  f"https://www.instagram.com/"
                  f"{account}/"
              )


              print(
                  f"Perfil: {profile_url}"
              )


              # --------------------------------------------------------
              # BUSCAR INPUT
              # --------------------------------------------------------

              inputs = page.locator(
                  "input"
              )

              print(
                  f"Inputs encontrados: "
                  f"{inputs.count()}"
              )


              target = None


              for i in range(
                  inputs.count()
              ):

                  try:

                      inp = inputs.nth(i)

                      input_type = (
                          inp.get_attribute(
                              "type"
                          )
                          or ""
                      ).lower()

                      placeholder = (
                          inp.get_attribute(
                              "placeholder"
                          )
                          or ""
                      ).lower()

                      name = (
                          inp.get_attribute(
                              "name"
                          )
                          or ""
                      ).lower()

                      text = (
                          placeholder
                          + " "
                          + name
                      )


                      if (
                          input_type
                          in (
                              "",
                              "text",
                              "url"
                          )
                          and (
                              "instagram" in text
                              or "username" in text
                              or "user" in text
                              or "link" in text
                              or "url" in text
                          )
                      ):

                          target = inp

                          break

                  except Exception:

                      pass


              if target is None:

                  for i in range(
                      inputs.count()
                  ):

                      try:

                          inp = inputs.nth(i)

                          input_type = (
                              inp.get_attribute(
                                  "type"
                              )
                              or ""
                          ).lower()

                          if input_type in (
                              "",
                              "text",
                              "url"
                          ):

                              target = inp

                              break

                      except Exception:

                          pass


              if target is None:

                  raise Exception(
                      "No se encontró "
                      "el campo de Snapgram."
                  )


              print(
                  "Campo encontrado."
              )


              target.fill(
                  profile_url
              )


              page.wait_for_timeout(
                  500
              )


              # --------------------------------------------------------
              # BUSCAR BOTÓN DOWNLOAD
              # --------------------------------------------------------

              print(
                  "Buscando botón Download..."
              )


              clicked = False


              buttons = page.locator(
                  "button"
              )


              for i in range(
                  buttons.count()
              ):

                  try:

                      button = buttons.nth(i)

                      text = (
                          button.inner_text()
                          or ""
                      ).strip().lower()


                      if (
                          "download" in text
                          or "descargar" in text
                      ):

                          print(
                              f"Botón encontrado: "
                              f"{text}"
                          )

                          button.click()

                          clicked = True

                          break

                  except Exception:

                      pass


              # --------------------------------------------------------
              # FALLBACK: INPUT SUBMIT
              # --------------------------------------------------------

              if not clicked:

                  submits = page.locator(
                      "input[type='submit']"
                  )


                  for i in range(
                      submits.count()
                  ):

                      try:

                          value = (
                              submits.nth(i)
                              .get_attribute(
                                  "value"
                              )
                              or ""
                          ).lower()


                          if (
                              "download" in value
                              or "descargar" in value
                          ):

                              submits.nth(i).click()

                              clicked = True

                              break

                      except Exception:

                          pass


              if not clicked:

                  raise Exception(
                      "No se encontró "
                      "el botón Download."
                  )


              print(
                  "Download pulsado."
              )


              # --------------------------------------------------------
              # ESPERAR RESULTADOS
              # --------------------------------------------------------

              print(
                  "Esperando Stories..."
              )


              for intento in range(
                  1,
                  16
              ):

                  page.wait_for_timeout(
                      2000
                  )


                  media_count = page.locator(
                      "video[src], "
                      "img[src]"
                  ).count()


                  print(
                      f"Espera "
                      f"{intento}/15 | "
                      f"media={media_count}"
                  )


                  if media_count > 0:

                      return True


              print(
                  "⚠️ No apareció multimedia "
                  "inmediatamente."
              )


              return True


          # ============================================================
          # OBTENER MEDIA DE STORIES
          # ============================================================

          def collect_media(page):

              return page.evaluate(
                  """
                  () => {

                      const result = [];
                      const seen = new Set();


                      // =================================================
                      // BUSCAR TARJETAS QUE CONTENGAN DOWNLOAD
                      // =================================================

                      const downloadElements =
                          Array.from(
                              document.querySelectorAll(
                                  'a[href], button'
                              )
                          ).filter(el => {

                              const text =
                                  (
                                      el.innerText ||
                                      el.textContent ||
                                      ""
                                  ).trim().toLowerCase();

                              const href =
                                  el.getAttribute(
                                      "href"
                                  ) || "";

                              return (
                                  text.includes(
                                      "download"
                                  )
                                  ||
                                  text.includes(
                                      "descargar"
                                  )
                                  ||
                                  href.includes(
                                      "download"
                                  )
                              );

                          });


                      for (
                          const downloadElement
                          of downloadElements
                      ) {


                          // ------------------------------------------------
                          // Subir por los ancestros buscando una tarjeta
                          // que contenga exactamente el contenido multimedia.
                          // ------------------------------------------------

                          let container =
                              downloadElement;


                          let mediaElement = null;


                          for (
                              let level = 0;
                              level < 8 &&
                              container;
                              level++
                          ) {


                              const videos =
                                  Array.from(
                                      container.querySelectorAll(
                                          "video[src]"
                                      )
                                  );


                              if (
                                  videos.length > 0
                              ) {

                                  mediaElement =
                                      videos[0];

                                  break;

                              }


                              const images =
                                  Array.from(
                                      container.querySelectorAll(
                                          "img[src]"
                                      )
                                  ).filter(img => {

                                      const src =
                                          img.getAttribute(
                                              "src"
                                          ) || "";

                                      const cls =
                                          (
                                              img.className
                                              || ""
                                          ).toString()
                                          .toLowerCase();

                                      const alt =
                                          (
                                              img.getAttribute(
                                                  "alt"
                                              )
                                              || ""
                                          ).toLowerCase();


                                      // No aceptar logos,
                                      // avatares ni iconos.

                                      if (
                                          cls.includes(
                                              "avatar"
                                          )
                                          ||
                                          cls.includes(
                                              "logo"
                                          )
                                          ||
                                          alt.includes(
                                              "logo"
                                          )
                                      ) {

                                          return false;

                                      }


                                      return (
                                          src.startsWith(
                                              "http"
                                          )
                                      );

                                  });


                              if (
                                  images.length > 0
                              ) {

                                  mediaElement =
                                      images[0];

                                  break;

                              }


                              container =
                                  container.parentElement;

                          }


                          if (
                              !mediaElement
                          ) {

                              continue;

                          }


                          const tag =
                              mediaElement.tagName
                              .toLowerCase();


                          let url =
                              mediaElement.getAttribute(
                                  "src"
                              )
                              || "";


                          if (
                              !url
                              ||
                              url.startsWith(
                                  "blob:"
                              )
                              ||
                              url.startsWith(
                                  "data:"
                              )
                          ) {

                              continue;

                          }


                          // ------------------------------------------------
                          // Ignorar imágenes que claramente sean
                          // elementos de interfaz.
                          // ------------------------------------------------

                          if (
                              tag === "img"
                          ) {

                              const cls =
                                  (
                                      mediaElement.className
                                      || ""
                                  ).toString()
                                  .toLowerCase();


                              const alt =
                                  (
                                      mediaElement.getAttribute(
                                          "alt"
                                      )
                                      || ""
                                  ).toLowerCase();


                              if (
                                  cls.includes(
                                      "avatar"
                                  )
                                  ||
                                  cls.includes(
                                      "logo"
                                  )
                                  ||
                                  cls.includes(
                                      "icon"
                                  )
                                  ||
                                  alt.includes(
                                      "profile"
                                  )
                                  ||
                                  alt.includes(
                                      "avatar"
                                  )
                                  ||
                                  alt.includes(
                                      "logo"
                                  )
                              ) {

                                  continue;

                              }

                          }


                          const type =
                              tag === "video"
                              ? "video"
                              : "photo";


                          // ------------------------------------------------
                          // Para videos exigimos una URL real.
                          // ------------------------------------------------

                          if (
                              type === "video"
                              &&
                              (
                                  !url.startsWith(
                                      "http"
                                  )
                              )
                          ) {

                              continue;

                          }


                          const key =
                              type + "|" + url;


                          if (
                              seen.has(key)
                          ) {

                              continue;

                          }


                          seen.add(key);


                          result.push({

                              type: type,

                              url: url,

                              label:
                                  mediaElement
                                  .getAttribute(
                                      "aria-label"
                                  )
                                  ||
                                  mediaElement
                                  .getAttribute(
                                      "alt"
                                  )
                                  ||
                                  ""

                          });

                      }


                      return result;

                  }
                  """
              )


          # ============================================================
          # SCROLL INTERNO
          # ============================================================

          def scroll_internal(page):

              return page.evaluate(
                  """
                  () => {

                      const elements =
                          Array.from(
                              document.querySelectorAll("*")
                          );


                      const scrollables =
                          elements.filter(
                              el => {

                                  const style =
                                      getComputedStyle(
                                          el
                                      );


                                  return (
                                      el.scrollHeight >
                                      el.clientHeight + 100
                                      &&
                                      (
                                          style.overflowY
                                          === "auto"
                                          ||
                                          style.overflowY
                                          === "scroll"
                                          ||
                                          style.overflow
                                          === "auto"
                                          ||
                                          style.overflow
                                          === "scroll"
                                      )
                                  );

                              }
                          );


                      let moved = 0;


                      for (
                          const el
                          of scrollables
                      ) {

                          const oldTop =
                              el.scrollTop;


                          const amount =
                              Math.max(
                                  500,
                                  Math.floor(
                                      el.clientHeight *
                                      0.85
                                  )
                              );


                          el.scrollTop =
                              Math.min(
                                  oldTop + amount,
                                  el.scrollHeight
                              );


                          if (
                              el.scrollTop !==
                              oldTop
                          ) {

                              moved++;

                          }

                      }


                      return moved;

                  }
                  """
              )


          # ============================================================
          # DESCARGAR MEDIA
          # ============================================================

          def download_media(
              url,
              account,
              index
          ):

              DOWNLOAD_DIR.mkdir(
                  parents=True,
                  exist_ok=True
              )


              print(
                  f"⬇️ Descargando media {index}..."
              )


              try:

                  response = requests.get(

                      url,

                      stream=True,

                      timeout=120,

                      headers={
                          "User-Agent":
                              "Mozilla/5.0 "
                              "(Windows NT 10.0; Win64; x64) "
                              "AppleWebKit/537.36 "
                              "(KHTML, like Gecko) "
                              "Chrome/139.0.0.0 "
                              "Safari/537.36"
                      }

                  )


                  print(
                      "HTTP:",
                      response.status_code
                  )


                  response.raise_for_status()


                  content_type = (
                      response.headers
                      .get(
                          "Content-Type",
                          ""
                      )
                  )


                  print(
                      "Content-Type:",
                      content_type
                  )


                  extension = (
                      extension_from_response(
                          content_type,
                          url
                      )
                  )


                  temp_path = (
                      DOWNLOAD_DIR
                      /
                      (
                          f"temp_"
                          f"{account}_"
                          f"{index}_"
                          f"{int(time.time() * 1000)}"
                          f"{extension}"
                      )
                  )


                  with open(
                      temp_path,
                      "wb"
                  ) as f:

                      for chunk in (
                          response.iter_content(
                              chunk_size=
                              1024 * 1024
                          )
                      ):

                          if chunk:
                              f.write(chunk)


                  size = temp_path.stat().st_size


                  print(
                      "Tamaño:",
                      size,
                      "bytes"
                  )


                  if size == 0:

                      temp_path.unlink(
                          missing_ok=True
                      )

                      return None, None


                  return (
                      temp_path,
                      content_type
                  )


              except Exception as e:

                  print(
                      f"❌ Error descargando: "
                      f"{e}"
                  )

                  return None, None


          # ============================================================
          # PROCESAR CUENTA
          # ============================================================

          def process_account(
              browser,
              account,
              state
          ):

              print()
              print(
                  "=" * 60
              )

              print(
                  f"CUENTA: @{account}"
              )

              print(
                  "=" * 60
              )


              account_state = state.get(
                  account
              )


              known_hashes = set()


              initialized = False


              if isinstance(
                  account_state,
                  dict
              ):

                  known_hashes = set(
                      account_state.get(
                          "hashes",
                          []
                      )
                  )

                  initialized = bool(
                      account_state.get(
                          "initialized",
                          False
                      )
                  )


              elif isinstance(
                  account_state,
                  list
              ):

                  # Estado antiguo.
                  # Se conserva la información existente
                  # y se considera inicializado.

                  known_hashes = set(
                      account_state
                  )

                  initialized = True


              print(
                  "Hashes conocidos:",
                  len(known_hashes)
              )

              print(
                  "Inicializada:",
                  initialized
              )


              page = browser.new_page(

                  viewport={
                      "width": 1440,
                      "height": 1200
                  },

                  user_agent=(
                      "Mozilla/5.0 "
                      "(X11; Linux x86_64) "
                      "AppleWebKit/537.36 "
                      "(KHTML, like Gecko) "
                      "Chrome/139.0.0.0 "
                      "Safari/537.36"
                  )

              )


              try:

                  # ------------------------------------------------------
                  # ABRIR SNAPGRAM
                  # ------------------------------------------------------

                  if not open_snapgram(
                      page,
                      account
                  ):

                      return 0


                  # ------------------------------------------------------
                  # COLECCIÓN INICIAL
                  # ------------------------------------------------------

                  media = collect_media(
                      page
                  )


                  print(
                      f"Media inicial: "
                      f"{len(media)}"
                  )


                  print(
                      f"  🎥 Videos: "
                      f"{sum("
                          "1 for x in media "
                          "if x['type'] == 'video'"
                      )}"
                  )


                  print(
                      f"  📸 Fotos: "
                      f"{sum("
                          "1 for x in media "
                          "if x['type'] == 'photo'"
                      )}"
                  )


                  # ------------------------------------------------------
                  # SCROLL
                  # ------------------------------------------------------

                  stable_rounds = 0


                  for ronda in range(
                      1,
                      21
                  ):

                      before = len(
                          media
                      )


                      moved = scroll_internal(
                          page
                      )


                      page.wait_for_timeout(
                          1500
                      )


                      current = collect_media(
                          page
                      )


                      existing = {
                          (
                              item["type"],
                              item["url"]
                          )
                          for item in media
                      }


                      for item in current:

                          key = (
                              item["type"],
                              item["url"]
                          )


                          if key not in existing:

                              media.append(
                                  item
                              )

                              existing.add(
                                  key
                              )


                      added = (
                          len(media) - before
                      )


                      print(
                          f"Scroll {ronda}/20 | "
                          f"movidos={moved} | "
                          f"nuevos={added} | "
                          f"total={len(media)}"
                      )


                      if (
                          added == 0
                          and moved == 0
                      ):

                          stable_rounds += 1

                      else:

                          stable_rounds = 0


                      if stable_rounds >= 2:

                          break


                  # ------------------------------------------------------
                  # ESCANEO FINAL
                  # ------------------------------------------------------

                  final_media = collect_media(
                      page
                  )


                  existing = {
                      (
                          item["type"],
                          item["url"]
                      )
                      for item in media
                  }


                  for item in final_media:

                      key = (
                          item["type"],
                          item["url"]
                      )


                      if key not in existing:

                          media.append(
                              item
                          )

                          existing.add(
                              key
                          )


                  print()
                  print(
                      "TOTAL FINAL:",
                      len(media)
                  )


                  print(
                      "Videos:",
                      sum(
                          1
                          for x in media
                          if x["type"] == "video"
                      )
                  )


                  print(
                      "Fotos:",
                      sum(
                          1
                          for x in media
                          if x["type"] == "photo"
                      )
                  )


                  if not media:

                      print(
                          "⚠️ No se encontraron "
                          "Stories."
                      )

                      return 0


                  sent = 0


                  # ------------------------------------------------------
                  # PROCESAR CADA STORY
                  # ------------------------------------------------------

                  for index, item in enumerate(
                      media,
                      start=1
                  ):

                      print()
                      print(
                          f"Story {index}/"
                          f"{len(media)}"
                      )


                      print(
                          "Tipo:",
                          item["type"]
                      )


                      print(
                          "URL:",
                          item["url"][:180]
                      )


                      path, content_type = (
                          download_media(
                              item["url"],
                              account,
                              index
                          )
                      )


                      if path is None:

                          continue


                      file_hash = sha256_file(
                          path
                      )


                      print(
                          "SHA-256:",
                          file_hash
                      )


                      # --------------------------------------------------
                      # CUENTA NUEVA
                      # --------------------------------------------------

                      if not initialized:

                          print(
                              "🆕 Cuenta nueva."
                          )

                          print(
                              "Se registra la Story "
                              "sin enviarla."
                          )


                          known_hashes.add(
                              file_hash
                          )


                          path.unlink(
                              missing_ok=True
                          )

                          continue


                      # --------------------------------------------------
                      # DUPLICADO
                      # --------------------------------------------------

                      if (
                          file_hash in known_hashes
                          and not FORCE_RESEND
                      ):

                          print(
                              "⏭️ Story ya enviada."
                          )


                          path.unlink(
                              missing_ok=True
                          )

                          continue


                      if (
                          file_hash in known_hashes
                          and FORCE_RESEND
                      ):

                          print(
                              "🔄 FORCE_RESEND: "
                              "se reenviará."
                          )


                      # --------------------------------------------------
                      # TIPO REAL SEGÚN ARCHIVO
                      # --------------------------------------------------

                      actual_type = (
                          item["type"]
                      )


                      if (
                          content_type
                          .lower()
                          .startswith(
                              "video/"
                          )
                      ):

                          actual_type = "video"


                      # --------------------------------------------------
                      # ENVIAR
                      # --------------------------------------------------

                      success = send_telegram(

                          path,

                          account,

                          actual_type

                      )


                      if success:

                          print(
                              "✅ Story enviada."
                          )


                          known_hashes.add(
                              file_hash
                          )


                          sent += 1


                      else:

                          print(
                              "❌ Telegram no confirmó "
                              "el envío."
                          )


                      path.unlink(
                          missing_ok=True
                      )


                  # ------------------------------------------------------
                  # GUARDAR ESTADO
                  # ------------------------------------------------------

                  state[account] = {

                      "initialized":
                          True,

                      "hashes":
                          list(
                              known_hashes
                          )[-100:]

                  }


                  print()
                  print(
                      f"Estado de @{account}: "
                      f"{len(known_hashes)} hashes."
                  )


                  print(
                      f"Enviadas: {sent}"
                  )


                  return sent


              finally:

                  try:

                      page.close()

                  except Exception:

                      pass


          # ============================================================
          # MAIN
          # ============================================================

          def main():

              print(
                  "=" * 60
              )

              print(
                  "INSTAGRAM STORIES MONITOR"
              )

              print(
                  "DESCARGADOR: SNAPGRAM"
              )

              print(
