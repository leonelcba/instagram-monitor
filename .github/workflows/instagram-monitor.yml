name: Instagram Stories Monitor

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. DESCARGAR EL REPOSITORIO
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. INSTALAR DEPENDENCIAS
      # ============================================================
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests
          playwright install chromium

      # ============================================================
      # 3. CREAR MONITOR
      # ============================================================
      - name: Crear monitor
        run: |
          cat > monitor_instagram.py <<'PY'
          import os
          import json
          import time
          import hashlib
          import mimetypes
          from pathlib import Path
          from urllib.parse import urlparse

          import requests
          from playwright.sync_api import sync_playwright


          # ============================================================
          # CONFIGURACIÓN
          # ============================================================

          SSS_URL = "https://sssinstagram.com/es/story-saver"

          ACCOUNTS_FILE = Path("data/instagram-accounts.json")
          STATE_FILE = Path("data/instagram-state.json")
          DOWNLOAD_DIR = Path("downloads")

          TELEGRAM_BOT_TOKEN = os.environ.get("TELEGRAM_BOT_TOKEN")
          TELEGRAM_CHAT_ID = os.environ.get("TELEGRAM_CHAT_ID")

          # ------------------------------------------------------------
          # IMPORTANTE:
          #
          # True  = vuelve a enviar Stories que ya están en el estado.
          # False = comportamiento normal, solamente Stories nuevas.
          #
          # Lo dejamos en True SOLO para esta prueba.
          # ------------------------------------------------------------
          FORCE_RESEND = True


          # ============================================================
          # UTILIDADES
          # ============================================================

          def clean_account(account):
              account = account.strip()
              account = account.lstrip("@")
              return account


          def load_accounts():
              if not ACCOUNTS_FILE.exists():
                  raise FileNotFoundError(
                      f"No existe {ACCOUNTS_FILE}"
                  )

              with open(ACCOUNTS_FILE, "r", encoding="utf-8") as f:
                  accounts = json.load(f)

              return [
                  clean_account(x)
                  for x in accounts
                  if str(x).strip()
              ]


          def load_state():
              if not STATE_FILE.exists():
                  return {}

              try:
                  with open(STATE_FILE, "r", encoding="utf-8") as f:
                      data = json.load(f)

                  if not isinstance(data, dict):
                      return {}

                  return data

              except Exception as e:
                  print(f"⚠️ No se pudo leer el estado: {e}")
                  return {}


          def save_state(state):
              STATE_FILE.parent.mkdir(
                  parents=True,
                  exist_ok=True
              )

              temp_file = STATE_FILE.with_suffix(".tmp")

              with open(
                  temp_file,
                  "w",
                  encoding="utf-8"
              ) as f:
                  json.dump(
                      state,
                      f,
                      ensure_ascii=False,
                      indent=2
                  )

              temp_file.replace(STATE_FILE)


          def file_sha256(path):
              sha256 = hashlib.sha256()

              with open(path, "rb") as f:
                  while True:
                      chunk = f.read(1024 * 1024)

                      if not chunk:
                          break

                      sha256.update(chunk)

              return sha256.hexdigest()


          def get_extension(content_type, url):
              content_type = (
                  content_type or ""
              ).lower().split(";")[0].strip()

              if content_type == "video/mp4":
                  return ".mp4"

              if content_type.startswith("video/"):
                  return ".mp4"

              if content_type == "image/jpeg":
                  return ".jpg"

              if content_type == "image/png":
                  return ".png"

              if content_type == "image/webp":
                  return ".webp"

              parsed = urlparse(url)
              path = parsed.path.lower()

              if ".mp4" in path:
                  return ".mp4"

              if ".webm" in path:
                  return ".mp4"

              if ".png" in path:
                  return ".png"

              if ".webp" in path:
                  return ".webp"

              return ".jpg"


          # ============================================================
          # TELEGRAM
          # ============================================================

          def telegram_request(method, files=None, data=None):
              url = (
                  f"https://api.telegram.org/"
                  f"bot{TELEGRAM_BOT_TOKEN}/{method}"
              )

              try:
                  response = requests.post(
                      url,
                      data=data,
                      files=files,
                      timeout=180
                  )

                  print(
                      f"Telegram HTTP {response.status_code}"
                  )

                  print(response.text)

                  if not response.ok:
                      return False

                  result = response.json()

                  return bool(result.get("ok"))

              except Exception as e:
                  print(
                      f"❌ Error comunicando con Telegram: {e}"
                  )

                  return False


          def send_photo(path, account):
              print(
                  f"📸 Enviando foto de @{account}"
              )

              caption = (
                  f"📸 Nueva Story de @{account}"
              )

              with open(path, "rb") as f:
                  files = {
                      "photo": (
                          path.name,
                          f,
                          "image/jpeg"
                      )
                  }

                  data = {
                      "chat_id": TELEGRAM_CHAT_ID,
                      "caption": caption
                  }

                  return telegram_request(
                      "sendPhoto",
                      files=files,
                      data=data
                  )


          def send_video(path, account):
              print(
                  f"🎥 Enviando video de @{account}"
              )

              caption = (
                  f"🎥 Nueva Story de @{account}"
              )

              with open(path, "rb") as f:
                  files = {
                      "video": (
                          path.name,
                          f,
                          "video/mp4"
                      )
                  }

                  data = {
                      "chat_id": TELEGRAM_CHAT_ID,
                      "caption": caption
                  }

                  return telegram_request(
                      "sendVideo",
                      files=files,
                      data=data
                  )


          def send_media(path, account, media_type):
              if media_type == "video":
                  return send_video(
                      path,
                      account
                  )

              return send_photo(
                  path,
                  account
              )


          # ============================================================
          # ABRIR STORIES EN SSINSTAGRAM
          # ============================================================

          def open_stories(page, account):

              print("Abriendo SSSInstagram...")

              page.goto(
                  SSS_URL,
                  wait_until="domcontentloaded",
                  timeout=60000
              )

              time.sleep(3)

              profile_url = (
                  f"https://www.instagram.com/"
                  f"{account}/"
              )

              print(
                  f"Introduciendo perfil: {profile_url}"
              )

              # --------------------------------------------------------
              # Buscar el campo de URL.
              # --------------------------------------------------------

              inputs = page.locator(
                  "input"
              )

              if inputs.count() == 0:
                  print(
                      "❌ No se encontró ningún input."
                  )
                  return False

              target_input = None

              for i in range(inputs.count()):

                  try:
                      inp = inputs.nth(i)

                      input_type = (
                          inp.get_attribute("type")
                          or ""
                      ).lower()

                      placeholder = (
                          inp.get_attribute(
                              "placeholder"
                          )
                          or ""
                      ).lower()

                      name = (
                          inp.get_attribute("name")
                          or ""
                      ).lower()

                      if (
                          input_type in (
                              "",
                              "text",
                              "url"
                          )
                          and (
                              "url" in placeholder
                              or "instagram" in placeholder
                              or "url" in name
                              or "instagram" in name
                              or i == 0
                          )
                      ):
                          target_input = inp
                          break

                  except Exception:
                      pass

              if target_input is None:
                  target_input = inputs.first

              target_input.fill(profile_url)

              time.sleep(1)

              # --------------------------------------------------------
              # Buscar botón Descargar asociado al formulario.
              # --------------------------------------------------------

              form = None

              try:
                  form = target_input.locator(
                      "xpath=ancestor::form[1]"
                  )
              except Exception:
                  form = None

              clicked = False

              if form is not None:

                  try:
                      form_buttons = form.locator(
                          "button, input[type=submit]"
                      )

                      for i in range(
                          form_buttons.count()
                      ):
                          button = form_buttons.nth(i)

                          try:
                              text = (
                                  button.inner_text()
                                  or ""
                              ).strip().lower()
                          except Exception:
                              text = ""

                          value = (
                              button.get_attribute(
                                  "value"
                              )
                              or ""
                          ).strip().lower()

                          if (
                              "descargar" in text
                              or "descargar" in value
                          ):
                              print(
                                  "Pulsando Descargar "
                                  "del formulario..."
                              )

                              button.click()

                              clicked = True
                              break

                  except Exception:
                      pass

              # --------------------------------------------------------
              # Fallback.
              # --------------------------------------------------------

              if not clicked:

                  print(
                      "Buscando botón Descargar "
                      "como fallback..."
                  )

                  buttons = page.get_by_text(
                      "Descargar",
                      exact=True
                  )

                  if buttons.count() > 0:

                      buttons.first.click()

                      clicked = True

              if not clicked:

                  print(
                      "❌ No se pudo pulsar Descargar."
                  )

                  return False

              # --------------------------------------------------------
              # Esperar resultados.
              #
              # NO esperamos un selector específico porque SSSInstagram
              # puede cambiar la estructura.
              # --------------------------------------------------------

              print(
                  "Esperando resultados de SSSInstagram..."
              )

              for intento in range(1, 11):

                  time.sleep(2)

                  videos = page.locator(
                      "video[src]"
                  ).count()

                  story_images = page.locator(
                      "img.media-content__image"
                  ).count()

                  print(
                      f"Espera {intento}/10 | "
                      f"videos={videos} | "
                      f"imagenes={story_images}"
                  )

                  if (
                      videos > 0
                      or story_images > 0
                  ):
                      print(
                          "✅ Se detectaron "
                          "resultados multimedia."
                      )

                      return True

              print(
                  "⚠️ No se detectaron multimedia "
                  "con los selectores principales."
              )

              # No abandonamos inmediatamente.
              # El colector hará una inspección adicional.

              return True


          # ============================================================
          # COLECTOR DE STORIES
          # ============================================================

          def collect_media(page):

              print(
                  "Buscando multimedia de Stories..."
              )

              result = page.evaluate(
                  """
                  () => {

                      const output = [];
                      const seen = new Set();

                      // =================================================
                      // 1. VIDEOS REALES
                      //
                      // SSSInstagram está cargando el video real
                      // directamente mediante:
                      //
                      // <video src="...mp4">
                      //
                      // No utilizamos poster.
                      // =================================================

                      const videos = Array.from(
                          document.querySelectorAll(
                              'video[src]'
                          )
                      );

                      for (const video of videos) {

                          const src =
                              video.getAttribute('src') || '';

                          if (!src) {
                              continue;
                          }

                          const lower =
                              src.toLowerCase();

                          // Debe ser una URL de video real.
                          if (
                              !lower.includes('.mp4')
                              &&
                              !lower.includes(
                                  'cdninstagram.com'
                              )
                          ) {
                              continue;
                          }

                          if (
                              src.startsWith('blob:')
                              ||
                              src.startsWith('data:')
                          ) {
                              continue;
                          }

                          // Buscar el elemento contenedor
                          // correspondiente a esta Story.
                          let container = video;

                          for (
                              let i = 0;
                              i < 10 && container;
                              i++
                          ) {

                              const text =
                                  (
                                      container.innerText
                                      || ''
                                  ).trim();

                              const aria =
                                  video.getAttribute(
                                      'aria-label'
                                  )
                                  || '';

                              // Evitamos elementos genéricos
                              // del sitio.
                              if (
                                  text.length > 0
                                  ||
                                  aria.length > 0
                              ) {
                                  break;
                              }

                              container =
                                  container.parentElement;
                          }

                          if (!seen.has(src)) {

                              seen.add(src);

                              output.push({
                                  type: 'video',
                                  url: src,
                                  preview: (
                                      video.getAttribute(
                                          'poster'
                                      ) || ''
                                  ),
                                  label: (
                                      video.getAttribute(
                                          'aria-label'
                                      ) || ''
                                  )
                              });
                          }
                      }


                      // =================================================
                      // 2. IMÁGENES DE STORIES
                      //
                      // MUY IMPORTANTE:
                      //
                      // Usamos exclusivamente:
                      //
                      // img.media-content__image
                      //
                      // y NO todos los img de la página.
                      //
                      // Así no entra:
                      // img.avatar__image
                      // logos
                      // iconos
                      // etc.
                      // =================================================

                      const images = Array.from(
                          document.querySelectorAll(
                              'img.media-content__image'
                          )
                      );

                      for (const img of images) {

                          const src =
                              img.getAttribute('src') || '';

                          if (!src) {
                              continue;
                          }

                          if (
                              src.startsWith('data:')
                              ||
                              src.startsWith('blob:')
                          ) {
                              continue;
                          }

                          // Si esta imagen está dentro de un
                          // contenedor que contiene un video,
                          // probablemente es el poster/preview
                          // de ese video.
                          //
                          // NO la agregamos.
                          let hasVideo = false;

                          let node = img;

                          for (
                              let i = 0;
                              i < 10 && node;
                              i++
                          ) {

                              if (
                                  node.querySelector &&
                                  node.querySelector(
                                      'video[src]'
                                  )
                              ) {
                                  hasVideo = true;
                                  break;
                              }

                              node =
                                  node.parentElement;
                          }

                          if (hasVideo) {
                              continue;
                          }

                          // Buscar enlace de descarga de esta
                          // Story, si existe.
                          let container = img;
                          let downloadUrl = '';

                          for (
                              let i = 0;
                              i < 10 && container;
                              i++
                          ) {

                              const download =
                                  container.querySelector(
                                      'a.download-btn[href]'
                                  );

                              if (download) {

                                  downloadUrl =
                                      download.getAttribute(
                                          'href'
                                      )
                                      || '';

                                  if (
                                      downloadUrl
                                      &&
                                      downloadUrl.includes(
                                          'media.sssinstagram.com/get'
                                      )
                                  ) {
                                      break;
                                  }

                                  downloadUrl = '';
                              }

                              container =
                                  container.parentElement;
                          }

                          const finalUrl =
                              downloadUrl || src;

                          if (
                              !finalUrl
                          ) {
                              continue;
                          }

                          if (
                              !seen.has(finalUrl)
                          ) {

                              seen.add(finalUrl);

                              output.push({
                                  type: 'photo',
                                  url: finalUrl,
                                  preview: src,
                                  label: (
                                      img.getAttribute(
                                          'alt'
                                      ) || ''
                                  )
                              });
                          }
                      }

                      return output;
                  }
                  """
              )

              print(
                  f"Multimedia encontrada inicialmente: "
                  f"{len(result)}"
              )

              videos = [
                  x for x in result
                  if x.get("type") == "video"
              ]

              photos = [
                  x for x in result
                  if x.get("type") == "photo"
              ]

              print(
                  f"  🎥 Videos: {len(videos)}"
              )

              print(
                  f"  📸 Fotos: {len(photos)}"
              )

              return result


          # ============================================================
          # SCROLL INTERNO DE STORIES
          # ============================================================

          def scroll_internal_containers(
              page,
              collected
          ):

              print(
                  "Buscando contenedores con scroll interno..."
              )

              stable_rounds = 0

              for ronda in range(1, 21):

                  before = len(collected)

                  moved = page.evaluate(
                      """
                      () => {

                          const elements =
                              Array.from(
                                  document.querySelectorAll('*')
                              );

                          const scrollables =
                              elements.filter(el => {

                                  const style =
                                      getComputedStyle(el);

                                  return (
                                      el.scrollHeight >
                                      el.clientHeight + 100
                                      &&
                                      (
                                          style.overflowY === 'auto'
                                          ||
                                          style.overflowY === 'scroll'
                                          ||
                                          style.overflow === 'auto'
                                          ||
                                          style.overflow === 'scroll'
                                      )
                                  );
                              });

                          let movedCount = 0;

                          for (
                              const el of scrollables
                          ) {

                              const oldTop =
                                  el.scrollTop;

                              const amount =
                                  Math.max(
                                      500,
                                      Math.floor(
                                          el.clientHeight
                                          * 0.85
                                      )
                                  );

                              el.scrollTop =
                                  Math.min(
                                      oldTop + amount,
                                      el.scrollHeight
                                  );

                              if (
                                  el.scrollTop !==
                                  oldTop
                              ) {
                                  movedCount++;
                              }
                          }

                          return movedCount;
                      }
                      """
                  )

                  time.sleep(1.5)

                  new_items =
                      collect_media(page)

                  for item in new_items:

                      key = (
                          item.get("type"),
                          item.get("url")
                      )

                      already = any(
                          (
                              x.get("type"),
                              x.get("url")
                          ) == key
                          for x in collected
                      )

                      if not already:
                          collected.append(item)

                  added = (
                      len(collected) - before
                  )

                  print(
                      f"Scroll {ronda}/20 | "
                      f"movidos={moved} | "
                      f"nuevos={added} | "
                      f"total={len(collected)}"
                  )

                  if added == 0 and moved == 0:
                      stable_rounds += 1
                  else:
                      stable_rounds = 0

                  if stable_rounds >= 2:
                      print(
                          "⏹️ No aparecen más "
                          "Stories nuevas."
                      )
                      break

              return collected


          # ============================================================
          # DESCARGAR MEDIA
          # ============================================================

          def download_media(
              url,
              account,
              index
          ):

              DOWNLOAD_DIR.mkdir(
                  parents=True,
                  exist_ok=True
              )

              print(
                  f"Descargando media {index} "
                  f"de @{account}"
              )

              print(
                  f"URL: {url[:250]}"
              )

              try:

                  response = requests.get(
                      url,
                      timeout=120,
                      headers={
                          "User-Agent": (
                              "Mozilla/5.0 "
                              "(Windows NT 10.0; Win64; x64) "
                              "AppleWebKit/537.36 "
                              "(KHTML, like Gecko) "
                              "Chrome/131.0 Safari/537.36"
                          )
                      }
                  )

                  print(
                      f"HTTP: {response.status_code}"
                  )

                  response.raise_for_status()

                  content_type = (
                      response.headers.get(
                          "Content-Type",
                          ""
                      )
                  )

                  print(
                      f"Content-Type: {content_type}"
                  )

                  extension = get_extension(
                      content_type,
                      url
                  )

                  filename = (
                      f"{account}_"
                      f"{index}_"
                      f"{int(time.time() * 1000)}"
                      f"{extension}"
                  )

                  path = (
                      DOWNLOAD_DIR /
                      filename
                  )

                  with open(
                      path,
                      "wb"
                  ) as f:
                      f.write(response.content)

                  size = path.stat().st_size

                  print(
                      f"Archivo descargado: "
                      f"{path}"
                  )

                  print(
                      f"Tamaño: {size} bytes"
                  )

                  if size < 1000:
                      print(
                          "⚠️ Archivo sospechosamente "
                          "pequeño."
                      )

                  return path, content_type

              except Exception as e:

                  print(
                      f"❌ Error descargando media: "
                      f"{e}"
                  )

                  return None, None


          # ============================================================
          # PROCESAR UNA CUENTA
          # ============================================================

          def process_account(
              page,
              account,
              state
          ):

              print()
              print("=" * 50)
              print(
                  f"CUENTA: {account}"
              )
              print("=" * 50)

              account_state = state.get(
                  account,
                  {}
              )

              known_hashes = set(
                  account_state.get(
                      "hashes",
                      []
                  )
              )

              initialized = bool(
                  account_state.get(
                      "initialized",
                      False
                  )
              )

              print(
                  f"Hashes conocidos: "
                  f"{len(known_hashes)}"
              )

              print(
                  f"Cuenta inicializada: "
                  f"{initialized}"
              )

              if not open_stories(
                  page,
                  account
              ):
                  return 0

              time.sleep(2)

              # --------------------------------------------------------
              # Primera recolección
              # --------------------------------------------------------

              media = collect_media(page)

              # --------------------------------------------------------
              # Scroll interno para cargar Stories adicionales
              # --------------------------------------------------------

              media = scroll_internal_containers(
                  page,
                  media
              )

              # --------------------------------------------------------
              # Eliminar duplicados por URL
              # --------------------------------------------------------

              unique = []

              seen = set()

              for item in media:

                  key = (
                      item.get("type"),
                      item.get("url")
                  )

                  if key in seen:
                      continue

                  seen.add(key)

                  unique.append(item)

              media = unique

              videos = [
                  x for x in media
                  if x.get("type") == "video"
              ]

              photos = [
                  x for x in media
                  if x.get("type") == "photo"
              ]

              print()
              print(
                  f"Stories multimedia encontradas: "
                  f"{len(media)}"
              )

              print(
                  f"  🎥 Videos: {len(videos)}"
              )

              print(
                  f"  📸 Fotos: {len(photos)}"
              )

              if not media:

                  print(
                      "⚠️ No se encontró multimedia "
                      "para esta cuenta."
                  )

                  return 0

              # --------------------------------------------------------
              # Descargar y calcular hashes
              # --------------------------------------------------------

              pending = []

              for index, item in enumerate(
                  media,
                  start=1
              ):

                  media_type = item.get(
                      "type"
                  )

                  url = item.get(
                      "url"
                  )

                  if not url:
                      continue

                  path, content_type = (
                      download_media(
                          url,
                          account,
                          index
                      )
                  )

                  if path is None:
                      continue

                  file_hash = file_sha256(
                      path
                  )

                  print(
                      f"SHA-256: {file_hash}"
                  )

                  # ----------------------------------------------------
                  # Cuenta nueva:
                  #
                  # Las Stories existentes se convierten en baseline.
                  # ----------------------------------------------------

                  if not initialized:

                      print(
                          "🆕 Cuenta nueva: "
                          "Story agregada al estado "
                          "sin enviarla."
                      )

                      known_hashes.add(
                          file_hash
                      )

                      path.unlink(
                          missing_ok=True
                      )

                      continue

                  # ----------------------------------------------------
                  # Story ya conocida
                  # ----------------------------------------------------

                  if (
                      file_hash in known_hashes
                      and not FORCE_RESEND
                  ):

                      print(
                          "⏭️ Esta Story ya fue enviada."
                      )

                      path.unlink(
                          missing_ok=True
                      )

                      continue

                  # ----------------------------------------------------
                  # FORCE_RESEND
                  # ----------------------------------------------------

                  if (
                      file_hash in known_hashes
                      and FORCE_RESEND
                  ):

                      print(
                          "🔄 MODO PRUEBA: "
                          "esta Story ya existe "
                          "en el estado, "
                          "pero será reenviada."
                      )

                  pending.append(
                      (
                          path,
                          media_type,
                          file_hash
                      )
                  )

              # --------------------------------------------------------
              # Actualizar baseline de cuenta nueva
              # --------------------------------------------------------

              if not initialized:

                  state[account] = {
                      "initialized": True,
                      "hashes": list(
                          known_hashes
                      )[-100:]
                  }

                  print(
                      f"Baseline creada para "
                      f"@{account}: "
                      f"{len(known_hashes)} hashes."
                  )

                  return 0

              # --------------------------------------------------------
              # Enviar pendientes
              # --------------------------------------------------------

              print()
              print(
                  f"Stories para enviar: "
                  f"{len(pending)}"
              )

              sent = 0

              for (
                  path,
                  media_type,
                  file_hash
              ) in pending:

                  print()
                  print(
                      f"Enviando Story de "
                      f"@{account}"
                  )

                  print(
                      f"Tipo: {media_type}"
                  )

                  print(
                      f"Archivo: {path}"
                  )

                  success = send_media(
                      path,
                      account,
                      media_type
                  )

                  if success:

                      print(
                          "✅ Telegram confirmó "
                          "el envío."
                      )

                      # ------------------------------------------------
                      # MUY IMPORTANTE:
                      #
                      # Solo agregamos el hash al estado
                      # DESPUÉS de que Telegram confirme.
                      # ------------------------------------------------

                      known_hashes.add(
                          file_hash
                      )

                      sent += 1

                  else:

                      print(
                          "❌ Telegram NO confirmó "
                          "el envío."
                      )

                  path.unlink(
                      missing_ok=True
                  )

              # --------------------------------------------------------
              # Guardar máximo 100 hashes
              # --------------------------------------------------------

              state[account] = {
                  "initialized": True,
                  "hashes": list(
                      known_hashes
                  )[-100:]
              }

              print()
              print(
                  f"Estado de @{account}: "
                  f"{len(known_hashes)} hashes."
              )

              print(
                  f"Enviadas correctamente: "
                  f"{sent}"
              )

              return sent


          # ============================================================
          # MAIN
          # ============================================================

          def main():

              print("=" * 50)
              print(
                  "MONITOR DE INSTAGRAM STORIES"
              )
              print("=" * 50)

              accounts = load_accounts()

              print(
                  f"Cuentas a procesar: "
                  f"{len(accounts)}"
              )

              for account in accounts:
                  print(
                      f"  - @{account}"
                  )

              print("=" * 50)

              if not TELEGRAM_BOT_TOKEN:
                  raise RuntimeError(
                      "Falta TELEGRAM_BOT_TOKEN"
                  )

              if not TELEGRAM_CHAT_ID:
                  raise RuntimeError(
                      "Falta TELEGRAM_CHAT_ID"
                  )

              state = load_state()

              total_sent = 0

              DOWNLOAD_DIR.mkdir(
                  parents=True,
                  exist_ok=True
              )

              with sync_playwright() as p:

                  browser = p.chromium.launch(
                      headless=True
                  )

                  page = browser.new_page(
                      viewport={
                          "width": 1440,
                          "height": 1200
                      }
                  )

                  page.set_default_timeout(
                      30000
                  )

                  for account in accounts:

                      try:

                          sent = process_account(
                              page,
                              account,
                              state
                          )

                          total_sent += sent

                      except Exception as e:

                          print()
                          print(
                              f"❌ Error procesando "
                              f"@{account}:"
                          )

                          print(e)

                      # ------------------------------------------------
                      # Limpiar página antes de la siguiente cuenta.
                      # ------------------------------------------------

                      try:
                          page.goto(
                              "about:blank"
                          )
                      except Exception:
                          pass

                  browser.close()

              # --------------------------------------------------------
              # Guardar estado
              # --------------------------------------------------------

              save_state(state)

              print()
              print("=" * 50)
              print("RESUMEN")
              print("=" * 50)

              print(
                  f"Cuentas procesadas: "
                  f"{len(accounts)}"
              )

              print(
                  f"Stories enviadas: "
                  f"{total_sent}"
              )

              print(
                  f"Estado guardado en: "
                  f"{STATE_FILE}"
              )

              print("=" * 50)


          if __name__ == "__main__":
              main()

          PY

      # ============================================================
      # 4. COMPROBAR SINTAXIS PYTHON
      # ============================================================
      - name: Comprobar sintaxis
        run: |
          python -m py_compile monitor_instagram.py

      # ============================================================
      # 5. EJECUTAR MONITOR
      # ============================================================
      - name: Ejecutar monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -u monitor_instagram.py

      # ============================================================
      # 6. GUARDAR ESTADO EN GITHUB
      # ============================================================
      - name: Guardar estado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/instagram-state.json

          if git diff --cached --quiet; then
            echo "No hay cambios en el estado."
          else
            git commit -m "Actualizar estado de Instagram Stories"
            git push
          fi

      # ============================================================
      # 7. LIMPIAR ARCHIVOS TEMPORALES
      # ============================================================
      - name: Limpiar descargas temporales
        if: always()
        run: |
          rm -rf downloads
          rm -f monitor_instagram.py
