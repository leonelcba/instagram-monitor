                      )

                      print(
                          f"  id: "
                          f"{item['id']!r}"
                      )

                      print(
                          f"  attribute: "
                          f"{item['attribute']!r}"
                      )

                      print(
                          f"  value: "
                          f"{item['value'][:1200]}"
                      )

              except Exception as e:

                  print(
                      f"Error creando resumen: {e}"
                  )

              # ======================================================
