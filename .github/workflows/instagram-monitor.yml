name: Diagnóstico Stories SSSInstagram

on:
  workflow_dispatch:

jobs:
  diagnostico:
    runs-on: ubuntu-latest

    steps:

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Diagnosticar Story Saver
        run: |
          cat > diagnostico.py <<'PY'
          from playwright.sync_api import sync_playwright
          import time
          import json

          ACCOUNT = "laderechadiario"
          URL = "https://sssinstagram.com/es/story-saver"

          print("=" * 80)
          print("DIAGNÓSTICO ESPECÍFICO DE STORIES")
          print("=" * 80)
          print(f"Cuenta: @{ACCOUNT}")
          print(f"URL: {URL}")
          print()

          with sync_playwright() as p:

              browser = p.chromium.launch(
                  headless=True
              )

              context = browser.new_context(
                  viewport={
                      "width": 1366,
                      "height": 900
                  },
                  user_agent=(
                      "Mozilla/5.0 "
                      "(X11; Linux x86_64) "
                      "AppleWebKit/537.36 "
                      "(KHTML, like Gecko) "
                      "Chrome/139.0.0.0 "
                      "Safari/537.36"
                  )
              )

              page = context.new_page()

              # ==========================================================
              # 1. ABRIR STORY SAVER
              # ==========================================================

              print("1. Abriendo Story Saver...")

              page.goto(
                  URL,
                  wait_until="domcontentloaded",
                  timeout=60000
              )

              page.wait_for_timeout(3000)

              print("Título:")
              print(page.title())

              print("URL:")
              print(page.url)

              print()

              # ==========================================================
              # 2. ANALIZAR FORMULARIOS
              # ==========================================================

              print("=" * 80)
              print("2. FORMULARIOS")
              print("=" * 80)

              forms = page.locator("form")

              print(
                  f"Cantidad de formularios: {forms.count()}"
              )

              for i in range(forms.count()):

                  form = forms.nth(i)

                  try:
                      print()
                      print(f"FORM #{i}")

                      print(
                          "action:",
                          form.get_attribute("action")
                      )

                      print(
                          "method:",
                          form.get_attribute("method")
                      )

                      print(
                          "texto:",
                          form.inner_text()[:500]
                      )

                      print(
                          "HTML:"
                      )

                      print(
                          form.evaluate(
                              "el => el.outerHTML"
                          )[:3000]
                      )

                  except Exception as e:

                      print(
                          "Error:",
                          e
                      )

              print()

              # ==========================================================
              # 3. INPUTS
              # ==========================================================

              print("=" * 80)
              print("3. INPUTS")
              print("=" * 80)

              inputs = page.locator("input")

              print(
                  f"Cantidad de inputs: {inputs.count()}"
              )

              for i in range(inputs.count()):

                  el = inputs.nth(i)

                  try:

                      print()
                      print(
                          f"INPUT #{i}"
                      )

                      print(
                          el.evaluate(
                              """el => {
                                  const r = {};
                                  for (const a of el.attributes) {
                                      r[a.name] = a.value;
                                  }
                                  return r;
                              }"""
                          )
                      )

                  except:

                      pass

              print()

              # ==========================================================
              # 4. IDENTIFICAR INPUT REAL
              # ==========================================================

              print("=" * 80)
              print("4. BUSCANDO INPUT DEL STORY SAVER")
              print("=" * 80)

              input_box = None

              for i in range(inputs.count()):

                  el = inputs.nth(i)

                  try:

                      typ = (
                          el.get_attribute("type")
                          or ""
                      ).lower()

                      placeholder = (
                          el.get_attribute("placeholder")
                          or ""
                      ).lower()

                      name = (
                          el.get_attribute("name")
                          or ""
                      ).lower()

                      if typ in [
                          "",
                          "text",
                          "url"
                      ]:

                          input_box = el

                          print(
                              f"Input elegido: #{i}"
                          )

                          print(
                              "type:",
                              typ
                          )

                          print(
                              "placeholder:",
                              placeholder
                          )

                          print(
                              "name:",
                              name
                          )

                          break

                  except:

                      pass

              if input_box is None:

                  print(
                      "❌ NO SE ENCONTRÓ EL INPUT"
                  )

                  browser.close()

                  raise SystemExit(1)

              # ==========================================================
              # 5. FORMULARIO ASOCIADO
              # ==========================================================

              print()
              print("=" * 80)
              print("5. FORMULARIO ASOCIADO AL INPUT")
              print("=" * 80)

              form = None

              try:

                  form = input_box.locator(
                      "xpath=ancestor::form[1]"
                  )

                  print(
                      "Form encontrado:",
                      form.count()
                  )

                  if form.count():

                      print(
                          form.evaluate(
                              "el => el.outerHTML"
                          )[:8000]
                      )

              except Exception as e:

                  print(
                      "Error:",
                      e
                  )

              if form is None or form.count() == 0:

                  print(
                      "❌ El input no pertenece a ningún form."
                  )

                  browser.close()

                  raise SystemExit(1)

              # ==========================================================
              # 6. INTRODUCIR CUENTA
              # ==========================================================

              profile_url = (
                  f"https://www.instagram.com/"
                  f"{ACCOUNT}/"
              )

              print()
              print("=" * 80)
              print("6. INTRODUCIENDO PERFIL")
              print("=" * 80)

              print(
                  "Perfil:",
                  profile_url
              )

              input_box.fill(
                  profile_url
              )

              page.wait_for_timeout(1000)

              print(
                  "Valor actual:",
                  input_box.input_value()
              )

              # ==========================================================
              # 7. BOTONES DEL FORM
              # ==========================================================

              print()
              print("=" * 80)
              print("7. BOTONES DEL FORMULARIO")
              print("=" * 80)

              buttons = form.locator(
                  "button, input[type='submit'], a"
              )

              print(
                  "Cantidad:",
                  buttons.count()
              )

              for i in range(buttons.count()):

                  el = buttons.nth(i)

                  try:

                      print()
                      print(
                          f"BOTÓN #{i}"
                      )

                      print(
                          "tag:",
                          el.evaluate(
                              "el => el.tagName"
                          )
                      )

                      print(
                          "text:",
                          el.inner_text()
                      )

                      print(
                          "type:",
                          el.get_attribute("type")
                      )

                      print(
                          "class:",
                          el.get_attribute("class")
                      )

                      print(
                          "href:",
                          el.get_attribute("href")
                      )

                      print(
                          "HTML:",
                          el.evaluate(
                              "el => el.outerHTML"
                          )[:3000]
                      )

                  except Exception as e:

                      print(
                          "Error:",
                          e
                      )

              # ==========================================================
              # 8. ENVIAR FORMULARIO
              # ==========================================================

              print()
              print("=" * 80)
              print("8. ENVIANDO FORMULARIO")
              print("=" * 80)

              clicked = False

              # ----------------------------------------------------------
              # Primero intentar submit real
              # ----------------------------------------------------------

              try:

                  submit = form.locator(
                      "button[type='submit'], "
                      "input[type='submit']"
                  )

                  print(
                      "Submits encontrados:",
                      submit.count()
                  )

                  if submit.count():

                      print(
                          "Usando submit real del formulario."
                      )

                      for i in range(
                          submit.count()
                      ):

                          try:

                              print(
                                  f"Submit #{i}:",
                                  submit.nth(i).evaluate(
                                      "el => el.outerHTML"
                                  )[:2000]
                              )

                          except:

                              pass

                      submit.first.click()

                      clicked = True

              except Exception as e:

                  print(
                      "Error con submit:",
                      e
                  )

              # ----------------------------------------------------------
              # Si no existe submit, buscar Descargar dentro del form
              # ----------------------------------------------------------

              if not clicked:

                  try:

                      descargar = form.get_by_text(
                          "Descargar",
                          exact=True
                      )

                      print(
                          "Descargar dentro del form:",
                          descargar.count()
                      )

                      if descargar.count():

                          print(
                              "Usando Descargar del formulario."
                          )

                          descargar.first.click()

                          clicked = True

                  except Exception as e:

                      print(
                          "Error con Descargar:",
                          e
                      )

              if not clicked:

                  print(
                      "❌ NO SE PUDO ENVIAR EL FORMULARIO"
                  )

                  browser.close()

                  raise SystemExit(1)

              print(
                  "✅ Formulario enviado."
              )

              # ==========================================================
              # 9. ESPERAR RESULTADO
              # ==========================================================

              print()
              print("=" * 80)
              print("9. ESPERANDO RESULTADO")
              print("=" * 80)

              for i in range(1, 11):

                  page.wait_for_timeout(2000)

                  print()
                  print(
                      f"--- Espera {i}/10 ---"
                  )

                  print(
                      "URL:",
                      page.url
                  )

                  print(
                      "IMG:",
                      page.locator("img").count()
                  )

                  print(
                      "VIDEO:",
                      page.locator("video").count()
                  )

                  print(
                      "SOURCE:",
                      page.locator("source").count()
                  )

                  print(
                      "A:",
                      page.locator("a").count()
                  )

              # ==========================================================
              # 10. BUSCAR RESULTADO DEL PERFIL
              # ==========================================================

              print()
              print("=" * 80)
              print("10. ELEMENTOS DEL RESULTADO")
              print("=" * 80)

              texto = page.get_by_text(
                  ACCOUNT,
                  exact=False
              )

              print(
                  "Elementos con nombre de cuenta:",
                  texto.count()
              )

              for i in range(
                  min(texto.count(), 20)
              ):

                  try:

                      el = texto.nth(i)

                      print()
                      print(
                          f"ELEMENTO CUENTA #{i}"
                      )

                      print(
                          "tag:",
                          el.evaluate(
                              "el => el.tagName"
                          )
                      )

                      print(
                          "text:",
                          el.inner_text()[:1000]
                      )

                      print(
                          "HTML:"
                      )

                      print(
                          el.evaluate(
                              "el => el.outerHTML"
                          )[:5000]
                      )

                  except:

                      pass

              # ==========================================================
              # 11. CONTENEDORES DE RESULTADOS
              # ==========================================================

              print()
              print("=" * 80)
              print("11. CONTENEDORES DE RESULTADOS")
              print("=" * 80)

              candidates = page.locator(
                  "div, article, section, li"
              )

              encontrados = 0

              total_candidates = candidates.count()

              print(
                  "Elementos candidatos:",
                  total_candidates
              )

              for i in range(
                  min(total_candidates, 1500)
              ):

                  el = candidates.nth(i)

                  try:

                      text = (
                          el.inner_text(
                              timeout=100
                          )
                          or ""
                      )

                      if "Descargar" not in text:

                          continue

                      imgs = el.locator(
                          "img"
                      ).count()

                      videos = el.locator(
                          "video"
                      ).count()

                      sources = el.locator(
                          "source"
                      ).count()

                      links = el.locator(
                          "a[href]"
                      ).count()

                      if (
                          imgs > 0
                          or videos > 0
                          or sources > 0
                          or links > 0
                      ):

                          encontrados += 1

                          print()
                          print(
                              f"CONTENEDOR #{i}"
                          )

                          print(
                              "Texto:",
                              text[:1000]
                          )

                          print(
                              "IMG:",
                              imgs
                          )

                          print(
                              "VIDEO:",
                              videos
                          )

                          print(
                              "SOURCE:",
                              sources
                          )

                          print(
                              "LINKS:",
                              links
                          )

                          print(
                              "HTML:"
                          )

                          print(
                              el.evaluate(
                                  "el => el.outerHTML"
                              )[:8000]
                          )

                          if encontrados >= 20:

                              break

                  except:

                      pass

              print()
              print(
                  "Contenedores encontrados:",
                  encontrados
              )

              # ==========================================================
              # 12. BUSCAR MEDIA
              # ==========================================================

              print()
              print("=" * 80)
              print("12. MEDIA EN LA PÁGINA")
              print("=" * 80)

              selectors = [
                  "img",
                  "video",
                  "source",
                  "a[href]"
              ]

              for selector in selectors:

                  locator = page.locator(
                      selector
                  )

                  print()
                  print(
                      selector,
                      "=>",
                      locator.count()
                  )

                  for i in range(
                      min(locator.count(), 200)
                  ):

                      el = locator.nth(i)

                      try:

                          attrs = el.evaluate(
                              """el => {
                                  const r = {};
                                  for (const a of el.attributes) {
                                      r[a.name] = a.value;
                                  }
                                  return r;
                              }"""
                          )

                          serialized = json.dumps(
                              attrs,
                              ensure_ascii=False
                          )

                          if (
                              "media.sssinstagram.com"
                              in serialized
                          ):

                              print()
                              print(
                                  f"{selector} #{i}"
                              )

                              print(
                                  serialized[:5000]
                              )

                      except:

                          pass

              # ==========================================================
              # 13. BOTONES DESCARGAR
              # ==========================================================

              print()
              print("=" * 80)
              print("13. TODOS LOS BOTONES 'DESCARGAR'")
              print("=" * 80)

              descargar_all = page.get_by_text(
                  "Descargar",
                  exact=True
              )

              print(
                  "Cantidad:",
                  descargar_all.count()
              )

              for i in range(
                  min(descargar_all.count(), 50)
              ):

                  try:

                      el = descargar_all.nth(i)

                      print()
                      print(
                          f"DESCARGAR #{i}"
                      )

                      print(
                          "tag:",
                          el.evaluate(
                              "el => el.tagName"
                          )
                      )

                      print(
                          "class:",
                          el.get_attribute("class")
                      )

                      print(
                          "href:",
                          el.get_attribute("href")
                      )

                      print(
                          "HTML:"
                      )

                      print(
                          el.evaluate(
                              "el => el.outerHTML"
                          )[:5000]
                      )

                  except:

                      pass

              # ==========================================================
              # 14. TEXTO VISIBLE
              # ==========================================================

              print()
              print("=" * 80)
              print("14. TEXTO VISIBLE")
              print("=" * 80)

              body_text = page.locator(
                  "body"
              ).inner_text()

              print(
                  body_text[:20000]
              )

              # ==========================================================
              # 15. GUARDAR HTML Y SCREENSHOT
              # ==========================================================

              print()
              print("=" * 80)
              print("15. GUARDANDO HTML Y SCREENSHOT")
              print("=" * 80)

              with open(
                  "sssinstagram-debug.html",
                  "w",
                  encoding="utf-8"
              ) as f:

                  f.write(
                      page.content()
                  )

              page.screenshot(
                  path="sssinstagram-debug.png",
                  full_page=True
              )

              print(
                  "HTML guardado."
              )

              print(
                  "Screenshot guardado."
              )

              # ==========================================================
              # FINAL
              # ==========================================================

              print()
              print("=" * 80)
              print("DIAGNÓSTICO TERMINADO")
              print("=" * 80)

              print(
                  "NO se modificó el monitor."
              )

              print(
                  "NO se modificó instagram-state.json."
              )

              print(
                  "NO se envió nada a Telegram."
              )

              browser.close()
          PY

          python -u diagnostico.py

      - name: Guardar diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-sssinstagram
          path: |
            sssinstagram-debug.html
            sssinstagram-debug.png
          if-no-files-found: ignore
