name: Instagram Monitor

on:
  workflow_dispatch:

jobs:
  inspect-sssinstagram:
    runs-on: ubuntu-latest

    steps:
      - name: Instalar Python y Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Abrir SSSInstagram y buscar perfil
        run: |
          cat > test_sssinstagram.py <<'PY'
          from playwright.sync_api import sync_playwright
          import re
          import time

          INSTAGRAM_PROFILE = "https://www.instagram.com/zero.design.oficial/"
          SSS_URL = "https://sssinstagram.com/es/story-saver"

          with sync_playwright() as p:

              browser = p.chromium.launch(
                  headless=True
              )

              page = browser.new_page(
                  viewport={
                      "width": 1366,
                      "height": 900
                  },
                  user_agent=(
                      "Mozilla/5.0 (X11; Linux x86_64) "
                      "AppleWebKit/537.36 "
                      "(KHTML, like Gecko) "
                      "Chrome/139.0.0.0 Safari/537.36"
                  )
              )

              print("======================================")
              print("ABRIENDO SSSINSTAGRAM")
              print("======================================")

              page.goto(
                  SSS_URL,
                  wait_until="domcontentloaded",
                  timeout=60000
              )

              print("Página cargada:")
              print(page.url)

              # Mostrar inputs encontrados
              print("\nINPUTS ENCONTRADOS:")
              for i, element in enumerate(page.locator("input").all()):
                  try:
                      print(
                          i,
                          element.get_attribute("name"),
                          element.get_attribute("placeholder"),
                          element.get_attribute("type")
                      )
                  except:
                      pass

              # Buscar el primer campo de texto
              input_box = page.locator(
                  "input[type='text'], input[type='url']"
              ).first

              if not input_box.is_visible():
                  raise Exception(
                      "No se encontró el campo para introducir la URL."
                  )

              print("\nIntroduciendo perfil:")
              print(INSTAGRAM_PROFILE)

              input_box.fill(INSTAGRAM_PROFILE)

              # Buscar botones
              print("\nBOTONES ENCONTRADOS:")

              buttons = page.locator("button")

              for i in range(buttons.count()):
                  try:
                      text = buttons.nth(i).inner_text()
                      print(i, repr(text))
                  except:
                      pass

              # Intentar encontrar el botón Descargar
              download_button = page.get_by_role(
                  "button",
                  name=re.compile("descargar", re.I)
              ).first

              if not download_button.is_visible():
                  # Algunas versiones pueden usar un enlace
                  download_button = page.get_by_text(
                      re.compile("descargar", re.I)
                  ).first

              if not download_button.is_visible():
                  raise Exception(
                      "No se encontró el botón Descargar."
                  )

              print("\nPulsando Descargar...")

              download_button.click()

              # Esperar que la página procese la consulta
              print("Esperando resultados...")

              page.wait_for_timeout(10000)

              print("\n======================================")
              print("URL FINAL")
              print("======================================")
              print(page.url)

              # Guardar HTML para inspección
              html = page.content()

              with open("sssinstagram-result.html", "w", encoding="utf-8") as f:
                  f.write(html)

              # Captura de pantalla
              page.screenshot(
                  path="sssinstagram-result.png",
                  full_page=True
              )

              print("\n======================================")
              print("ENLACES ENCONTRADOS")
              print("======================================")

              links = page.locator("a")

              found = set()

              for i in range(links.count()):

                  link = links.nth(i)

                  try:
                      href = link.get_attribute("href")
                      text = link.inner_text().strip()

                      if href and href not in found:

                          found.add(href)

                          print(
                              f"[{i}] "
                              f"texto={text!r} "
                              f"url={href}"
                          )

                  except:
                      pass

              print("\n======================================")
              print("URLS QUE PARECEN ARCHIVOS")
              print("======================================")

              for href in found:

                  lower = href.lower()

                  if any(
                      extension in lower
                      for extension in [
                          ".jpg",
                          ".jpeg",
                          ".png",
                          ".webp",
                          ".mp4",
                          ".mov"
                      ]
                  ):

                      print(href)

              print("\n======================================")
              print("TEXTO DE LA PÁGINA")
              print("======================================")

              text = page.locator("body").inner_text()

              print(text[:15000])

              browser.close()
          PY

          python test_sssinstagram.py

      - name: Mostrar archivos generados
        if: always()
        run: |
          echo "Archivos generados:"
          ls -lh

      - name: Subir resultados de diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sssinstagram-diagnostic
          path: |
            sssinstagram-result.html
            sssinstagram-result.png
          retention-days: 1
