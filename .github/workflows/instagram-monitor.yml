name: Instagram Stories Monitor

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Playwright
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium

      - name: Monitorizar Stories
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          python3 <<'PY'
          import asyncio
          import hashlib
          import json
          import os
          import re
          import subprocess
          import tempfile
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          from playwright.async_api import async_playwright


          # ==============================================================
          # CONFIGURACIÓN
          # ==============================================================

          ACCOUNTS_FILE = "data/instagram-accounts.json"
          STATE_FILE = "data/instagram-state.json"

          SNAPGRAM_URL = (
              "https://www.snapgram.io/"
              "instagram-story-downloader/"
          )

          TELEGRAM_BOT_TOKEN = os.environ["TELEGRAM_BOT_TOKEN"]
          TELEGRAM_CHAT_ID = os.environ["TELEGRAM_CHAT_ID"]

          # SOLO PARA ESTA PRIMERA PRUEBA REAL.
          # Después de comprobar Telegram, cambiar a False.
          FORCE_RESEND = True

          MAX_HASHES_PER_ACCOUNT = 100

          USER_AGENT = (
              "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
              "AppleWebKit/537.36 (KHTML, like Gecko) "
              "Chrome/139.0.0.0 Safari/537.36"
          )


          # ==============================================================
          # UTILIDADES
          # ==============================================================

          def load_json(path, default):

              if not os.path.exists(path):
                  return default

              try:
                  with open(path, "r", encoding="utf-8") as f:
                      return json.load(f)

              except Exception as e:
                  print(f"⚠️ Error leyendo {path}: {e}")
                  return default


          def save_json(path, data):

              os.makedirs(
                  os.path.dirname(path),
                  exist_ok=True
              )

              temp_path = path + ".tmp"

              with open(
                  temp_path,
                  "w",
                  encoding="utf-8"
              ) as f:

                  json.dump(
                      data,
                      f,
                      ensure_ascii=False,
                      indent=2
                  )

              os.replace(
                  temp_path,
                  path
              )


          def sha256_file(path):

              h = hashlib.sha256()

              with open(path, "rb") as f:

                  while True:

                      chunk = f.read(1024 * 1024)

                      if not chunk:
                          break

                      h.update(chunk)

              return h.hexdigest()


          def media_type_from_url(url):

              if not url:
                  return None

              path = urllib.parse.urlparse(url).path.lower()

              if ".mp4" in path:
                  return "video"

              if any(
                  ext in path
                  for ext in [
                      ".jpg",
                      ".jpeg",
                      ".png",
                      ".webp"
                  ]
              ):
                  return "photo"

              return None


          def validate_file(path, media_type):

              if not os.path.exists(path):
                  return False

              size = os.path.getsize(path)

              if size < 100:
                  return False

              with open(path, "rb") as f:
                  header = f.read(32)

              if media_type == "video":

                  # MP4 normalmente contiene "ftyp" dentro
                  # de los primeros bytes.
                  if b"ftyp" not in header:
                      return False

                  return True

              if media_type == "photo":

                  # JPEG
                  if header.startswith(b"\xff\xd8\xff"):
                      return True

                  # PNG
                  if header.startswith(
                      b"\x89PNG\r\n\x1a\n"
                  ):
                      return True

                  # WEBP
                  if (
                      header.startswith(b"RIFF")
                      and
                      b"WEBP" in header[:16]
                  ):
                      return True

                  return False

              return False


          # ==============================================================
          # TELEGRAM
          # ==============================================================

          def telegram_request(
              method,
              filename,
              media_type,
              caption
          ):

              if media_type == "video":
                  endpoint = (
                      f"https://api.telegram.org/"
                      f"bot{TELEGRAM_BOT_TOKEN}/sendVideo"
                  )
                  field_name = "video"

              else:
                  endpoint = (
                      f"https://api.telegram.org/"
                      f"bot{TELEGRAM_BOT_TOKEN}/sendPhoto"
                  )
                  field_name = "photo"

              boundary = (
                  "----PythonTelegramBoundary"
                  + hashlib.md5(
                      os.urandom(16)
                  ).hexdigest()
              )

              parts = []

              def add_text(name, value):

                  parts.append(
                      (
                          f"--{boundary}\r\n"
                          f'Content-Disposition: form-data; '
                          f'name="{name}"\r\n\r\n'
                          f"{value}\r\n"
                      ).encode()
                  )

              def add_file(name, path):

                  filename_only = os.path.basename(path)

                  header = (
                      f"--{boundary}\r\n"
                      f'Content-Disposition: form-data; '
                      f'name="{name}"; '
                      f'filename="{filename_only}"\r\n'
                      f"Content-Type: "
                  )

                  if media_type == "video":
                      header += "video/mp4"
                  else:
                      header += "image/jpeg"

                  header += "\r\n\r\n"

                  parts.append(header.encode())

                  with open(path, "rb") as f:
                      parts.append(f.read())

                  parts.append(b"\r\n")

              add_text(
                  "chat_id",
                  TELEGRAM_CHAT_ID
              )

              if caption:
                  add_text(
                      "caption",
                      caption
                  )

              if media_type == "video":
                  add_text(
                      "supports_streaming",
                      "true"
                  )

              add_file(
                  field_name,
                  filename
              )

              parts.append(
                  f"--{boundary}--\r\n".encode()
              )

              body = b"".join(parts)

              request = urllib.request.Request(
                  endpoint,
                  data=body,
                  method="POST"
              )

              request.add_header(
                  "Content-Type",
                  f"multipart/form-data; boundary={boundary}"
              )

              request.add_header(
                  "Content-Length",
                  str(len(body))
              )

              try:

                  with urllib.request.urlopen(
                      request,
                      timeout=120
                  ) as response:

                      response_body = response.read().decode(
                          "utf-8",
                          errors="replace"
                      )

                      print(
                          f"Telegram HTTP: {response.status}"
                      )

                      data = json.loads(
                          response_body
                      )

                      return (
                          response.status,
                          data
                      )

              except urllib.error.HTTPError as e:

                  body = e.read().decode(
                      "utf-8",
                      errors="replace"
                  )

                  print(
                      f"❌ Telegram HTTP ERROR: {e.code}"
                  )

                  print(body[:2000])

                  return (
                      e.code,
                      None
                  )

              except Exception as e:

                  print(
                      f"❌ Error Telegram: {e}"
                  )

                  return (
                      0,
                      None
                  )


          # ==============================================================
          # DESCARGA
          # ==============================================================

          def download_media(url, media_type, output):

              print(
                  f"Descargando {media_type}:"
              )

              print(
                  f"  Host: "
                  f"{urllib.parse.urlparse(url).netloc}"
              )

              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": USER_AGENT,
                      "Accept": "*/*",
                      "Referer": (
                          "https://www.instagram.com/"
                      )
                  }
              )

              try:

                  with urllib.request.urlopen(
                      request,
                      timeout=120
                  ) as response:

                      status = response.status

                      content_type = (
                          response.headers.get(
                              "Content-Type",
                              ""
                          ).lower()
                      )

                      print(
                          f"  HTTP: {status}"
                      )

                      print(
                          f"  Content-Type: "
                          f"{content_type}"
                      )

                      with open(
                          output,
                          "wb"
                      ) as f:

                          while True:

                              chunk = response.read(
                                  1024 * 1024
                              )

                              if not chunk:
                                  break

                              f.write(chunk)

                  size = os.path.getsize(
                      output
                  )

                  print(
                      f"  Tamaño: "
                      f"{size / 1024 / 1024:.2f} MB"
                  )

                  if media_type == "video":

                      if not content_type.startswith(
                          "video/"
                      ):
                          print(
                              "⚠️ Content-Type no es video/*"
                          )

                  elif media_type == "photo":

                      if not content_type.startswith(
                          "image/"
                      ):
                          print(
                              "⚠️ Content-Type no es image/*"
                          )

                  if not validate_file(
                      output,
                      media_type
                  ):

                      print(
                          "❌ VALIDACIÓN FALLIDA."
                      )

                      return False

                  print(
                      "✅ Archivo multimedia válido."
                  )

                  return True

              except Exception as e:

                  print(
                      f"❌ Error descargando: {e}"
                  )

                  return False


          # ==============================================================
          # PROCESAMIENTO DE UNA CUENTA
          # ==============================================================

          async def process_account(
              page,
              username,
              state
          ):

              print()
              print("=" * 75)
              print(f"CUENTA: @{username}")
              print("=" * 75)

              account_state = state.setdefault(
                  username,
                  {
                      "initialized": False,
                      "hashes": []
                  }
              )

              known_hashes = set(
                  account_state.get(
                      "hashes",
                      []
                  )
              )

              print(
                  f"Hashes conocidos: "
                  f"{len(known_hashes)}"
              )

              print(
                  f"Inicializada: "
                  f"{account_state.get('initialized', False)}"
              )

              api_body = None
              api_status = None

              async def response_handler(response):

                  nonlocal api_body
                  nonlocal api_status

                  if (
                      "api.sssgram.com/st-tik/ins/dl"
                      not in response.url
                  ):
                      return

                  print()
                  print(
                      ">>> API DE SNAPGRAM DETECTADA <<<"
                  )

                  api_status = response.status

                  print(
                      f"HTTP: {api_status}"
                  )

                  try:

                      api_body = await response.text()

                      print(
                          "Respuesta API recibida."
                      )

                  except Exception as e:

                      print(
                          f"❌ Error leyendo API: {e}"
                      )

              page.on(
                  "response",
                  response_handler
              )

              try:

                  await page.goto(
                      SNAPGRAM_URL,
                      wait_until="domcontentloaded",
                      timeout=60000
                  )

                  await page.wait_for_timeout(
                      3000
                  )

                  story_url = (
                      f"https://www.instagram.com/"
                      f"stories/{username}/"
                  )

                  print(
                      f"URL Stories: {story_url}"
                  )

                  inputs = page.locator(
                      "input"
                  )

                  input_count = await inputs.count()

                  target = None

                  for i in range(input_count):

                      try:

                          inp = inputs.nth(i)

                          if not await inp.is_visible():
                              continue

                          placeholder = (
                              await inp.get_attribute(
                                  "placeholder"
                              )
                          )

                          aria = (
                              await inp.get_attribute(
                                  "aria-label"
                              )
                          )

                          if (
                              placeholder
                              and
                              "paste" in placeholder.lower()
                          ):

                              target = inp
                              break

                          if (
                              aria
                              and
                              "paste" in aria.lower()
                          ):

                              target = inp
                              break

                      except Exception:
                          pass

                  if target is None:

                      print(
                          "❌ No se encontró el campo."
                      )

                      return

                  await target.fill(
                      story_url
                  )

                  print(
                      "Campo completado."
                  )

                  buttons = page.get_by_role(
                      "button",
                      name=re.compile(
                          r"download",
                          re.IGNORECASE
                      )
                  )

                  button_count = await buttons.count()

                  print(
                      f"Botones Download: "
                      f"{button_count}"
                  )

                  if button_count == 0:

                      print(
                          "❌ No se encontró "
                          "Download."
                      )

                      return

                  await buttons.first.click()

                  print(
                      "Download pulsado."
                  )

                  print(
                      "Esperando respuesta de API..."
                  )

                  for second in range(40):

                      await page.wait_for_timeout(
                          1000
                      )

                      if api_body is not None:
                          print(
                              f"API detectada después de "
                              f"{second + 1} segundos."
                          )
                          break

                      if second % 5 == 4:

                          print(
                              f"Esperando... "
                              f"{second + 1}/40"
                          )

                  if api_body is None:

                      print(
                          "❌ No se recibió la API."
                      )

                      return

                  if api_status != 200:

                      print(
                          f"❌ API HTTP {api_status}"
                      )

                      return

                  try:

                      data = json.loads(
                          api_body
                      )

                  except Exception as e:

                      print(
                          f"❌ JSON inválido: {e}"
                      )

                      return

                  if data.get("code") != 200:

                      print(
                          f"❌ API code: "
                          f"{data.get('code')}"
                      )

                      print(
                          f"msg: "
                          f"{data.get('msg')}"
                      )

                      return

                  result = data.get(
                      "result"
                  )

                  if not isinstance(
                      result,
                      dict
                  ):

                      print(
                          "❌ result inválido."
                      )

                      return

                  stories = result.get(
                      "insBos",
                      []
                  )

                  if not isinstance(
                      stories,
                      list
                  ):

                      print(
                          "❌ insBos inválido."
                      )

                      return

                  print()
                  print(
                      f"Stories encontrados: "
                      f"{len(stories)}"
                  )

                  # ------------------------------------------------------
                  # SI ES LA PRIMERA VEZ QUE SE CONOCE LA CUENTA:
                  # baseline sin enviar.
                  # ------------------------------------------------------

                  if not account_state.get(
                      "initialized",
                      False
                  ):

                      print(
                          "🆕 Cuenta sin inicializar."
                      )

                      print(
                          "Se establecerá baseline."
                      )

                      baseline = []

                      for story in stories:

                          if not isinstance(
                              story,
                              dict
                          ):
                              continue

                          story_id = story.get(
                              "id"
                          )

                          media_url = (
                              story.get(
                                  "originalUrl"
                              )
                              or
                              story.get(
                                  "url"
                              )
                          )

                          media_type = (
                              media_type_from_url(
                                  media_url
                              )
                          )

                          print(
                              f"  Baseline "
                              f"{story_id} "
                              f"tipo={media_type}"
                          )

                          # En el baseline usamos el ID del Story
                          # como referencia temporal. El hash real
                          # se incorporará cuando descarguemos en
                          # ejecuciones posteriores.
                          #
                          # No enviamos nada.
                          if story_id:
                              baseline.append(
                                  f"story:{story_id}"
                              )

                      account_state[
                          "initialized"
                      ] = True

                      account_state[
                          "baseline_story_ids"
                      ] = baseline

                      print(
                          "✅ Baseline establecido."
                      )

                      return

                  baseline_ids = set(
                      account_state.get(
                          "baseline_story_ids",
                          []
                      )
                  )

                  # ------------------------------------------------------
                  # PROCESAR STORIES
                  # ------------------------------------------------------

                  sent_count = 0
                  skipped_count = 0

                  with tempfile.TemporaryDirectory(
                      prefix="instagram-monitor-"
                  ) as temp_dir:

                      for index, story in enumerate(
                          stories,
                          1
                      ):

                          if not isinstance(
                              story,
                              dict
                          ):
                              continue

                          story_id = story.get(
                              "id"
                          )

                          media_url = (
                              story.get(
                                  "originalUrl"
                              )
                              or
                              story.get(
                                  "url"
                              )
                          )

                          media_type = (
                              media_type_from_url(
                                  media_url
                              )
                          )

                          print()
                          print(
                              "-" * 65
                          )

                          print(
                              f"STORY #{index}"
                          )

                          print(
                              f"ID: {story_id}"
                          )

                          print(
                              f"Tipo: {media_type}"
                          )

                          if not media_url:

                              print(
                                  "❌ Sin URL."
                              )

                              continue

                          if media_type is None:

                              print(
                                  "❌ Tipo de archivo "
                                  "no reconocido."
                              )

                              continue

                          # ------------------------------------------------
                          # FORCE_RESEND
                          # ------------------------------------------------

                          temp_name = (
                              f"{username}-"
                              f"{index}"
                          )

                          if media_type == "video":
                              temp_name += ".mp4"
                          else:
                              temp_name += ".jpg"

                          output = os.path.join(
                              temp_dir,
                              temp_name
                          )

                          # ------------------------------------------------
                          # Descargar
                          # ------------------------------------------------

                          if not download_media(
                              media_url,
                              media_type,
                              output
                          ):

                              print(
                                  "❌ Story descartado."
                              )

                              continue

                          file_hash = sha256_file(
                              output
                          )

                          print(
                              f"SHA-256: {file_hash}"
                          )

                          # ------------------------------------------------
                          # Dedupe
                          # ------------------------------------------------

                          if (
                              not FORCE_RESEND
                              and
                              file_hash in known_hashes
                          ):

                              print(
                                  "⏭️ Ya conocido "
                                  "(hash)."
                              )

                              skipped_count += 1

                              continue

                          # ------------------------------------------------
                          # Baseline antiguo
                          # ------------------------------------------------

                          story_key = (
                              f"story:{story_id}"
                              if story_id
                              else None
                          )

                          if (
                              story_key
                              and
                              story_key in baseline_ids
                              and
                              not FORCE_RESEND
                          ):

                              print(
                                  "⏭️ Story perteneciente "
                                  "al baseline."
                              )

                              skipped_count += 1

                              # Incorporarlo como hash conocido
                              # para futuras ejecuciones.
                              known_hashes.add(
                                  file_hash
                              )

                              continue

                          # ------------------------------------------------
                          # Telegram
                          # ------------------------------------------------

                          caption = (
                              f"📸 Instagram\n"
                              f"@{username}"
                          )

                          print(
                              "📤 Enviando a Telegram..."
                          )

                          http_status, telegram_data = (
                              telegram_request(
                                  "POST",
                                  output,
                                  media_type,
                                  caption
                              )
                          )

                          if (
                              http_status == 200
                              and
                              isinstance(
                                  telegram_data,
                                  dict
                              )
                              and
                              telegram_data.get(
                                  "ok"
                              ) is True
                          ):

                              print(
                                  "✅ Telegram confirmó "
                                  "el envío."
                              )

                              known_hashes.add(
                                  file_hash
                              )

                              sent_count += 1

                          else:

                              print(
                                  "❌ Telegram NO confirmó "
                                  "el envío."
                              )

                              print(
                                  "⚠️ El hash NO se guarda."
                              )

                  # ------------------------------------------------------
                  # Guardar hashes
                  # ------------------------------------------------------

                  account_state[
                      "hashes"
                  ] = list(
                      known_hashes
                  )[-MAX_HASHES_PER_ACCOUNT:]

                  # Limpiar baseline IDs antiguos.
                  account_state[
                      "baseline_story_ids"
                  ] = list(
                      baseline_ids
                  )[-100:]

                  print()
                  print(
                      f"Enviados: {sent_count}"
                  )

                  print(
                      f"Omitidos: {skipped_count}"
                  )

              finally:

                  try:
                      page.remove_listener(
                          "response",
                          response_handler
                      )
                  except Exception:
                      pass


          # ==============================================================
          # MAIN
          # ==============================================================

          async def main():

              print()
              print("=" * 75)
              print("INSTAGRAM STORIES MONITOR")
              print("DESCARGADOR: SNAPGRAM + API")
              print("MODO: STORIES")
              print(
                  f"FORCE_RESEND: {FORCE_RESEND}"
              )
              print("=" * 75)

              accounts = load_json(
                  ACCOUNTS_FILE,
                  []
              )

              if not accounts:

                  print(
                      "❌ No hay cuentas configuradas."
                  )

                  return

              state = load_json(
                  STATE_FILE,
                  {}
              )

              if not isinstance(
                  state,
                  dict
              ):

                  state = {}

              print()
              print(
                  f"Cuentas configuradas: "
                  f"{len(accounts)}"
              )

              async with async_playwright() as p:

                  browser = await p.chromium.launch(
                      headless=True,
                      args=[
                          "--no-sandbox",
                          "--disable-dev-shm-usage"
                      ]
                  )

                  context = await browser.new_context(
                      user_agent=USER_AGENT,
                      viewport={
                          "width": 1365,
                          "height": 900
                      }
                  )

                  page = await context.new_page()

                  for username in accounts:

                      try:

                          await process_account(
                              page,
                              username,
                              state
                          )

                      except Exception as e:

                          print()
                          print(
                              f"❌ ERROR en "
                              f"@{username}: {e}"
                          )

                      # Pequeña pausa entre cuentas.
                      await page.wait_for_timeout(
                          2000
                      )

                  await browser.close()

              save_json(
                  STATE_FILE,
                  state
              )

              print()
              print("=" * 75)
              print("ESTADO GUARDADO")
              print("=" * 75)

              print(
                  f"Archivo: {STATE_FILE}"
              )

          asyncio.run(main())
          PY

      - name: Commit del estado
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/instagram-state.json

          if git diff --cached --quiet; then
            echo "No hay cambios de estado para guardar."
          else
            git commit -m "Actualizar estado Instagram Stories"
            git push
          fi
