name: Instagram Monitor

on:
  workflow_dispatch:

  schedule:
    - cron: '0 * * * *'

permissions:
  contents: write

jobs:

  monitor-instagram:

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. DESCARGAR EL REPOSITORIO
      # ============================================================

      - name: Descargar repositorio
        uses: actions/checkout@v4


      # ============================================================
      # 2. INSTALAR DEPENDENCIAS
      # ============================================================

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests
          playwright install --with-deps chromium


      # ============================================================
      # 3. BUSCAR Y DESCARGAR STORIES
      # ============================================================

      - name: Buscar Stories de Instagram

        env:
          INSTAGRAM_PROFILE: "zero.design.oficial"
          SSS_URL: "https://sssinstagram.com/es/story-saver"

        run: |

          cat > monitor_instagram.py <<'PY'

          from playwright.sync_api import sync_playwright
          import requests
          import hashlib
          import json
          import os
          import re
          from urllib.parse import urlparse, parse_qs, unquote


          # ========================================================
          # CONFIGURACIÓN
          # ========================================================

          PROFILE = os.environ.get(
              "INSTAGRAM_PROFILE",
              "zero.design.oficial"
          )

          PROFILE_URL = (
              f"https://www.instagram.com/{PROFILE}/"
          )

          SSS_URL = os.environ.get(
              "SSS_URL",
              "https://sssinstagram.com/es/story-saver"
          )

          STATE_FILE = (
              "data/instagram-state.json"
          )

          DOWNLOAD_DIR = "downloads"


          os.makedirs(
              DOWNLOAD_DIR,
              exist_ok=True
          )

          os.makedirs(
              "data",
              exist_ok=True
          )


          # ========================================================
          # CARGAR ESTADO
          # ========================================================

          state_exists = os.path.exists(
              STATE_FILE
          )


          if state_exists:

              try:

                  with open(
                      STATE_FILE,
                      "r",
                      encoding="utf-8"
                  ) as f:

                      state = json.load(f)

              except Exception:

                  print(
                      "⚠️ No se pudo leer el estado."
                  )

                  state = {}

          else:

              state = {}


          # ========================================================
          # NUEVO SISTEMA DE ESTADO
          #
          # Ahora guardamos hashes SHA-256 de los archivos.
          # ========================================================

          profile_state = state.get(
              PROFILE
          )


          # --------------------------------------------------------
          # DETECTAR ESTADO ANTIGUO
          # --------------------------------------------------------

          legacy_state = False


          if isinstance(
              profile_state,
              list
          ):

              print(
                  "⚠️ Se detectó el formato antiguo "
                  "del estado."
              )

              legacy_state = True

              known_hashes = set()

          elif isinstance(
              profile_state,
              dict
          ):

              known_hashes = set(
                  profile_state.get(
                      "hashes",
                      []
                  )
              )

          else:

              known_hashes = set()


          print(
              "========================================"
          )

          print(
              "INSTAGRAM MONITOR"
          )

          print(
              "========================================"
          )

          print(
              f"Perfil: {PROFILE}"
          )

          print(
              f"Hashes conocidos: "
              f"{len(known_hashes)}"
          )


          # ========================================================
          # RESULTADOS
          # ========================================================

          downloaded = []


          # ========================================================
          # PLAYWRIGHT
          # ========================================================

          with sync_playwright() as p:

              browser = p.chromium.launch(
                  headless=True
              )

              context = browser.new_context(

                  viewport={
                      "width": 1366,
                      "height": 900
                  },

                  user_agent=(
                      "Mozilla/5.0 "
                      "(X11; Linux x86_64) "
                      "AppleWebKit/537.36 "
                      "(KHTML, like Gecko) "
                      "Chrome/139.0.0.0 "
                      "Safari/537.36"
                  )

              )

              page = context.new_page()


              # ====================================================
              # ABRIR SSSINSTAGRAM
              # ====================================================

              print(
                  "\nAbriendo SSSInstagram..."
              )

              page.goto(
                  SSS_URL,
                  wait_until="domcontentloaded",
                  timeout=60000
              )

              page.wait_for_timeout(
                  3000
              )


              # ====================================================
              # INTRODUCIR PERFIL
              # ====================================================

              print(
                  "Introduciendo perfil..."
              )

              input_box = page.locator(
                  "input[type='text'], "
                  "input[type='url']"
              ).first


              if not input_box.is_visible():

                  raise Exception(
                      "No se encontró el campo "
                      "para introducir el perfil."
                  )


              input_box.fill(
                  PROFILE_URL
              )


              # ====================================================
              # BOTÓN DESCARGAR
              # ====================================================

              print(
                  "Buscando botón Descargar..."
              )

              download_button = page.get_by_role(
                  "button",
                  name=re.compile(
                      "descargar",
                      re.I
                  )
              ).first


              if not download_button.is_visible():

                  download_button = page.get_by_text(
                      re.compile(
                          "descargar",
                          re.I
                      )
                  ).first


              if not download_button.is_visible():

                  raise Exception(
                      "No se encontró el botón Descargar."
                  )


              print(
                  "Pulsando Descargar..."
              )

              download_button.click()


              # ====================================================
              # ESPERAR RESULTADOS
              # ====================================================

              print(
                  "Esperando resultados..."
              )

              page.wait_for_timeout(
                  10000
              )


              # ====================================================
              # BUSCAR SECCIÓN STORIES
              # ====================================================

              print(
                  "\nBuscando sección Stories..."
              )

              story_tab_found = False


              patterns = [
                  r"stories",
                  r"story",
                  r"historias",
                  r"historia"
              ]


              for pattern in patterns:

                  try:

                      elements = page.get_by_text(
                          re.compile(
                              pattern,
                              re.I
                          )
                      )


                      count = elements.count()


                      for i in range(
                          min(count, 15)
                      ):

                          element = elements.nth(i)


                          try:

                              if not element.is_visible():
                                  continue


                              text = (
                                  element
                                  .inner_text()
                                  .strip()
                              )


                              if not text:
                                  continue


                              print(
                                  "Elemento encontrado:",
                                  repr(text)
                              )


                              element.click(
                                  timeout=3000
                              )


                              page.wait_for_timeout(
                                  5000
                              )


                              story_tab_found = True

                              break


                          except Exception:
                              pass


                      if story_tab_found:
                          break


                  except Exception:
                      pass


              if story_tab_found:

                  print(
                      "✅ Se abrió la sección Stories."
                  )

              else:

                  print(
                      "⚠️ No se identificó "
                      "la pestaña Stories."
                  )


              # ====================================================
              # OBTENER URLS MULTIMEDIA
              # ====================================================

              print(
                  "\nBuscando URLs multimedia..."
              )


              links = page.locator(
                  "a"
              )


              media_urls = []


              for i in range(
                  links.count()
              ):

                  try:

                      href = (
                          links
                          .nth(i)
                          .get_attribute(
                              "href"
                          )
                      )


                      if not href:
                          continue


                      if (
                          "media.sssinstagram.com/get"
                          not in href.lower()
                      ):
                          continue


                      if href not in media_urls:

                          media_urls.append(
                              href
                          )


                  except Exception:
                      pass


              print(
                  "URLs multimedia encontradas:",
                  len(media_urls)
              )


              # ====================================================
              # SI NO ENCONTRÓ NADA
              # ====================================================

              if not media_urls:

                  page.screenshot(
                      path="sssinstagram-debug.png",
                      full_page=True
                  )


                  with open(
                      "sssinstagram-debug.html",
                      "w",
                      encoding="utf-8"
                  ) as f:

                      f.write(
                          page.content()
                      )


                  browser.close()


                  raise Exception(
                      "❌ No se encontraron "
                      "URLs multimedia."
                  )


              # ====================================================
              # PROCESAR CADA MEDIA
              # ====================================================

              for index, media_url in enumerate(
                  media_urls
              ):

                  print(
                      f"\nProcesando media "
                      f"{index + 1}/{len(media_urls)}..."
                  )


                  # ------------------------------------------------
                  # DESCARGAR
                  # ------------------------------------------------

                  print(
                      "⬇️ Descargando..."
                  )


                  try:

                      response = requests.get(

                          media_url,

                          stream=True,

                          timeout=60,

                          headers={
                              "User-Agent":
                              "Mozilla/5.0"
                          }

                      )

                  except Exception as e:

                      print(
                          "❌ Error de descarga:",
                          e
                      )

                      continue


                  print(
                      "HTTP:",
                      response.status_code
                  )


                  if response.status_code != 200:

                      print(
                          "❌ No se pudo descargar."
                      )

                      continue


                  content_type = (
                      response
                      .headers
                      .get(
                          "content-type",
                          ""
                      )
                      .lower()
                  )


                  # ------------------------------------------------
                  # EXTENSIÓN
                  # ------------------------------------------------

                  if "video" in content_type:

                      extension = ".mp4"

                  elif "png" in content_type:

                      extension = ".png"

                  elif "webp" in content_type:

                      extension = ".webp"

                  else:

                      extension = ".jpg"


                  # ------------------------------------------------
                  # ARCHIVO TEMPORAL
                  # ------------------------------------------------

                  temp_filename = (
                      f"{DOWNLOAD_DIR}/"
                      f"temp_{index}"
                      f"{extension}"
                  )


                  try:

                      with open(
                          temp_filename,
                          "wb"
                      ) as f:

                          for chunk in response.iter_content(
                              chunk_size=1024 * 1024
                          ):

                              if chunk:

                                  f.write(
                                      chunk
                                  )

                  except Exception as e:

                      print(
                          "❌ Error guardando:",
                          e
                      )

                      continue


                  # ------------------------------------------------
                  # COMPROBAR TAMAÑO
                  # ------------------------------------------------

                  filesize = os.path.getsize(
                      temp_filename
                  )


                  print(
                      "Tamaño:",
                      filesize,
                      "bytes"
                  )


                  if filesize == 0:

                      print(
                          "❌ Archivo vacío."
                      )

                      os.remove(
                          temp_filename
                      )

                      continue


                  # =================================================
                  # CALCULAR HASH DEL ARCHIVO
                  # =================================================

                  print(
                      "🔎 Calculando SHA-256..."
                  )


                  sha256 = hashlib.sha256()


                  with open(
                      temp_filename,
                      "rb"
                  ) as f:

                      while True:

                          chunk = f.read(
                              1024 * 1024
                          )

                          if not chunk:
                              break

                          sha256.update(
                              chunk
                          )


                  file_hash = sha256.hexdigest()


                  print(
                      "Hash:",
                      file_hash
                  )


                  # =================================================
                  # ELIMINAR DUPLICADOS
                  # =================================================

                  if file_hash in known_hashes:

                      print(
                          "⏭️ Esta Story ya fue enviada."
                      )

                      os.remove(
                          temp_filename
                      )

                      continue


                  # =================================================
                  # GUARDAR CON NOMBRE ESTABLE
                  # =================================================

                  filename = (
                      f"{DOWNLOAD_DIR}/"
                      f"{file_hash}"
                      f"{extension}"
                  )


                  os.rename(
                      temp_filename,
                      filename
                  )


                  # =================================================
                  # AGREGAR A LISTA DE NUEVAS
                  # =================================================

                  downloaded.append({

                      "hash": file_hash,

                      "filename": filename,

                      "type": (
                          "video"
                          if extension == ".mp4"
                          else "photo"
                      )

                  })


              browser.close()


          # ========================================================
          # INICIALIZACIÓN
          # ========================================================
          #
          # Si detectamos el estado antiguo, NO enviamos las Stories
          # actuales. Las registramos como conocidas.
          #
          # Esto evita que las 3 Stories que ya recibiste vuelvan a
          # aparecer después de cambiar el sistema de identificación.
          # ========================================================

          if legacy_state:

              print(
                  "\n========================================"
              )

              print(
                  "🔄 INICIALIZANDO NUEVO SISTEMA"
              )

              print(
                  "========================================"
              )

              print(
                  "Las Stories encontradas se "
                  "registrarán como conocidas."
              )

              print(
                  "NO se enviarán a Telegram."
              )


              for item in downloaded:

                  known_hashes.add(
                      item["hash"]
                  )


              downloaded = []


          # ========================================================
          # SI NO EXISTÍA NINGÚN ESTADO
          # ========================================================
          #
          # Primera instalación:
          # las Stories actualmente activas se consideran conocidas.
          # ========================================================

          elif not state_exists:

              print(
                  "\n========================================"
              )

              print(
                  "🆕 PRIMERA EJECUCIÓN"
              )

              print(
                  "========================================"
              )

              print(
                  "Registrando Stories actuales "
                  "sin enviarlas."
              )


              for item in downloaded:

                  known_hashes.add(
                      item["hash"]
                  )


              downloaded = []


          # ========================================================
          # GUARDAR ARCHIVOS PARA TELEGRAM
          # ========================================================

          with open(
              "files.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  downloaded,
                  f,
                  indent=2,
                  ensure_ascii=False
              )


          # ========================================================
          # GUARDAR NUEVO ESTADO EN MEMORIA
          # ========================================================

          state[PROFILE] = {

              "hashes": list(
                  known_hashes
              )[-100:]

          }


          with open(
              STATE_FILE,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  state,
                  f,
                  indent=2,
                  ensure_ascii=False
              )


          print(
              "\n========================================"
          )

          print(
              f"Stories nuevas encontradas: "
              f"{len(downloaded)}"
          )

          print(
              f"Total de hashes guardados: "
              f"{len(known_hashes)}"
          )

          print(
              "========================================"
          )

          PY


          python monitor_instagram.py


      # ============================================================
      # 4. ENVIAR STORIES NUEVAS A TELEGRAM
      # ============================================================

      - name: Enviar Stories a Telegram

        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |

          if [ ! -f files.json ]; then

            echo "No existe files.json."

            exit 0

          fi


          COUNT=$(python -c "
          import json
          with open('files.json') as f:
              print(len(json.load(f)))
          ")


          echo "Stories para enviar: $COUNT"


          if [ "$COUNT" -eq 0 ]; then

            echo "No hay Stories nuevas."

            exit 0

          fi


          python - <<'PY'

          import json
          import os
          import subprocess


          TOKEN = os.environ[
              "TELEGRAM_BOT_TOKEN"
          ]

          CHAT_ID = os.environ[
              "TELEGRAM_CHAT_ID"
          ]


          with open(
              "files.json",
              "r",
              encoding="utf-8"
          ) as f:

              files = json.load(f)


          successfully_sent = []


          for item in files:

              filename = item[
                  "filename"
              ]

              file_hash = item[
                  "hash"
              ]

              media_type = item[
                  "type"
              ]


              print(
                  f"\nEnviando {filename}..."
              )


              # ====================================================
              # VIDEO
              # ====================================================

              if media_type == "video":

                  endpoint = (
                      "https://api.telegram.org/"
                      f"bot{TOKEN}/sendVideo"
                  )


                  command = [

                      "curl",
                      "-sS",
                      "-X",
                      "POST",

                      endpoint,

                      "-F",
                      f"chat_id={CHAT_ID}",

                      "-F",
                      f"video=@{filename}",

                      "-F",
                      "caption=📱 Instagram Monitor — "
                      "zero.design.oficial"

                  ]


              # ====================================================
              # IMAGEN
              # ====================================================

              else:

                  endpoint = (
                      "https://api.telegram.org/"
                      f"bot{TOKEN}/sendPhoto"
                  )


                  command = [

                      "curl",
                      "-sS",
                      "-X",
                      "POST",

                      endpoint,

                      "-F",
                      f"chat_id={CHAT_ID}",

                      "-F",
                      f"photo=@{filename}",

                      "-F",
                      "caption=📱 Instagram Monitor — "
                      "zero.design.oficial"

                  ]


              # ====================================================
              # ENVIAR
              # ====================================================

              result = subprocess.run(

                  command,

                  capture_output=True,

                  text=True

              )


              response = result.stdout


              print(
                  "Respuesta Telegram:"
              )

              print(
                  response
              )


              # ====================================================
              # COMPROBAR RESPUESTA
              # ====================================================

              if '"ok":true' in response:

                  print(
                      "✅ Enviada correctamente."
                  )

                  successfully_sent.append(
                      file_hash
                  )

              else:

                  print(
                      "❌ Telegram NO confirmó "
                      "el envío."
                  )


          # ========================================================
          # CARGAR ESTADO
          # ========================================================

          state_file = (
              "data/instagram-state.json"
          )


          if os.path.exists(
              state_file
          ):

              try:

                  with open(
                      state_file,
                      "r",
                      encoding="utf-8"
                  ) as f:

                      state = json.load(f)

              except:

                  state = {}

          else:

              state = {}


          # ========================================================
          # OBTENER HASHES ACTUALES
          # ========================================================

          profile = (
              "zero.design.oficial"
          )


          if not isinstance(
              state.get(profile),
              dict
          ):

              state[profile] = {
                  "hashes": []
              }


          hashes = set(
              state[profile].get(
                  "hashes",
                  []
              )
          )


          # ========================================================
          # GUARDAR SOLO LOS ENVIADOS
          # ========================================================

          for file_hash in successfully_sent:

              hashes.add(
                  file_hash
              )


          # ========================================================
          # CONSERVAR ÚLTIMOS 100
          # ========================================================

          state[profile][
              "hashes"
          ] = list(
              hashes
          )[-100:]


          # ========================================================
          # GUARDAR ESTADO
          # ========================================================

          with open(
              state_file,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  state,
                  f,
                  indent=2,
                  ensure_ascii=False
              )


          print(
              "\n================================"
          )

          print(
              "Stories enviadas correctamente:",
              len(successfully_sent)
          )

          print(
              "================================"
          )

          PY


      # ============================================================
      # 5. GUARDAR ESTADO EN GITHUB
      # ============================================================

      - name: Guardar estado en GitHub

        run: |

          git config user.name \
            "Instagram Monitor"

          git config user.email \
            "instagram-monitor@users.noreply.github.com"


          git add data/instagram-state.json


          if git diff --cached --quiet; then

            echo "No hay cambios en el estado."

          else

            git commit \
              -m "Actualizar estado de Instagram"

            git push

          fi


      # ============================================================
      # 6. LIMPIAR ARCHIVOS TEMPORALES
      # ============================================================

      - name: Limpiar archivos temporales

        if: always()

        run: |

          rm -rf downloads

          rm -f files.json

          rm -f monitor_instagram.py

          rm -f sssinstagram-debug.html

          rm -f sssinstagram-debug.png

          echo "🧹 Limpieza completada."
