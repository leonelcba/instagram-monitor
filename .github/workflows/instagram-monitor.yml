name: Instagram Monitor

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ============================================================
      # 2. INSTALAR PYTHON / PLAYWRIGHT
      # ============================================================

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests
          playwright install --with-deps chromium


      # ============================================================
      # 3. EJECUTAR MONITOR
      # ============================================================

      - name: Ejecutar monitor Instagram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |

          cat > monitor_instagram.py <<'PY'

          import os
          import json
          import time
          import hashlib
          import requests

          from playwright.sync_api import sync_playwright


          # ============================================================
          # CONFIGURACIÓN
          # ============================================================

          ACCOUNTS_FILE = "data/instagram-accounts.json"
          STATE_FILE = "data/instagram-state.json"
          DOWNLOAD_DIR = "downloads"

          TELEGRAM_BOT_TOKEN = os.environ.get(
              "TELEGRAM_BOT_TOKEN"
          )

          TELEGRAM_CHAT_ID = os.environ.get(
              "TELEGRAM_CHAT_ID"
          )


          # ============================================================
          # COMPROBAR TELEGRAM
          # ============================================================

          if not TELEGRAM_BOT_TOKEN:
              raise RuntimeError(
                  "Falta el Secret TELEGRAM_BOT_TOKEN"
              )

          if not TELEGRAM_CHAT_ID:
              raise RuntimeError(
                  "Falta el Secret TELEGRAM_CHAT_ID"
              )


          # ============================================================
          # CREAR CARPETA TEMPORAL
          # ============================================================

          os.makedirs(
              DOWNLOAD_DIR,
              exist_ok=True
          )


          # ============================================================
          # CARGAR CUENTAS
          # ============================================================

          with open(
              ACCOUNTS_FILE,
              "r",
              encoding="utf-8"
          ) as f:
              accounts = json.load(f)


          if not isinstance(accounts, list):
              raise RuntimeError(
                  "instagram-accounts.json debe contener una lista."
              )


          print()
          print("========================================")
          print("CUENTAS A MONITOREAR")
          print("========================================")

          for account in accounts:
              print("-", account)

          print()


          # ============================================================
          # CARGAR ESTADO
          # ============================================================

          if os.path.exists(STATE_FILE):

              try:

                  with open(
                      STATE_FILE,
                      "r",
                      encoding="utf-8"
                  ) as f:

                      state = json.load(f)

              except Exception as e:

                  print(
                      "⚠️ No se pudo leer el estado:",
                      e
                  )

                  state = {}

          else:

              state = {}


          if not isinstance(state, dict):
              state = {}


          # ============================================================
          # FUNCIONES DE ESTADO
          # ============================================================

          def get_account_hashes(account):

              value = state.get(account)

              if isinstance(value, dict):

                  hashes = value.get(
                      "hashes",
                      []
                  )

                  if isinstance(hashes, list):
                      return set(hashes)

              elif isinstance(value, list):

                  return set(value)

              return set()


          def account_has_state(account):

              return account in state


          def save_state():

              with open(
                  STATE_FILE,
                  "w",
                  encoding="utf-8"
              ) as f:

                  json.dump(
                      state,
                      f,
                      indent=2,
                      ensure_ascii=False
                  )


          # ============================================================
          # COLECTAR STORIES
          # ============================================================

          def collect_media(page):

              return page.evaluate(
                  """
                  () => {

                      const results = [];
                      const seen = new Set();

                      const images = Array.from(
                          document.querySelectorAll(
                              'img.media-content__image'
                          )
                      );

                      for (const img of images) {

                          let container = img;

                          let download = null;

                          /*
                           * Buscar el botón Descargar dentro
                           * de los padres de la imagen.
                           *
                           * Esto evita tomar:
                           * - foto de perfil
                           * - otros enlaces
                           * - previews que no son el archivo real
                           */

                          for (let i = 0; i < 8; i++) {

                              if (!container) {
                                  break;
                              }

                              const button =
                                  container.querySelector(
                                      'a.download-btn[href]'
                                  );

                              if (button) {

                                  download =
                                      button.href;

                                  break;
                              }

                              container =
                                  container.parentElement;
                          }


                          /*
                           * URL de preview
                           */

                          const preview =
                              img.currentSrc ||
                              img.src ||
                              null;


                          /*
                           * Preferimos siempre el enlace
                           * del botón Descargar.
                           */

                          const mediaUrl =
                              download ||
                              preview;


                          if (!mediaUrl) {
                              continue;
                          }


                          /*
                           * Solo URLs de SSSInstagram.
                           */

                          if (
                              !mediaUrl
                                  .toLowerCase()
                                  .includes(
                                      'media.sssinstagram.com/get'
                                  )
                          ) {
                              continue;
                          }


                          /*
                           * Evitar duplicados de URL.
                           */

                          if (seen.has(mediaUrl)) {
                              continue;
                          }

                          seen.add(mediaUrl);


                          results.push({

                              mediaUrl: mediaUrl,

                              previewUrl: preview,

                              hasDownload: !!download

                          });

                      }


                      return results;
                  }
                  """
              )


          # ============================================================
          # SCROLL DE CONTENEDORES INTERNOS
          # ============================================================

          def scroll_internal_containers(page):

              return page.evaluate(
                  """
                  () => {

                      const elements =
                          Array.from(
                              document.querySelectorAll('*')
                          );

                      const scrollables =
                          elements.filter(el => {

                              const style =
                                  getComputedStyle(el);

                              return (

                                  el.scrollHeight >
                                  el.clientHeight + 100

                                  &&

                                  (
                                      style.overflowY === 'auto' ||
                                      style.overflowY === 'scroll' ||
                                      style.overflow === 'auto' ||
                                      style.overflow === 'scroll'
                                  )
                              );

                          });


                      let moved = 0;


                      for (const el of scrollables) {

                          const oldTop =
                              el.scrollTop;

                          const amount =
                              Math.max(
                                  500,
                                  Math.floor(
                                      el.clientHeight * 0.85
                                  )
                              );


                          el.scrollTop =
                              Math.min(
                                  oldTop + amount,
                                  el.scrollHeight
                              );


                          if (
                              el.scrollTop !== oldTop
                          ) {

                              moved++;

                          }

                      }


                      return moved;
                  }
                  """
              )


          # ============================================================
          # DESCARGAR ARCHIVO
          # ============================================================

          def download_media(
              media_url,
              account_index,
              media_index
          ):

              print()
              print(
                  "Descargando media..."
              )

              print(
                  "URL:",
                  media_url[:180]
              )


              try:

                  response = requests.get(
                      media_url,
                      timeout=60,
                      stream=True,
                      headers={
                          "User-Agent":
                              "Mozilla/5.0"
                      }
                  )

              except Exception as e:

                  print(
                      "❌ Error de descarga:",
                      e
                  )

                  return None


              print(
                  "HTTP:",
                  response.status_code
              )


              if response.status_code != 200:

                  print(
                      "❌ No se pudo descargar."
                  )

                  return None


              content_type = (
                  response.headers
                  .get(
                      "content-type",
                      ""
                  )
                  .lower()
              )


              print(
                  "Content-Type:",
                  content_type
              )


              # ========================================================
              # DETERMINAR TIPO
              # ========================================================

              if "video" in content_type:

                  extension = ".mp4"
                  media_type = "video"

              elif "png" in content_type:

                  extension = ".png"
                  media_type = "photo"

              elif "webp" in content_type:

                  extension = ".webp"
                  media_type = "photo"

              elif "jpeg" in content_type:

                  extension = ".jpg"
                  media_type = "photo"

              elif "jpg" in content_type:

                  extension = ".jpg"
                  media_type = "photo"

              else:

                  /*
                   * Si SSSInstagram no devuelve Content-Type
                   * claro, mirar la URL.
                   */

                  lower_url = media_url.lower()

                  if (
                      ".mp4" in lower_url
                      or "video" in lower_url
                  ):

                      extension = ".mp4"
                      media_type = "video"

                  else:

                      extension = ".jpg"
                      media_type = "photo"


              temp_filename = (
                  f"{DOWNLOAD_DIR}/"
                  f"temp_{account_index}_"
                  f"{media_index}"
                  f"{extension}"
              )


              # ========================================================
              # GUARDAR
              # ========================================================

              try:

                  with open(
                      temp_filename,
                      "wb"
                  ) as f:

                      for chunk in response.iter_content(
                          chunk_size=1024 * 1024
                      ):

                          if chunk:
                              f.write(chunk)

              except Exception as e:

                  print(
                      "❌ Error guardando:",
                      e
                  )

                  return None


              if not os.path.exists(
                  temp_filename
              ):

                  print(
                      "❌ No se creó el archivo."
                  )

                  return None


              filesize = os.path.getsize(
                  temp_filename
              )


              print(
                  "Tamaño:",
                  filesize,
                  "bytes"
              )


              if filesize == 0:

                  print(
                      "❌ Archivo vacío."
                  )

                  os.remove(
                      temp_filename
                  )

                  return None


              # ========================================================
              # SHA-256 DEL ARCHIVO REAL
              # ========================================================

              print(
                  "🔎 Calculando SHA-256..."
              )


              sha256 = hashlib.sha256()


              with open(
                  temp_filename,
                  "rb"
              ) as f:

                  while True:

                      chunk = f.read(
                          1024 * 1024
                      )

                      if not chunk:
                          break

                      sha256.update(
                          chunk
                      )


              file_hash = (
                  sha256.hexdigest()
              )


              print(
                  "Hash:",
                  file_hash
              )


              return {
                  "temp_filename":
                      temp_filename,

                  "extension":
                      extension,

                  "type":
                      media_type,

                  "hash":
                      file_hash
              }


          # ============================================================
          # ENVIAR FOTO A TELEGRAM
          # ============================================================

          def send_photo(
              filename,
              account
          ):

              url = (
                  "https://api.telegram.org/"
                  "bot"
                  + TELEGRAM_BOT_TOKEN
                  + "/sendPhoto"
              )


              caption = (
                  f"📸 Nueva Story\n"
                  f"@{account}"
              )


              try:

                  with open(
                      filename,
                      "rb"
                  ) as photo:

                      response = requests.post(
                          url,
                          data={
                              "chat_id":
                                  TELEGRAM_CHAT_ID,

                              "caption":
                                  caption
                          },
                          files={
                              "photo":
                                  photo
                          },
                          timeout=120
                      )

              except Exception as e:

                  print(
                      "❌ Error Telegram:",
                      e
                  )

                  return False


              print(
                  "Respuesta Telegram:"
              )

              print(
                  response.text
              )


              try:

                  data = response.json()

              except Exception:

                  return False


              return (
                  response.status_code == 200
                  and data.get("ok") is True
              )


          # ============================================================
          # ENVIAR VIDEO A TELEGRAM
          # ============================================================

          def send_video(
              filename,
              account
          ):

              url = (
                  "https://api.telegram.org/"
                  "bot"
                  + TELEGRAM_BOT_TOKEN
                  + "/sendVideo"
              )


              caption = (
                  f"🎥 Nueva Story\n"
                  f"@{account}"
              )


              try:

                  with open(
                      filename,
                      "rb"
                  ) as video:

                      response = requests.post(
                          url,
                          data={
                              "chat_id":
                                  TELEGRAM_CHAT_ID,

                              "caption":
                                  caption
                          },
                          files={
                              "video":
                                  video
                          },
                          timeout=180
                      )

              except Exception as e:

                  print(
                      "❌ Error Telegram:",
                      e
                  )

                  return False


              print(
                  "Respuesta Telegram:"
              )

              print(
                  response.text
              )


              try:

                  data = response.json()

              except Exception:

                  return False


              return (
                  response.status_code == 200
                  and data.get("ok") is True
              )


          # ============================================================
          # PROCESAMIENTO PRINCIPAL
          # ============================================================

          total_new = 0
          successfully_sent = []


          with sync_playwright() as p:

              browser = p.chromium.launch(
                  headless=True
              )


              page = browser.new_page(
                  viewport={
                      "width": 1440,
                      "height": 1200
                  }
              )


              for account_index, account in enumerate(
                  accounts,
                  start=1
              ):

                  account = str(
                      account
                  ).strip().lstrip("@")


                  if not account:
                      continue


                  print()
                  print("========================================")
                  print(
                      f"CUENTA {account_index}/"
                      f"{len(accounts)}: "
                      f"{account}"
                  )
                  print("========================================")


                  known_hashes = get_account_hashes(
                      account
                  )


                  account_is_new = not account_has_state(
                      account
                  )


                  print(
                      "Hashes conocidos:",
                      len(known_hashes)
                  )


                  if account_is_new:

                      print(
                          "🆕 Cuenta nueva."
                      )

                      print(
                          "Las Stories actuales "
                          "se usarán como línea base."
                      )


                  # ====================================================
                  # ABRIR SSSINSTAGRAM
                  # ====================================================

                  try:

                      print(
                          "Abriendo SSSInstagram..."
                      )


                      page.goto(
                          "https://sssinstagram.com/es/story-saver",
                          wait_until="domcontentloaded",
                          timeout=60000
                      )


                      page.wait_for_timeout(
                          3000
                      )


                      # =================================================
                      # INTRODUCIR PERFIL
                      # =================================================

                      print(
                          "Introduciendo perfil..."
                      )


                      inputs = page.locator(
                          "input"
                      )


                      input_count = inputs.count()


                      if input_count == 0:

                          print(
                              "❌ No se encontró "
                              "el campo de perfil."
                          )

                          continue


                      field = inputs.first


                      field.fill(
                          f"https://www.instagram.com/"
                          f"{account}/"
                      )


                      # =================================================
                      # BOTÓN DESCARGAR
                      # =================================================

                      print(
                          "Buscando botón Descargar..."
                      )


                      buttons = page.locator(
                          "button"
                      )


                      clicked = False


                      for i in range(
                          buttons.count()
                      ):

                          button = buttons.nth(i)

                          try:

                              text = (
                                  button.inner_text()
                                  .strip()
                                  .lower()
                              )

                          except Exception:

                              continue


                          if (
                              "descargar" in text
                              or "download" in text
                          ):

                              print(
                                  "Botón encontrado:",
                                  text
                              )

                              button.click(
                                  timeout=10000
                              )

                              clicked = True

                              break


                      if not clicked:

                          print(
                              "❌ No se encontró "
                              "el botón Descargar."
                          )

                          continue


                      print(
                          "Descargar pulsado."
                      )


                      # =================================================
                      # ESPERAR RESULTADOS
                      # =================================================

                      print(
                          "Esperando resultados..."
                      )


                      page.wait_for_timeout(
                          5000
                      )


                      # =================================================
                      # BUSCAR SECCIÓN STORIES
                      # =================================================

                      print(
                          "Buscando sección Stories..."
                      )


                      stories_clicked = False


                      elements = page.locator(
                          "text=/stories/i"
                      )


                      for i in range(
                          min(
                              elements.count(),
                              20
                          )
                      ):

                          element = elements.nth(i)

                          try:

                              if element.is_visible():

                                  print(
                                      "Elemento Stories "
                                      "encontrado."
                                  )

                                  element.click(
                                      timeout=10000
                                  )

                                  stories_clicked = True

                                  break

                          except Exception:

                              pass


                      if not stories_clicked:

                          print(
                              "⚠️ No se pudo pulsar "
                              "la sección Stories."
                          )


                      page.wait_for_timeout(
                          4000
                      )


                  except Exception as e:

                      print(
                          "❌ Error preparando cuenta:",
                          e
                      )

                      continue


                  # ====================================================
                  # COLECCIÓN INICIAL
                  # ====================================================

                  media_items = {}


                  try:

                      initial = collect_media(
                          page
                      )

                      for item in initial:

                          media_items[
                              item["mediaUrl"]
                          ] = item


                      print(
                          "URLs multimedia encontradas "
                          "inicialmente:",
                          len(media_items)
                      )


                  except Exception as e:

                      print(
                          "❌ Error de colección:",
                          e
                      )

                      continue


                  # ====================================================
                  # SCROLL INTERNO
                  # ====================================================

                  no_new_rounds = 0


                  for round_number in range(
                      1,
                      21
                  ):

                      try:

                          moved = (
                              scroll_internal_containers(
                                  page
                              )
                          )

                      except Exception:

                          moved = 0


                      page.wait_for_timeout(
                          1200
                      )


                      try:

                          current = collect_media(
                              page
                          )

                      except Exception:

                          current = []


                      before = len(
                          media_items
                      )


                      for item in current:

                          media_items[
                              item["mediaUrl"]
                          ] = item


                      after = len(
                          media_items
                      )


                      new_urls = (
                          after - before
                      )


                      print(
                          f"Scroll "
                          f"{round_number}/20 "
                          f"| contenedores desplazados: "
                          f"{moved} "
                          f"| nuevas URLs: "
                          f"{new_urls} "
                          f"| total: "
                          f"{after}"
                      )


                      if new_urls == 0:

                          no_new_rounds += 1

                      else:

                          no_new_rounds = 0


                      /*
                       * Si durante varias rondas no aparecen
                       * nuevos elementos, probablemente llegamos
                       * al final.
                       */

                      if (
                          no_new_rounds >= 4
                          and moved == 0
                      ):

                          print(
                              "⏹️ No aparecen más Stories."
                          )

                          break


                  # ====================================================
                  # ESCANEO FINAL
                  # ====================================================

                  try:

                      final_items = collect_media(
                          page
                      )

                      for item in final_items:

                          media_items[
                              item["mediaUrl"]
                          ] = item

                  except Exception:
                      pass


                  print()
                  print(
                      "Stories detectadas:",
                      len(media_items)
                  )


                  if len(media_items) == 0:

                      print(
                          "⚠️ No se encontraron Stories."
                      )

                      continue


                  # ====================================================
                  # DESCARGAR Y PROCESAR
                  # ====================================================

                  account_new_files = []


                  for media_index, item in enumerate(
                      media_items.values(),
                      start=1
                  ):

                      media_url = item[
                          "mediaUrl"
                      ]


                      print()
                      print(
                          "----------------------------------------"
                      )

                      print(
                          f"Story {media_index}/"
                          f"{len(media_items)}"
                      )

                      print(
                          "Tiene botón Descargar:",
                          item["hasDownload"]
                      )


                      result = download_media(
                          media_url,
                          account_index,
                          media_index
                      )


                      if result is None:
                          continue


                      file_hash = result[
                          "hash"
                      ]

                      temp_filename = result[
                          "temp_filename"
                      ]

                      extension = result[
                          "extension"
                      ]

                      media_type = result[
                          "type"
                      ]


                      # =================================================
                      # DUPLICADO
                      # =================================================

                      if file_hash in known_hashes:

                          print(
                              "⏭️ Esta Story ya "
                              "fue enviada."
                          )


                          try:
                              os.remove(
                                  temp_filename
                              )
                          except Exception:
                              pass


                          continue


                      # =================================================
                      # CUENTA NUEVA
                      # =================================================

                      if account_is_new:

                          print(
                              "🆕 Story actual de "
                              "cuenta nueva."
                          )

                          print(
                              "Se registra como conocida "
                              "sin enviarla."
                          )


                          known_hashes.add(
                              file_hash
                          )


                          try:
                              os.remove(
                                  temp_filename
                              )
                          except Exception:
                              pass


                          continue


                      # =================================================
                      # NUEVA STORY
                      # =================================================

                      filename = (
                          f"{DOWNLOAD_DIR}/"
                          f"{file_hash}"
                          f"{extension}"
                      )


                      os.rename(
                          temp_filename,
                          filename
                      )


                      account_new_files.append({
                          "account":
                              account,

                          "hash":
                              file_hash,

                          "filename":
                              filename,

                          "type":
                              media_type
                      })


                  # ====================================================
                  # ENVIAR NUEVAS STORIES
                  # ====================================================

                  print()
                  print(
                      "Stories para enviar:",
                      len(account_new_files)
                  )


                  for item in account_new_files:

                      account = item[
                          "account"
                      ]

                      filename = item[
                          "filename"
                      ]

                      file_hash = item[
                          "hash"
                      ]

                      media_type = item[
                          "type"
                      ]


                      print()
                      print(
                          "Enviando Story de "
                          f"@{account}"
                      )

                      print(
                          "Archivo:",
                          filename
                      )

                      print(
                          "Tipo:",
                          media_type
                      )


                      if media_type == "video":

                          success = send_video(
                              filename,
                              account
                          )

                      else:

                          success = send_photo(
                              filename,
                              account
                          )


                      if success:

                          print(
                              "✅ Enviada correctamente."
                          )


                          successfully_sent.append({
                              "account":
                                  account,

                              "hash":
                                  file_hash
                          })


                          total_new += 1

                      else:

                          print(
                              "❌ Telegram NO confirmó "
                              "el envío."
                          )


                  print()
                  print(
                      "Estado de",
                      account,
                      ":",
                      len(known_hashes),
                      "hashes conocidos."
                  )


              browser.close()


          # ============================================================
          # ACTUALIZAR ESTADO
          # ============================================================

          print()
          print(
              "========================================"
          )

          print(
              "ACTUALIZANDO ESTADO"
          )

          print(
              "========================================"
          )


          for item in successfully_sent:

              account = item[
                  "account"
              ]

              file_hash = item[
                  "hash"
              ]


              if not isinstance(
                  state.get(account),
                  dict
              ):

                  state[account] = {
                      "hashes": []
                  }


              hashes = set(
                  state[account].get(
                      "hashes",
                      []
                  )
              )


              hashes.add(
                  file_hash
              )


              /*
               * Mantener como máximo 100 hashes
               * por cuenta.
               */

              state[account][
                  "hashes"
              ] = list(hashes)[-100:]


          save_state()


          # ============================================================
          # RESUMEN
          # ============================================================

          print()
          print(
              "========================================"
          )

          print(
              "RESUMEN FINAL"
          )

          print(
              "========================================"
          )

          print(
              "Cuentas procesadas:",
