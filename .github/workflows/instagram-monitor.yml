name: Monitor Instagram Stories

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests
          playwright install --with-deps chromium

      - name: Crear monitor
        run: |
          cat > monitor_instagram.py <<'PY'
          import os
          import json
          import time
          import hashlib
          import requests

          from pathlib import Path
          from playwright.sync_api import sync_playwright


          ACCOUNTS_FILE = Path("data/instagram-accounts.json")
          STATE_FILE = Path("data/instagram-state.json")
          DOWNLOAD_DIR = Path("downloads")

          SSS_URL = "https://sssinstagram.com/es/story-saver"

          TELEGRAM_BOT_TOKEN = os.environ["TELEGRAM_BOT_TOKEN"]
          TELEGRAM_CHAT_ID = os.environ["TELEGRAM_CHAT_ID"]


          DOWNLOAD_DIR.mkdir(exist_ok=True)
          STATE_FILE.parent.mkdir(exist_ok=True)


          def load_accounts():
              if not ACCOUNTS_FILE.exists():
                  print("❌ No existe data/instagram-accounts.json")
                  return []

              with open(ACCOUNTS_FILE, "r", encoding="utf-8") as f:
                  accounts = json.load(f)

              cleaned = []

              for account in accounts:
                  account = str(account).strip()
                  account = account.replace("@", "")
                  account = account.rstrip("/")

                  if account:
                      cleaned.append(account)

              return cleaned


          def load_state():
              if not STATE_FILE.exists():
                  return {}

              try:
                  with open(STATE_FILE, "r", encoding="utf-8") as f:
                      data = json.load(f)

                  if isinstance(data, dict):
                      return data

              except Exception as e:
                  print(f"⚠️ No se pudo leer el estado: {e}")

              return {}


          def save_state(state):
              with open(STATE_FILE, "w", encoding="utf-8") as f:
                  json.dump(
                      state,
                      f,
                      ensure_ascii=False,
                      indent=2
                  )


          def sha256_file(path):
              sha256 = hashlib.sha256()

              with open(path, "rb") as f:
                  while True:
                      chunk = f.read(1024 * 1024)

                      if not chunk:
                          break

                      sha256.update(chunk)

              return sha256.hexdigest()


          def telegram_send_photo(path, caption):
              url = (
                  f"https://api.telegram.org/bot"
                  f"{TELEGRAM_BOT_TOKEN}/sendPhoto"
              )

              try:
                  with open(path, "rb") as photo:
                      response = requests.post(
                          url,
                          data={
                              "chat_id": TELEGRAM_CHAT_ID,
                              "caption": caption
                          },
                          files={
                              "photo": photo
                          },
                          timeout=120
                      )

                  print("Telegram:", response.text)

                  if response.ok:
                      data = response.json()
                      return data.get("ok") is True

              except Exception as e:
                  print(
                      f"❌ Error enviando foto a Telegram: {e}"
                  )

              return False


          def telegram_send_video(path, caption):
              url = (
                  f"https://api.telegram.org/bot"
                  f"{TELEGRAM_BOT_TOKEN}/sendVideo"
              )

              try:
                  with open(path, "rb") as video:
                      response = requests.post(
                          url,
                          data={
                              "chat_id": TELEGRAM_CHAT_ID,
                              "caption": caption
                          },
                          files={
                              "video": video
                          },
                          timeout=180
                      )

                  print("Telegram:", response.text)

                  if response.ok:
                      data = response.json()
                      return data.get("ok") is True

              except Exception as e:
                  print(
                      f"❌ Error enviando video a Telegram: {e}"
                  )

              return False


          def detect_extension(content_type, url):
              content_type = (content_type or "").lower()
              url_lower = (url or "").lower()

              if "video" in content_type:
                  return ".mp4", "video"

              if "image/png" in content_type:
                  return ".png", "photo"

              if "image/webp" in content_type:
                  return ".webp", "photo"

              if "image/gif" in content_type:
                  return ".gif", "photo"

              if ".mp4" in url_lower:
                  return ".mp4", "video"

              if ".webm" in url_lower:
                  return ".webm", "video"

              if ".mov" in url_lower:
                  return ".mov", "video"

              return ".jpg", "photo"


          def download_media(url, destination_without_extension):
              print("Descargando:")
              print(url)

              headers = {
                  "User-Agent": (
                      "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                      "AppleWebKit/537.36 "
                      "(KHTML, like Gecko) "
                      "Chrome/139.0.0.0 Safari/537.36"
                  )
              }

              try:
                  response = requests.get(
                      url,
                      headers=headers,
                      timeout=120
                  )

                  content_type = response.headers.get(
                      "Content-Type",
                      ""
                  )

                  print(
                      f"HTTP {response.status_code} "
                      f"| Content-Type: {content_type}"
                  )

                  if response.status_code != 200:
                      print("❌ La descarga falló.")
                      return None

                  extension, media_type = detect_extension(
                      content_type,
                      url
                  )

                  destination = Path(
                      str(destination_without_extension)
                      + extension
                  )

                  with open(destination, "wb") as f:
                      f.write(response.content)

                  if destination.stat().st_size == 0:
                      print(
                          "❌ Archivo descargado vacío."
                      )

                      destination.unlink(
                          missing_ok=True
                      )

                      return None

                  print(
                      f"✅ Descargado: {destination} "
                      f"({destination.stat().st_size} bytes)"
                  )

                  return {
                      "path": destination,
                      "type": media_type,
                      "content_type": content_type
                  }

              except Exception as e:
                  print(
                      f"❌ Error descargando archivo: {e}"
                  )

                  return None


          def collect_media(page):
              result = page.evaluate(
                  """
                  () => {
                      const output = [];
                      const seen = new Set();

                      const images = Array.from(
                          document.querySelectorAll(
                              'img.media-content__image'
                          )
                      );

                      for (const img of images) {

                          let container = img;

                          for (
                              let i = 0;
                              i < 8 && container;
                              i++
                          ) {

                              const download =
                                  container.querySelector(
                                      'a.download-btn[href]'
                                  );

                              if (download) {

                                  const preview =
                                      img.getAttribute(
                                          'src'
                                      ) || '';

                                  const mediaUrl =
                                      download.getAttribute(
                                          'href'
                                      ) || '';

                                  if (
                                      mediaUrl &&
                                      mediaUrl.includes(
                                          'media.sssinstagram.com/get'
                                      ) &&
                                      !seen.has(mediaUrl)
                                  ) {

                                      seen.add(mediaUrl);

                                      output.push({
                                          preview: preview,
                                          download: mediaUrl
                                      });

                                      break;
                                  }
                              }

                              container =
                                  container.parentElement;
                          }
                      }

                      return output;
                  }
                  """
              )

              return result


          def scroll_internal_containers(page):
              total_rounds = 20
              previous_count = 0
              stable_rounds = 0

              for round_number in range(
                  1,
                  total_rounds + 1
              ):

                  try:
                      moved = page.evaluate(
                          """
                          () => {

                              const elements =
                                  Array.from(
                                      document.querySelectorAll('*')
                                  );

                              const scrollables =
                                  elements.filter(el => {

                                      const style =
                                          getComputedStyle(el);

                                      return (
                                          el.scrollHeight >
                                          el.clientHeight + 100
                                          &&
                                          (
                                              style.overflowY === 'auto'
                                              ||
                                              style.overflowY === 'scroll'
                                              ||
                                              style.overflow === 'auto'
                                              ||
                                              style.overflow === 'scroll'
                                          )
                                      );
                                  });

                              let count = 0;

                              for (
                                  const el of scrollables
                              ) {

                                  const oldTop =
                                      el.scrollTop;

                                  const amount =
                                      Math.max(
                                          500,
                                          Math.floor(
                                              el.clientHeight * 0.85
                                          )
                                      );

                                  el.scrollTop =
                                      Math.min(
                                          oldTop + amount,
                                          el.scrollHeight
                                      );

                                  if (
                                      el.scrollTop !== oldTop
                                  ) {
                                      count++;
                                  }
                              }

                              return count;
                          }
                          """
                      )

                  except Exception as e:
                      print(
                          f"⚠️ Error durante scroll interno: {e}"
                      )

                      moved = 0

                  time.sleep(1.2)

                  current_media = collect_media(page)

                  current_count = len(
                      current_media
                  )

                  print(
                      f"Scroll interno "
                      f"{round_number}/{total_rounds} "
                      f"| Stories detectadas: "
                      f"{current_count} "
                      f"| contenedores movidos: "
                      f"{moved}"
                  )

                  if current_count == previous_count:
                      stable_rounds += 1
                  else:
                      stable_rounds = 0

                  previous_count = current_count

                  if (
                      moved == 0
                      and stable_rounds >= 2
                  ):
                      print(
                          "⏹️ No aparecen más Stories."
                      )

                      break


          def open_stories(page, account):
              print(
                  "Abriendo SSSInstagram..."
              )

              page.goto(
                  SSS_URL,
                  wait_until="domcontentloaded",
                  timeout=60000
              )

              time.sleep(3)

              profile_url = (
                  f"https://www.instagram.com/{account}/"
              )

              print(
                  f"Introduciendo perfil: "
                  f"{profile_url}"
              )

              inputs = page.locator("input")

              if inputs.count() == 0:
                  print(
                      "❌ No se encontró "
                      "el campo de perfil."
                  )

                  return False

              inputs.first.fill(
                  profile_url
              )

              time.sleep(1)

              print(
                  "Buscando botón Descargar..."
              )

              buttons = page.get_by_text(
                  "Descargar",
                  exact=True
              )

              if buttons.count() == 0:
                  buttons = page.locator(
                      "button, input[type=submit]"
                  )

              if buttons.count() == 0:
                  print(
                      "❌ No se encontró "
                      "el botón Descargar."
                  )

                  return False

              buttons.first.click()

              print(
                  "Esperando que SSSInstagram "
                  "cargue el perfil..."
              )

              try:
                  page.wait_for_selector(
                      "img.media-content__image",
                      timeout=45000
                  )

                  print(
                      "✅ Se detectaron elementos "
                      "multimedia de Stories."
                  )

                  return True

              except Exception:

                  print(
                      "⚠️ Las Stories todavía "
                      "no aparecen. "
                      "Esperando más..."
                  )

                  for intento in range(1, 7):

                      time.sleep(5)

                      try:
                          count = page.locator(
                              "img.media-content__image"
                          ).count()

                          print(
                              f"Espera adicional "
                              f"{intento}/6 | "
                              f"elementos detectados: "
                              f"{count}"
                          )

                          if count > 0:

                              print(
                                  "✅ Stories cargadas."
                              )

                              return True

                      except Exception:
                          pass

                  print(
                      "❌ No se detectaron Stories "
                      "después de esperar."
                  )

                  return False


          def process_account(page, account, state):
              print()
              print("=" * 50)
              print(
                  f"CUENTA: {account}"
              )
              print("=" * 50)

              account_state = state.get(
                  account
              )

              if not isinstance(
                  account_state,
                  dict
              ):
                  account_state = {}

              known_hashes = set(
                  account_state.get(
                      "hashes",
                      []
                  )
              )

              initialized = bool(
                  account_state.get(
                      "initialized",
                      False
                  )
              )

              print(
                  f"Hashes conocidos: "
                  f"{len(known_hashes)}"
              )

              if not open_stories(
                  page,
                  account
              ):
                  return 0, 0

              print(
                  "Buscando Stories directamente..."
              )

              time.sleep(2)

              initial_media = collect_media(
                  page
              )

              print(
                  "URLs multimedia encontradas "
                  f"inicialmente: "
                  f"{len(initial_media)}"
              )

              scroll_internal_containers(
                  page
              )

              media_items = collect_media(
                  page
              )

              print(
                  "URLs multimedia encontradas "
                  f"finalmente: "
                  f"{len(media_items)}"
              )

              if not media_items:

                  print(
                      "⚠️ No se encontraron Stories."
                  )

                  return 0, 0

              new_items = []

              for index, item in enumerate(
                  media_items,
                  start=1
              ):

                  download_url = item.get(
                      "download",
                      ""
                  )

                  preview_url = item.get(
                      "preview",
                      ""
                  )

                  print()
                  print(
                      f"Story {index}/"
                      f"{len(media_items)}"
                  )

                  print(
                      "URL Descargar: "
                      f"{download_url[:180]}"
                  )

                  if preview_url:
                      print(
                          "URL Preview:   "
                          f"{preview_url[:180]}"
                      )

                  media_url = download_url

                  if not media_url:

                      print(
                          "⚠️ Story sin enlace "
                          "Descargar. Se omite."
                      )

                      continue

                  temp_base = (
                      DOWNLOAD_DIR
                      / f"temp_{account}_{index}"
                  )

                  downloaded = download_media(
                      media_url,
                      temp_base
                  )

                  if not downloaded:
                      continue

                  path = downloaded["path"]

                  file_hash = sha256_file(
                      path
                  )

                  print(
                      f"SHA-256: {file_hash}"
                  )

                  # ==========================================
                  # MODO PRUEBA
                  # ==========================================
                  # True:
                  #   vuelve a enviar las Stories actuales,
                  #   aunque ya estén en instagram-state.json.
                  #
                  # False:
                  #   funcionamiento normal.
                  # ==========================================

                  FORCE_RESEND = True

                  if (
                      file_hash in known_hashes
                      and not FORCE_RESEND
                  ):

                      print(
                          "⏭️ Esta Story ya fue enviada."
                      )

                      path.unlink(
                          missing_ok=True
                      )

                      continue

                  if (
                      file_hash in known_hashes
                      and FORCE_RESEND
                  ):

                      print(
                          "🔄 MODO PRUEBA: "
                          "esta Story ya existe "
                          "en el estado, "
                          "pero será reenviada."
                      )

                  if not initialized:

                      print(
                          "🆕 Cuenta nueva: "
                          "Story usada como referencia, "
                          "no se enviará."
                      )

                      known_hashes.add(
                          file_hash
                      )

                      path.unlink(
                          missing_ok=True
                      )

                      continue

                  extension = path.suffix.lower()

                  final_path = (
                      DOWNLOAD_DIR
                      / f"{file_hash}"
                      f"{extension}"
                  )

                  if final_path.exists():
                      final_path.unlink()

                  path.rename(
                      final_path
                  )

                  print(
                      f"🆕 Story preparada: "
                      f"{final_path}"
                  )

                  new_items.append(
                      {
                          "hash": file_hash,
                          "path": final_path,
                          "type": downloaded["type"],
                          "extension": extension
                      }
                  )

              print()
              print(
                  f"Stories para enviar: "
                  f"{len(new_items)}"
              )

              sent_count = 0

              for item in new_items:

                  file_hash = item["hash"]
                  path = item["path"]
                  media_type = item["type"]

                  print()
                  print(
                      f"Enviando Story de "
                      f"@{account}"
                  )

                  print(
                      f"Archivo: {path}"
                  )

                  caption = (
                      f"📱 Nueva Story de @{account}"
                  )

                  if media_type == "video":

                      print(
                          "🎬 Tipo detectado: VIDEO"
                      )

                      success = (
                          telegram_send_video(
                              path,
                              caption
                          )
                      )

                  else:

                      print(
                          "🖼️ Tipo detectado: FOTO"
                      )

                      success = (
                          telegram_send_photo(
                              path,
                              caption
                          )
                      )

                  if success:

                      print(
                          "✅ Telegram confirmó "
                          "el envío."
                      )

                      known_hashes.add(
                          file_hash
                      )

                      sent_count += 1

                      try:
                          path.unlink()

                      except Exception:
                          pass

                  else:

                      print(
                          "❌ Telegram NO confirmó "
                          "el envío."
                      )

                      print(
                          "⚠️ La Story NO se agregará "
                          "al estado."
                      )

              for path in DOWNLOAD_DIR.glob(
                  "temp_*"
              ):

                  try:
                      path.unlink()

                  except Exception:
                      pass

              hash_list = list(
                  known_hashes
              )

              if len(hash_list) > 100:
                  hash_list = hash_list[-100:]

              state[account] = {
                  "initialized": True,
                  "hashes": hash_list
              }

              print()
              print(
                  f"Estado de @{account}: "
                  f"{len(hash_list)} hashes."
              )

              return (
                  len(new_items),
                  sent_count
              )


          def main():

              accounts = load_accounts()

              if not accounts:

                  print(
                      "❌ No hay cuentas configuradas."
                  )

                  return

              print("=" * 50)
              print(
                  "MONITOR DE INSTAGRAM STORIES"
              )
              print("=" * 50)

              print(
                  f"Cuentas a procesar: "
                  f"{len(accounts)}"
              )

              for account in accounts:

                  print(
                      f"  - @{account}"
                  )

              state = load_state()

              total_new = 0
              total_sent = 0

              with sync_playwright() as p:

                  browser = p.chromium.launch(
                      headless=True,
                      args=[
                          "--no-sandbox",
                          "--disable-dev-shm-usage"
                      ]
                  )

                  page = browser.new_page(
                      viewport={
                          "width": 1280,
                          "height": 900
                      },
                      user_agent=(
                          "Mozilla/5.0 "
                          "(Windows NT 10.0; Win64; x64) "
                          "AppleWebKit/537.36 "
                          "(KHTML, like Gecko) "
                          "Chrome/139.0.0.0 "
                          "Safari/537.36"
                      )
                  )

                  for account in accounts:

                      try:

                          new_count, sent_count = (
                              process_account(
                                  page,
                                  account,
                                  state
                              )
                          )

                          total_new += new_count
                          total_sent += sent_count

                      except Exception as e:

                          print()
                          print(
                              f"❌ Error procesando "
                              f"@{account}: {e}"
                          )

                          import traceback

                          traceback.print_exc()

                  browser.close()

              save_state(state)

              print()
              print("=" * 50)
              print("RESUMEN")
              print("=" * 50)

              print(
                  f"Cuentas procesadas: "
                  f"{len(accounts)}"
              )

              print(
                  f"Stories nuevas detectadas: "
                  f"{total_new}"
              )

              print(
                  f"Stories enviadas a Telegram: "
                  f"{total_sent}"
              )

              print("=" * 50)


          if __name__ == "__main__":
              main()
          PY

      - name: Comprobar sintaxis Python
        run: |
          echo "Comprobando sintaxis de Python..."
          python -m py_compile monitor_instagram.py
          echo "✅ Sintaxis Python correcta."

      - name: Ejecutar monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python monitor_instagram.py

      - name: Guardar estado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/instagram-state.json

          if git diff --cached --quiet; then
            echo "No hay cambios en el estado."
          else
            git commit -m "Actualizar estado de Instagram"
            git push
          fi

      - name: Limpiar archivos temporales
        if: always()
        run: |
          rm -rf downloads
          rm -f monitor_instagram.py
