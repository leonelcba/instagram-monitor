name: DIAGNOSTICO Instagram Stories

on:
  workflow_dispatch:

jobs:
  diagnostico:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium

      - name: Ejecutar diagnóstico
        shell: python
        run: |
          import time
          from playwright.sync_api import sync_playwright

          SSS_URL = "https://sssinstagram.com/es/story-saver"
          ACCOUNT = "laderechadiario"

          print("")
          print("=" * 80)
          print("DIAGNÓSTICO COMPLETO DE SSSINSTAGRAM")
          print("=" * 80)
          print(f"Cuenta analizada: @{ACCOUNT}")
          print("=" * 80)

          # ==========================================================
          # FUNCIÓN: INSPECCIÓN GENERAL
          # ==========================================================

          def inspect_page(page, nombre):

              print("")
              print("")
              print("=" * 80)
              print(f"INSPECCIÓN: {nombre}")
              print("=" * 80)

              print("")
              print(f"URL: {page.url}")

              try:
                  print(f"TÍTULO: {page.title()}")
              except Exception:
                  pass

              # ------------------------------------------------------
              # TEXTO VISIBLE
              # ------------------------------------------------------

              print("")
              print("-" * 80)
              print("TEXTO VISIBLE")
              print("-" * 80)

              try:
                  text = page.locator("body").inner_text(
                      timeout=10000
                  )

                  lines = [
                      line.strip()
                      for line in text.splitlines()
                      if line.strip()
                  ]

                  print(
                      f"Total de líneas visibles: {len(lines)}"
                  )

                  for line in lines[:250]:
                      print(line)

              except Exception as e:
                  print(
                      f"Error leyendo texto: {e}"
                  )

              # ------------------------------------------------------
              # CANTIDAD DE ELEMENTOS
              # ------------------------------------------------------

              print("")
              print("-" * 80)
              print("CANTIDAD DE ELEMENTOS")
              print("-" * 80)

              selectors = [
                  ("img", "img"),
                  ("video", "video"),
                  ("source", "source"),
                  ("a", "a"),
                  ("button", "button"),
                  ("picture", "picture"),
                  ("iframe", "iframe"),

                  (
                      "enlaces media",
                      'a[href*="media.sssinstagram.com/get"]'
                  ),

                  (
                      "imagenes media",
                      'img[src*="media.sssinstagram.com/get"]'
                  ),

                  (
                      "videos media",
                      'video[src*="media.sssinstagram.com/get"]'
                  ),

                  (
                      "sources media",
                      'source[src*="media.sssinstagram.com/get"]'
                  )
              ]

              for nombre_selector, selector in selectors:

                  try:
                      count = page.locator(
                          selector
                      ).count()

                      print(
                          f"{nombre_selector}: {count}"
                      )

                  except Exception as e:
                      print(
                          f"{nombre_selector}: ERROR {e}"
                      )

              # ------------------------------------------------------
              # TODAS LAS IMÁGENES
              # ------------------------------------------------------

              print("")
              print("-" * 80)
              print("TODAS LAS IMÁGENES")
              print("-" * 80)

              try:

                  images = page.locator("img")
                  count = images.count()

                  print(
                      f"Cantidad total de IMG: {count}"
                  )

                  for i in range(
                      min(count, 150)
                  ):

                      img = images.nth(i)

                      try:

                          src = (
                              img.get_attribute("src")
                              or ""
                          )

                          alt = (
                              img.get_attribute("alt")
                              or ""
                          )

                          cls = (
                              img.get_attribute("class")
                              or ""
                          )

                          width = (
                              img.get_attribute("width")
                              or ""
                          )

                          height = (
                              img.get_attribute("height")
                              or ""
                          )

                          print("")
                          print(
                              f"IMG #{i}"
                          )

                          print(
                              f"  class: {cls!r}"
                          )

                          print(
                              f"  alt: {alt!r}"
                          )

                          print(
                              f"  width: {width!r}"
                          )

                          print(
                              f"  height: {height!r}"
                          )

                          print(
                              f"  src: {src[:1000]}"
                          )

                      except Exception:
                          pass

              except Exception as e:

                  print(
                      f"Error inspeccionando IMG: {e}"
                  )

              # ------------------------------------------------------
              # TODOS LOS VIDEOS
              # ------------------------------------------------------

              print("")
              print("-" * 80)
              print("TODOS LOS VIDEOS")
              print("-" * 80)

              try:

                  videos = page.locator("video")
                  count = videos.count()

                  print(
                      f"Cantidad total de VIDEO: {count}"
                  )

                  for i in range(
                      min(count, 100)
                  ):

                      video = videos.nth(i)

                      try:

                          src = (
                              video.get_attribute("src")
                              or ""
                          )

                          cls = (
                              video.get_attribute("class")
                              or ""
                          )

                          poster = (
                              video.get_attribute("poster")
                              or ""
                          )

                          print("")
                          print(
                              f"VIDEO #{i}"
                          )

                          print(
                              f"  class: {cls!r}"
                          )

                          print(
                              f"  poster: {poster[:700]}"
                          )

                          print(
                              f"  src: {src[:1000]}"
                          )

                          sources = video.locator(
                              "source"
                          )

                          source_count = sources.count()

                          print(
                              f"  sources: {source_count}"
                          )

                          for j in range(
                              source_count
                          ):

                              source = sources.nth(j)

                              source_src = (
                                  source.get_attribute(
                                      "src"
                                  )
                                  or ""
                              )

                              source_type = (
                                  source.get_attribute(
                                      "type"
                                  )
                                  or ""
                              )

                              print(
                                  f"    SOURCE #{j}: "
                                  f"type={source_type!r}"
                              )

                              print(
                                  f"      src="
                                  f"{source_src[:1000]}"
                              )

                      except Exception:
                          pass

              except Exception as e:

                  print(
                      f"Error inspeccionando VIDEO: {e}"
                  )

              # ------------------------------------------------------
              # TODOS LOS ENLACES RELEVANTES
              # ------------------------------------------------------

              print("")
              print("-" * 80)
              print("ENLACES RELEVANTES")
              print("-" * 80)

              try:

                  links = page.locator("a")
                  count = links.count()

                  encontrados = 0

                  print(
                      f"Cantidad total de A: {count}"
                  )

                  for i in range(count):

                      link = links.nth(i)

                      try:

                          href = (
                              link.get_attribute("href")
                              or ""
                          )

                          cls = (
                              link.get_attribute("class")
                              or ""
                          )

                          text = (
                              link.inner_text()
                              .strip()
                          )

                          href_lower = href.lower()
                          cls_lower = cls.lower()
                          text_lower = text.lower()

                          relevante = (
                              "media.sssinstagram.com"
                              in href_lower
                              or "download"
                              in href_lower
                              or "download"
                              in cls_lower
                              or "descargar"
                              in text_lower
                              or "story"
                              in cls_lower
                          )

                          if not relevante:
                              continue

                          encontrados += 1

                          print("")
                          print(
                              f"A #{i}"
                          )

                          print(
                              f"  text: {text[:500]!r}"
                          )

                          print(
                              f"  class: {cls!r}"
                          )

                          print(
                              f"  href: {href[:1200]}"
                          )

                          if encontrados >= 150:
                              break

                      except Exception:
                          pass

                  print("")
                  print(
                      f"Enlaces relevantes: "
                      f"{encontrados}"
                  )

              except Exception as e:

                  print(
                      f"Error inspeccionando enlaces: {e}"
                  )

              # ------------------------------------------------------
              # CUALQUIER ATRIBUTO QUE CONTENGA
              # MEDIA.SSSINSTAGRAM.COM
              # ------------------------------------------------------

              print("")
              print("-" * 80)
              print(
                  "TODAS LAS REFERENCIAS A "
                  "media.sssinstagram.com"
              )
              print("-" * 80)

              try:

                  references = page.evaluate(
                      """
                      () => {

                          const result = [];

                          const elements =
                              document.querySelectorAll("*");

                          for (const el of elements) {

                              for (
                                  const attr of
                                  Array.from(
                                      el.attributes || []
                                  )
                              ) {

                                  const value =
                                      attr.value || "";

                                  if (
                                      value.includes(
                                          "media.sssinstagram.com"
                                      )
                                  ) {

                                      result.push({

                                          tag:
                                              el.tagName,

                                          className:
                                              typeof el.className
                                              === "string"
                                                  ? el.className
                                                  : "",

                                          id:
                                              el.id || "",

                                          attribute:
                                              attr.name,

                                          value:
                                              value

                                      });

                                  }

                              }

                          }

                          return result;
                      }
                      """
                  )

                  print(
                      f"Referencias encontradas: "
                      f"{len(references)}"
                  )

                  for i, item in enumerate(
                      references[:200]
                  ):

                      print("")
                      print(
                          f"REFERENCIA #{i}"
                      )

                      print(
                          f"  tag: "
                          f"{item['tag']}"
                      )

                      print(
                          f"  class: "
                          f"{item['className']!r}"
                      )

                      print(
                          f"  id: "
                          f"{item['id']!r}"
                      )

                      print(
                          f"  atributo: "
                          f"{item['attribute']}"
                      )

                      print(
                          f"  valor: "
                          f"{item['value'][:1500]}"
                      )

              except Exception as e:

                  print(
                      "Error buscando referencias "
                      f"media: {e}"
                  )

              # ------------------------------------------------------
              # ELEMENTOS CON TEXTO STORIES
              # ------------------------------------------------------

              print("")
              print("-" * 80)
              print(
                  "ELEMENTOS RELACIONADOS CON 'STORIES'"
              )
              print("-" * 80)

              try:

                  all_elements = page.locator(
                      "*"
                  )

                  count = all_elements.count()

                  encontrados = 0

                  for i in range(count):

                      if encontrados >= 100:
                          break

                      element = all_elements.nth(i)

                      try:

                          text = (
                              element.inner_text()
                              .strip()
                          )

                          if not text:
                              continue

                          if (
                              "stories"
                              not in text.lower()
                              and "story"
                              not in text.lower()
                          ):
                              continue

                          # Evitar imprimir elementos
                          # gigantes que contienen toda
                          # la página.

                          if len(text) > 1000:
                              continue

                          tag = element.evaluate(
                              "(e) => e.tagName"
                          )

                          cls = (
                              element.get_attribute(
                                  "class"
                              )
                              or ""
                          )

                          print("")
                          print(
                              f"ELEMENTO #{i}"
                          )

                          print(
                              f"  tag: {tag}"
                          )

                          print(
                              f"  class: {cls!r}"
                          )

                          print(
                              f"  text: {text[:1000]!r}"
                          )

                          encontrados += 1

                      except Exception:
                          pass

                  print("")
                  print(
                      f"Elementos encontrados: "
                      f"{encontrados}"
                  )

              except Exception as e:

                  print(
                      "Error buscando Stories: "
                      f"{e}"
                  )

          # ==========================================================
          # BUSCAR CONTENEDORES CON SCROLL
          # ==========================================================

          def inspect_scrollables(page):

              print("")
              print("-" * 80)
              print(
                  "CONTENEDORES CON SCROLL INTERNO"
              )
              print("-" * 80)

              try:

                  result = page.evaluate(
                      """
                      () => {

                          const elements = [
                              document.documentElement,
                              document.body,
                              ...document.querySelectorAll("*")
                          ];

                          const result = [];

                          for (
                              let i = 0;
                              i < elements.length;
                              i++
                          ) {

                              const el = elements[i];

                              try {

                                  const style =
                                      getComputedStyle(el);

                                  const scrollable =
                                      el.scrollHeight >
                                      el.clientHeight + 100;

                                  const overflow =
                                      style.overflowY === "auto" ||
                                      style.overflowY === "scroll" ||
                                      style.overflow === "auto" ||
                                      style.overflow === "scroll";

                                  if (
                                      scrollable &&
                                      overflow
                                  ) {

                                      result.push({

                                          index: i,

                                          tag:
                                              el.tagName,

                                          id:
                                              el.id || "",

                                          className:
                                              typeof el.className
                                              === "string"
                                                  ? el.className
                                                  : "",

                                          scrollTop:
                                              el.scrollTop,

                                          scrollHeight:
                                              el.scrollHeight,

                                          clientHeight:
                                              el.clientHeight

                                      });

                                  }

                              } catch (e) {}

                          }

                          return result;
                      }
                      """
                  )

                  print(
                      f"Contenedores encontrados: "
                      f"{len(result)}"
                  )

                  for i, item in enumerate(
                      result[:50]
                  ):

                      print(
                          f"[{i}] "
                          f"<{item['tag'].lower()}> "
                          f"id={item['id']!r} "
                          f"class="
                          f"{item['className']!r} "
                          f"scrollTop="
                          f"{item['scrollTop']} "
                          f"scrollHeight="
                          f"{item['scrollHeight']} "
                          f"clientHeight="
                          f"{item['clientHeight']}"
                      )

                  return result

              except Exception as e:

                  print(
                      f"Error detectando scroll: {e}"
                  )

                  return []

          # ==========================================================
          # HACER SCROLL INTERNO
          # ==========================================================

          def scroll_everything(page):

              print("")
              print("")
              print("=" * 80)
              print(
                  "INICIANDO SCROLL INTERNO"
              )
              print("=" * 80)

              previous_media = 0
              stable_rounds = 0

              for ronda in range(1, 21):

                  print("")
                  print(
                      f"SCROLL {ronda}/20"
                  )

                  containers = inspect_scrollables(
                      page
                  )

                  moved = page.evaluate(
                      """
                      () => {

                          const elements = [
                              document.documentElement,
                              document.body,
                              ...document.querySelectorAll("*")
                          ];

                          let moved = 0;

                          for (
                              const el of elements
                          ) {

                              try {

                                  const style =
                                      getComputedStyle(el);

                                  const scrollable =
                                      el.scrollHeight >
                                      el.clientHeight + 100;

                                  const overflow =
                                      style.overflowY === "auto" ||
                                      style.overflowY === "scroll" ||
                                      style.overflow === "auto" ||
                                      style.overflow === "scroll";

                                  if (
                                      !scrollable ||
                                      !overflow
                                  ) {
                                      continue;
                                  }

                                  const oldTop =
                                      el.scrollTop;

                                  const amount =
                                      Math.max(
                                          500,
                                          Math.floor(
                                              el.clientHeight
                                              * 0.80
                                          )
                                      );

                                  const target =
                                      Math.min(
                                          oldTop + amount,
                                          el.scrollHeight
                                      );

                                  el.scrollTop =
                                      target;

                                  if (
                                      el.scrollTop !==
                                      oldTop
                                  ) {
                                      moved++;
                                  }

                              } catch (e) {}

                          }

                          return moved;
                      }
                      """
                  )

                  print(
                      f"Elementos desplazados: {moved}"
                  )

                  # También desplazamos la página
                  # por si las Stories están en el
                  # scroll principal.

                  try:
                      page.mouse.wheel(
                          0,
                          800
                      )
                  except Exception:
                      pass

                  time.sleep(2)

                  # --------------------------------------------------
                  # CONTAR MEDIA ACTUAL
                  # --------------------------------------------------

                  try:

                      media_count = page.evaluate(
                          """
                          () => {

                              const urls =
                                  new Set();

                              const elements =
                                  document.querySelectorAll("*");

                              for (
                                  const el of elements
                              ) {

                                  for (
                                      const attr of
                                      Array.from(
                                          el.attributes || []
                                      )
                                  ) {

                                      const value =
                                          attr.value || "";

                                      if (
                                          value.includes(
                                              "media.sssinstagram.com/get"
                                          )
                                      ) {

                                          urls.add(
                                              value
                                          );

                                      }

                                  }

                              }

                              return urls.size;
                          }
                          """
                      )

                      print(
                          "URLs media únicas "
                          "actuales: "
                          f"{media_count}"
                      )

                  except Exception:
                      media_count = 0

                  if (
                      media_count == previous_media
                  ):
                      stable_rounds += 1
                  else:
                      stable_rounds = 0

                  previous_media = media_count

                  if (
                      moved == 0
                      and stable_rounds >= 2
                  ):

                      print(
                          "No aparecen más "
                          "elementos nuevos."
                      )

                      break

              print("")
              print(
                  "Scroll interno terminado."
              )

          # ==========================================================
          # PLAYWRIGHT
          # ==========================================================

          with sync_playwright() as p:

              print("")
              print("=" * 80)
              print(
                  "INICIANDO CHROMIUM"
              )
              print("=" * 80)

              browser = p.chromium.launch(
                  headless=True,
                  args=[
                      "--disable-blink-features="
                      "AutomationControlled"
                  ]
              )

              context = browser.new_context(
                  viewport={
                      "width": 1440,
                      "height": 1000
                  },
                  locale="es-ES"
              )

              page = context.new_page()

              # ======================================================
              # ABRIR SSSINSTAGRAM
              # ======================================================

              print("")
              print(
                  "Abriendo SSSInstagram..."
              )

              page.goto(
                  SSS_URL,
                  wait_until="domcontentloaded",
                  timeout=60000
              )

              time.sleep(5)

              inspect_page(
                  page,
                  "PÁGINA INICIAL"
              )

              # ======================================================
              # INPUT
              # ======================================================

              print("")
              print("=" * 80)
              print(
                  "BUSCANDO INPUT"
              )
              print("=" * 80)

              inputs = page.locator(
                  "input"
              )

              print(
                  f"Inputs encontrados: "
                  f"{inputs.count()}"
              )

              for i in range(
                  inputs.count()
              ):

                  try:

                      inp = inputs.nth(i)

                      print(
                          f"INPUT #{i}: "
                          f"type="
                          f"{inp.get_attribute('type')!r} "
                          f"placeholder="
                          f"{inp.get_attribute('placeholder')!r} "
                          f"name="
                          f"{inp.get_attribute('name')!r}"
                      )

                  except Exception:
                      pass

              if inputs.count() == 0:

                  print(
                      "❌ No se encontró input."
                  )

                  browser.close()

                  raise SystemExit(1)

              profile_url = (
                  f"https://www.instagram.com/"
                  f"{ACCOUNT}/"
              )

              print("")
              print(
                  f"Introduciendo: {profile_url}"
              )

              inputs.first.fill(
                  profile_url
              )

              time.sleep(2)

              inspect_page(
                  page,
                  "DESPUÉS DE INTRODUCIR LA CUENTA"
              )

              # ======================================================
              # BOTÓN
              # ======================================================

              print("")
              print("=" * 80)
              print(
                  "BUSCANDO BOTÓN DESCARGAR"
              )
              print("=" * 80)

              buttons = page.get_by_text(
                  "Descargar",
                  exact=True
              )

              print(
                  "Coincidencias exactas: "
                  f"{buttons.count()}"
              )

              if buttons.count() == 0:

                  buttons = page.locator(
                      "button, "
                      "input[type='submit']"
                  )

                  print(
                      "Botones alternativos: "
                      f"{buttons.count()}"
                  )

              if buttons.count() == 0:

                  print(
                      "❌ No se encontró botón."
                  )

                  browser.close()

                  raise SystemExit(1)

              print("")
              print(
                  "Pulsando el primer botón..."
              )

              buttons.first.click()

              # ======================================================
              # ESPERA SIN SELECTOR ESPECÍFICO
              # ======================================================

              print("")
              print("=" * 80)
              print(
                  "ESPERANDO CARGA DEL RESULTADO"
              )
              print("=" * 80)

              # IMPORTANTE:
              # No esperamos img.media-content__image.
              # Esperamos tiempo y luego inspeccionamos
              # TODO lo que haya cargado.

              for i in range(1, 11):

                  time.sleep(2)

                  try:

                      img_count = page.locator(
                          "img"
                      ).count()

                      video_count = page.locator(
                          "video"
                      ).count()

                      source_count = page.locator(
                          "source"
                      ).count()

                      link_count = page.locator(
                          "a"
                      ).count()

                      media_link_count = (
                          page.locator(
                              'a[href*="media.sssinstagram.com/get"]'
                          ).count()
                      )

                      media_img_count = (
                          page.locator(
                              'img[src*="media.sssinstagram.com/get"]'
                          ).count()
                      )

                      print(
                          f"Espera {i}/10 | "
                          f"img={img_count} | "
                          f"video={video_count} | "
                          f"source={source_count} | "
                          f"a={link_count} | "
                          f"media-links="
                          f"{media_link_count} | "
                          f"media-img="
                          f"{media_img_count}"
                      )

                  except Exception as e:

                      print(
                          f"Error durante espera: "
                          f"{e}"
                      )

              # ======================================================
              # INSPECCIÓN SIN SCROLL
              # ======================================================

              inspect_page(
                  page,
                  "RESULTADO ANTES DEL SCROLL"
              )

              # ======================================================
              # SCROLL
              # ======================================================

              scroll_everything(
                  page
              )

              # ======================================================
              # INSPECCIÓN FINAL
              # ======================================================

              inspect_page(
                  page,
                  "RESULTADO DESPUÉS DEL SCROLL"
              )

              # ======================================================
              # RESUMEN ESTRUCTURAL DE MEDIA
              # ======================================================

              print("")
              print("")
              print("=" * 80)
              print(
                  "RESUMEN ESTRUCTURAL"
              )
              print("=" * 80)

              try:

                  summary = page.evaluate(
                      """
                      () => {

                          const result = {

                              imgs: 0,
                              videos: 0,
                              sources: 0,
                              anchors: 0,
                              mediaUrls: [],
                              elements: []

                          };

                          const seen =
                              new Set();

                          for (
                              const el of
                              document.querySelectorAll("*")
                          ) {

                              const tag =
                                  el.tagName.toLowerCase();

                              if (
                                  tag === "img"
                              ) {
                                  result.imgs++;
                              }

                              if (
                                  tag === "video"
                              ) {
                                  result.videos++;
                              }

                              if (
                                  tag === "source"
                              ) {
                                  result.sources++;
                              }

                              if (
                                  tag === "a"
                              ) {
                                  result.anchors++;
                              }

                              for (
                                  const attr of
                                  Array.from(
                                      el.attributes || []
                                  )
                              ) {

                                  const value =
                                      attr.value || "";

                                  if (
                                      !value.includes(
                                          "media.sssinstagram.com/get"
                                      )
                                  ) {
                                      continue;
                                  }

                                  if (
                                      !seen.has(value)
                                  ) {

                                      seen.add(value);

                                      result.mediaUrls.push(
                                          value
                                      );

                                  }

                                  result.elements.push({

                                      tag:
                                          tag,

                                      className:
                                          typeof el.className
                                          === "string"
                                              ? el.className
                                              : "",

                                      id:
                                          el.id || "",

                                      attribute:
                                          attr.name,

                                      value:
                                          value

                                  });

                              }

                          }

                          return result;
                      }
                      """
                  )

                  print(
                      f"IMG: "
                      f"{summary['imgs']}"
                  )

                  print(
                      f"VIDEO: "
                      f"{summary['videos']}"
                  )

                  print(
