name: Instagram Stories Monitor

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests
          playwright install chromium

      - name: Crear monitor
        run: |
          cat > monitor_instagram.py <<'PY'
          import os
          import json
          import time
          import hashlib
          from pathlib import Path
          from urllib.parse import urlparse

          import requests
          from playwright.sync_api import sync_playwright


          SSS_URL = "https://sssinstagram.com/es/story-saver"

          ACCOUNTS_FILE = Path("data/instagram-accounts.json")
          STATE_FILE = Path("data/instagram-state.json")
          DOWNLOAD_DIR = Path("downloads")

          TELEGRAM_BOT_TOKEN = os.environ.get("TELEGRAM_BOT_TOKEN")
          TELEGRAM_CHAT_ID = os.environ.get("TELEGRAM_CHAT_ID")

          # TRUE solamente para esta prueba.
          # Después lo cambiaremos a FALSE.
          FORCE_RESEND = True


          def load_accounts():
              with open(ACCOUNTS_FILE, "r", encoding="utf-8") as f:
                  accounts = json.load(f)

              return [
                  str(account).strip().lstrip("@")
                  for account in accounts
                  if str(account).strip()
              ]


          def load_state():
              if not STATE_FILE.exists():
                  return {}

              try:
                  with open(STATE_FILE, "r", encoding="utf-8") as f:
                      return json.load(f)
              except Exception:
                  return {}


          def save_state(state):
              STATE_FILE.parent.mkdir(
                  parents=True,
                  exist_ok=True
              )

              with open(
                  STATE_FILE,
                  "w",
                  encoding="utf-8"
              ) as f:
                  json.dump(
                      state,
                      f,
                      ensure_ascii=False,
                      indent=2
                  )


          def sha256_file(path):
              h = hashlib.sha256()

              with open(path, "rb") as f:
                  while True:
                      chunk = f.read(1024 * 1024)

                      if not chunk:
                          break

                      h.update(chunk)

              return h.hexdigest()


          def extension_from_response(content_type, url):
              content_type = (
                  content_type
                  .lower()
                  .split(";")[0]
                  .strip()
              )

              if content_type.startswith("video/"):
                  return ".mp4"

              if content_type == "image/png":
                  return ".png"

              if content_type == "image/webp":
                  return ".webp"

              if content_type.startswith("image/"):
                  return ".jpg"

              path = urlparse(url).path.lower()

              if ".mp4" in path:
                  return ".mp4"

              if ".webm" in path:
                  return ".mp4"

              if ".png" in path:
                  return ".png"

              if ".webp" in path:
                  return ".webp"

              return ".jpg"


          def telegram(method, path, account, media_type):
              url = (
                  f"https://api.telegram.org/"
                  f"bot{TELEGRAM_BOT_TOKEN}/{method}"
              )

              if media_type == "video":
                  field = "video"
                  mime = "video/mp4"
                  caption = f"🎥 Story de @{account}"
              else:
                  field = "photo"
                  mime = "image/jpeg"
                  caption = f"📸 Story de @{account}"

              try:
                  with open(path, "rb") as f:
                      response = requests.post(
                          url,
                          data={
                              "chat_id": TELEGRAM_CHAT_ID,
                              "caption": caption
                          },
                          files={
                              field: (
                                  path.name,
                                  f,
                                  mime
                              )
                          },
                          timeout=180
                      )

                  print(
                      f"Telegram HTTP: {response.status_code}"
                  )

                  print(response.text)

                  if not response.ok:
                      return False

                  result = response.json()

                  return result.get("ok") is True

              except Exception as e:
                  print(
                      f"❌ Error enviando a Telegram: {e}"
                  )

                  return False


          def open_stories(page, account):
              print("Abriendo SSSInstagram...")

              page.goto(
                  SSS_URL,
                  wait_until="domcontentloaded",
                  timeout=60000
              )

              time.sleep(3)

              profile_url = (
                  f"https://www.instagram.com/"
                  f"{account}/"
              )

              print(
                  f"Introduciendo perfil: {profile_url}"
              )

              inputs = page.locator("input")

              if inputs.count() == 0:
                  print("❌ No se encontró input.")
                  return False

              target = inputs.first

              for i in range(inputs.count()):
                  try:
                      inp = inputs.nth(i)

                      input_type = (
                          inp.get_attribute("type")
                          or ""
                      ).lower()

                      placeholder = (
                          inp.get_attribute("placeholder")
                          or ""
                      ).lower()

                      name = (
                          inp.get_attribute("name")
                          or ""
                      ).lower()

                      if (
                          input_type in ("", "text", "url")
                          and (
                              "instagram" in placeholder
                              or "instagram" in name
                              or "url" in placeholder
                              or "url" in name
                          )
                      ):
                          target = inp
                          break

                  except Exception:
                      pass

              target.fill(profile_url)

              time.sleep(1)

              clicked = False

              try:
                  form = target.locator(
                      "xpath=ancestor::form[1]"
                  )

                  buttons = form.locator(
                      "button, input[type=submit]"
                  )

                  for i in range(buttons.count()):
                      button = buttons.nth(i)

                      text = ""

                      try:
                          text = (
                              button.inner_text()
                              or ""
                          ).strip().lower()
                      except Exception:
                          pass

                      value = (
                          button.get_attribute("value")
                          or ""
                      ).strip().lower()

                      if (
                          "descargar" in text
                          or "descargar" in value
                      ):
                          print(
                              "Pulsando Descargar..."
                          )

                          button.click()

                          clicked = True
                          break

              except Exception as e:
                  print(
                      f"⚠️ Error buscando botón "
                      f"del formulario: {e}"
                  )

              if not clicked:
                  buttons = page.get_by_text(
                      "Descargar",
                      exact=True
                  )

                  if buttons.count() > 0:
                      print(
                          "Pulsando Descargar "
                          "como fallback..."
                      )

                      buttons.first.click()
                      clicked = True

              if not clicked:
                  print(
                      "❌ No se pudo pulsar Descargar."
                  )

                  return False

              print(
                  "Esperando resultados..."
              )

              for intento in range(1, 11):
                  time.sleep(2)

                  videos = page.locator(
                      "video[src]"
                  ).count()

                  images = page.locator(
                      "img.media-content__image"
                  ).count()

                  print(
                      f"Espera {intento}/10 | "
                      f"videos={videos} | "
                      f"imagenes={images}"
                  )

                  if videos > 0 or images > 0:
                      return True

              print(
                  "⚠️ No aparecieron resultados "
                  "con los selectores principales."
              )

              return True


          def collect_media(page):
              """
              Obtiene:

              1. Videos reales mediante video[src].
              2. Fotos mediante img.media-content__image.

              Nunca utiliza poster como archivo independiente.
              Nunca utiliza img.avatar__image.
              """

              media = page.evaluate(
                  """
                  () => {

                      const result = [];
                      const seen = new Set();

                      // =================================================
                      // VIDEOS
                      // =================================================

                      const videos =
                          Array.from(
                              document.querySelectorAll(
                                  'video[src]'
                              )
                          );

                      for (const video of videos) {

                          const src =
                              video.getAttribute("src") || "";

                          if (!src) {
                              continue;
                          }

                          const lower =
                              src.toLowerCase();

                          if (
                              src.startsWith("blob:")
                              ||
                              src.startsWith("data:")
                          ) {
                              continue;
                          }

                          if (
                              !lower.includes(".mp4")
                              &&
                              !lower.includes(
                                  "cdninstagram.com"
                              )
                          ) {
                              continue;
                          }

                          if (seen.has(src)) {
                              continue;
                          }

                          seen.add(src);

                          result.push({
                              type: "video",
                              url: src,
                              label:
                                  video.getAttribute(
                                      "aria-label"
                                  ) || ""
                          });
                      }


                      // =================================================
                      // FOTOS
                      // =================================================

                      const images =
                          Array.from(
                              document.querySelectorAll(
                                  "img.media-content__image"
                              )
                          );

                      for (const img of images) {

                          const src =
                              img.getAttribute("src") || "";

                          if (!src) {
                              continue;
                          }

                          if (
                              src.startsWith("blob:")
                              ||
                              src.startsWith("data:")
                          ) {
                              continue;
                          }

                          // ---------------------------------------------
                          // Si la imagen pertenece a una tarjeta que
                          // contiene un video, es solamente el preview.
                          // NO la agregamos.
                          // ---------------------------------------------

                          let node = img;
                          let belongsToVideo = false;

                          for (
                              let i = 0;
                              i < 10 && node;
                              i++
                          ) {

                              if (
                                  node.querySelector &&
                                  node.querySelector(
                                      "video[src]"
                                  )
                              ) {
                                  belongsToVideo = true;
                                  break;
                              }

                              node =
                                  node.parentElement;
                          }

                          if (belongsToVideo) {
                              continue;
                          }

                          // ---------------------------------------------
                          // Buscar botón de descarga dentro de la
                          // tarjeta de esta Story.
                          // ---------------------------------------------

                          let container = img;
                          let downloadUrl = "";

                          for (
                              let i = 0;
                              i < 10 && container;
                              i++
                          ) {

                              const download =
                                  container.querySelector(
                                      "a.download-btn[href]"
                                  );

                              if (download) {

                                  const href =
                                      download.getAttribute(
                                          "href"
                                      ) || "";

                                  if (
                                      href.includes(
                                          "media.sssinstagram.com/get"
                                      )
                                  ) {
                                      downloadUrl = href;
                                      break;
                                  }
                              }

                              container =
                                  container.parentElement;
                          }

                          const finalUrl =
                              downloadUrl || src;

                          if (!finalUrl) {
                              continue;
                          }

                          if (seen.has(finalUrl)) {
                              continue;
                          }

                          seen.add(finalUrl);

                          result.push({
                              type: "photo",
                              url: finalUrl,
                              label:
                                  img.getAttribute(
                                      "alt"
                                  ) || ""
                          });
                      }

                      return result;
                  }
                  """
              )

              videos = [
                  item
                  for item in media
                  if item["type"] == "video"
              ]

              photos = [
                  item
                  for item in media
                  if item["type"] == "photo"
              ]

              print(
                  f"Multimedia encontrada: {len(media)}"
              )

              print(
                  f"  🎥 Videos: {len(videos)}"
              )

              print(
                  f"  📸 Fotos: {len(photos)}"
              )

              return media


          def scroll_stories(page, media):
              print(
                  "Buscando scroll interno..."
              )

              stable = 0

              for ronda in range(1, 21):

                  before = len(media)

                  moved = page.evaluate(
                      """
                      () => {

                          const elements =
                              Array.from(
                                  document.querySelectorAll("*")
                              );

                          const scrollables =
                              elements.filter(el => {

                                  const style =
                                      getComputedStyle(el);

                                  return (
                                      el.scrollHeight >
                                      el.clientHeight + 100
                                      &&
                                      (
                                          style.overflowY === "auto"
                                          ||
                                          style.overflowY === "scroll"
                                          ||
                                          style.overflow === "auto"
                                          ||
                                          style.overflow === "scroll"
                                      )
                                  );
                              });

                          let movedCount = 0;

                          for (
                              const el of scrollables
                          ) {

                              const oldTop =
                                  el.scrollTop;

                              const amount =
                                  Math.max(
                                      500,
                                      Math.floor(
                                          el.clientHeight *
                                          0.85
                                      )
                                  );

                              el.scrollTop =
                                  Math.min(
                                      oldTop + amount,
                                      el.scrollHeight
                                  );

                              if (
                                  el.scrollTop !==
                                  oldTop
                              ) {
                                  movedCount++;
                              }
                          }

                          return movedCount;
                      }
                      """
                  )

                  time.sleep(1.5)

                  new_items = collect_media(page)

                  for item in new_items:

                      key = (
                          item["type"],
                          item["url"]
                      )

                      exists = any(
                          (
                              old["type"],
                              old["url"]
                          ) == key
                          for old in media
                      )

                      if not exists:
                          media.append(item)

                  added = len(media) - before

                  print(
                      f"Scroll {ronda}/20 | "
                      f"movidos={moved} | "
                      f"nuevos={added} | "
                      f"total={len(media)}"
                  )

                  if added == 0 and moved == 0:
                      stable += 1
                  else:
                      stable = 0

                  if stable >= 2:
                      break

              return media


          def download_media(url, account, index):
              DOWNLOAD_DIR.mkdir(
                  parents=True,
                  exist_ok=True
              )

              print(
                  f"Descargando {index}:"
              )

              print(
                  url[:250]
              )

              try:
                  response = requests.get(
                      url,
                      timeout=120,
                      headers={
                          "User-Agent":
                              "Mozilla/5.0 "
                              "(Windows NT 10.0; Win64; x64) "
                              "AppleWebKit/537.36 "
                              "(KHTML, like Gecko) "
                              "Chrome/131.0 Safari/537.36"
                      }
                  )

                  print(
                      f"HTTP: {response.status_code}"
                  )

                  response.raise_for_status()

                  content_type = (
                      response.headers.get(
                          "Content-Type",
                          ""
                      )
                  )

                  print(
                      f"Content-Type: {content_type}"
                  )

                  extension = extension_from_response(
                      content_type,
                      url
                  )

                  filename = (
                      f"{account}_"
                      f"{index}_"
                      f"{int(time.time() * 1000)}"
                      f"{extension}"
                  )

                  path = (
                      DOWNLOAD_DIR /
                      filename
                  )

                  with open(path, "wb") as f:
                      f.write(response.content)

                  print(
                      f"Archivo: {path}"
                  )

                  print(
                      f"Tamaño: {path.stat().st_size} bytes"
                  )

                  return path, content_type

              except Exception as e:
                  print(
                      f"❌ Error descargando: {e}"
                  )

                  return None, None


          def process_account(page, account, state):

              print()
              print("=" * 50)
              print(
                  f"CUENTA: {account}"
              )
              print("=" * 50)

              account_state = state.get(
                  account,
                  {}
              )

              known_hashes = set(
                  account_state.get(
                      "hashes",
                      []
                  )
              )

              initialized = bool(
                  account_state.get(
                      "initialized",
                      False
                  )
              )

              print(
                  f"Hashes conocidos: "
                  f"{len(known_hashes)}"
              )

              print(
                  f"Inicializada: "
                  f"{initialized}"
              )

              if not open_stories(
                  page,
                  account
              ):
                  return 0

              time.sleep(2)

              media = collect_media(page)

              media = scroll_stories(
                  page,
                  media
              )

              # --------------------------------------------------------
              # Eliminar duplicados finales
              # --------------------------------------------------------

              unique = []
              seen = set()

              for item in media:

                  key = (
                      item["type"],
                      item["url"]
                  )

                  if key in seen:
                      continue

                  seen.add(key)
                  unique.append(item)

              media = unique

              print()
              print(
                  f"TOTAL FINAL: {len(media)}"
              )

              print(
                  f"Videos: "
                  f"{sum(1 for x in media if x['type'] == 'video')}"
              )

              print(
                  f"Fotos: "
                  f"{sum(1 for x in media if x['type'] == 'photo')}"
              )

              if not media:
                  print(
                      "⚠️ No se encontraron Stories."
                  )

                  return 0

              pending = []

              for index, item in enumerate(
                  media,
                  start=1
              ):

                  path, content_type = (
                      download_media(
                          item["url"],
                          account,
                          index
                      )
                  )

                  if path is None:
                      continue

                  file_hash = sha256_file(path)

                  print(
                      f"SHA-256: {file_hash}"
                  )

                  # ----------------------------------------------------
                  # Cuenta nueva: baseline
                  # ----------------------------------------------------

                  if not initialized:

                      print(
                          "🆕 Cuenta nueva. "
                          "Se agrega al estado "
                          "sin enviar."
                      )

                      known_hashes.add(
                          file_hash
                      )

                      path.unlink(
                          missing_ok=True
                      )

                      continue

                  # ----------------------------------------------------
                  # Story ya conocida
                  # ----------------------------------------------------

                  if (
                      file_hash in known_hashes
                      and not FORCE_RESEND
                  ):

                      print(
                          "⏭️ Story ya enviada."
                      )

                      path.unlink(
                          missing_ok=True
                      )

                      continue

                  if (
                      file_hash in known_hashes
                      and FORCE_RESEND
                  ):

                      print(
                          "🔄 FORCE_RESEND: "
                          "se reenviará."
                      )

                  # ----------------------------------------------------
                  # Determinar tipo por archivo descargado
                  # ----------------------------------------------------

                  actual_type = item["type"]

                  if (
                      content_type.lower()
                      .startswith("video/")
                  ):
                      actual_type = "video"

                  pending.append(
                      (
                          path,
                          actual_type,
                          file_hash
                      )
                  )

              # --------------------------------------------------------
              # Guardar baseline
              # --------------------------------------------------------

              if not initialized:

                  state[account] = {
                      "initialized": True,
                      "hashes": list(
                          known_hashes
                      )[-100:]
                  }

                  print(
                      f"Baseline creada: "
                      f"{len(known_hashes)} hashes."
                  )

                  return 0

              # --------------------------------------------------------
              # Enviar
              # --------------------------------------------------------

              print()
              print(
                  f"Stories para enviar: "
                  f"{len(pending)}"
              )

              sent = 0

              for (
                  path,
                  media_type,
                  file_hash
              ) in pending:

                  print()
                  print(
                      f"Enviando Story de "
                      f"@{account}"
                  )

                  print(
                      f"Tipo detectado: "
                      f"{media_type}"
                  )

                  print(
                      f"Archivo: "
                      f"{path}"
                  )

                  if media_type == "video":
                      method = "sendVideo"
                  else:
                      method = "sendPhoto"

                  success = telegram(
                      method,
                      path,
                      account,
                      media_type
                  )

                  if success:

                      print(
                          "✅ Telegram confirmó "
                          "el envío."
                      )

                      known_hashes.add(
                          file_hash
                      )

                      sent += 1

                  else:

                      print(
                          "❌ Telegram NO confirmó "
                          "el envío."
                      )

                  path.unlink(
                      missing_ok=True
                  )

              state[account] = {
                  "initialized": True,
                  "hashes": list(
                      known_hashes
                  )[-100:]
              }

              print(
                  f"Estado de @{account}: "
                  f"{len(known_hashes)} hashes."
              )

              print(
                  f"Enviadas: {sent}"
              )

              return sent


          def main():

              print("=" * 50)
              print(
                  "MONITOR DE INSTAGRAM STORIES"
              )
              print("=" * 50)

              accounts = load_accounts()

              print(
                  f"Cuentas a procesar: "
                  f"{len(accounts)}"
              )

              for account in accounts:
                  print(
                      f"  - @{account}"
                  )

              print("=" * 50)

              if not TELEGRAM_BOT_TOKEN:
                  raise RuntimeError(
                      "Falta TELEGRAM_BOT_TOKEN"
                  )

              if not TELEGRAM_CHAT_ID:
                  raise RuntimeError(
                      "Falta TELEGRAM_CHAT_ID"
                  )

              state = load_state()

              total_sent = 0

              DOWNLOAD_DIR.mkdir(
                  parents=True,
                  exist_ok=True
              )

              with sync_playwright() as p:

                  browser = p.chromium.launch(
                      headless=True
                  )

                  page = browser.new_page(
                      viewport={
                          "width": 1440,
                          "height": 1200
                      }
                  )

                  page.set_default_timeout(
                      30000
                  )

                  for account in accounts:

                      try:

                          total_sent += process_account(
                              page,
                              account,
                              state
                          )

                      except Exception as e:

                          print()
                          print(
                              f"❌ ERROR en @{account}:"
                          )

                          print(e)

                      try:
                          page.goto(
                              "about:blank"
                          )
                      except Exception:
                          pass

                  browser.close()

              save_state(state)

              print()
              print("=" * 50)
              print("RESUMEN")
              print("=" * 50)

              print(
                  f"Cuentas procesadas: "
                  f"{len(accounts)}"
              )

              print(
                  f"Stories enviadas: "
                  f"{total_sent}"
              )

              print(
                  f"Estado guardado: "
                  f"{STATE_FILE}"
              )

              print("=" * 50)


          if __name__ == "__main__":
              main()
          PY

      - name: Comprobar sintaxis
        run: |
          python -m py_compile monitor_instagram.py

      - name: Ejecutar monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -u monitor_instagram.py

      - name: Guardar estado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/instagram-state.json

          if git diff --cached --quiet; then
            echo "No hay cambios en el estado."
          else
            git commit -m "Actualizar estado de Instagram Stories"
            git push
          fi

      - name: Limpiar archivos temporales
        if: always()
        run: |
          rm -rf downloads
          rm -f monitor_instagram.py
