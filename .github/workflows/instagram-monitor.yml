name: Instagram Monitor

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:

  monitor-instagram:

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. DESCARGAR EL REPOSITORIO
      # ============================================================

      - name: Descargar repositorio
        uses: actions/checkout@v4


      # ============================================================
      # 2. INSTALAR DEPENDENCIAS
      # ============================================================

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests
          playwright install --with-deps chromium


      # ============================================================
      # 3. BUSCAR STORIES
      # ============================================================

      - name: Buscar Stories de Instagram

        env:
          SSS_URL: "https://sssinstagram.com/es/story-saver"

        run: |

          cat > monitor_instagram.py <<'PY'

          from playwright.sync_api import sync_playwright
          import requests
          import hashlib
          import json
          import os
          import re


          # ========================================================
          # CONFIGURACIÓN
          # ========================================================

          SSS_URL = os.environ.get(
              "SSS_URL",
              "https://sssinstagram.com/es/story-saver"
          )

          ACCOUNTS_FILE = (
              "data/instagram-accounts.json"
          )

          STATE_FILE = (
              "data/instagram-state.json"
          )

          DOWNLOAD_DIR = "downloads"


          os.makedirs(
              DOWNLOAD_DIR,
              exist_ok=True
          )

          os.makedirs(
              "data",
              exist_ok=True
          )


          # ========================================================
          # CARGAR CUENTAS
          # ========================================================

          if not os.path.exists(
              ACCOUNTS_FILE
          ):

              raise Exception(
                  f"No existe {ACCOUNTS_FILE}"
              )


          with open(
              ACCOUNTS_FILE,
              "r",
              encoding="utf-8"
          ) as f:

              accounts = json.load(f)


          if not isinstance(
              accounts,
              list
          ):

              raise Exception(
                  "instagram-accounts.json "
                  "debe contener una lista."
              )


          # --------------------------------------------------------
          # LIMPIAR Y VALIDAR NOMBRES
          # --------------------------------------------------------

          clean_accounts = []


          for account in accounts:

              if not isinstance(
                  account,
                  str
              ):

                  continue


              account = account.strip()


              # Permitir que el usuario escriba @cuenta
              if account.startswith("@"):

                  account = account[1:]


              # Permitir accidentalmente una URL
              if "instagram.com/" in account:

                  account = (
                      account
                      .split("instagram.com/", 1)[1]
                      .split("/", 1)[0]
                      .split("?", 1)[0]
                  )


              if not account:

                  continue


              if account not in clean_accounts:

                  clean_accounts.append(
                      account
                  )


          accounts = clean_accounts


          if not accounts:

              raise Exception(
                  "No hay cuentas configuradas."
              )


          print(
              "========================================"
          )

          print(
              "INSTAGRAM MONITOR"
          )

          print(
              "========================================"
          )

          print(
              "Cuentas configuradas:",
              len(accounts)
          )


          for account in accounts:

              print(
                  f"  • {account}"
              )


          # ========================================================
          # CARGAR ESTADO
          # ========================================================

          if os.path.exists(
              STATE_FILE
          ):

              try:

                  with open(
                      STATE_FILE,
                      "r",
                      encoding="utf-8"
                  ) as f:

                      state = json.load(f)

              except Exception:

                  print(
                      "⚠️ No se pudo leer "
                      "instagram-state.json."
                  )

                  state = {}

          else:

              state = {}


          if not isinstance(
              state,
              dict
          ):

              state = {}


          # ========================================================
          # RESULTADOS
          # ========================================================

          downloaded = []


          # ========================================================
          # PLAYWRIGHT
          # ========================================================

          with sync_playwright() as p:

              browser = p.chromium.launch(
                  headless=True
              )

              context = browser.new_context(

                  viewport={
                      "width": 1366,
                      "height": 900
                  },

                  user_agent=(
                      "Mozilla/5.0 "
                      "(X11; Linux x86_64) "
                      "AppleWebKit/537.36 "
                      "(KHTML, like Gecko) "
                      "Chrome/139.0.0.0 "
                      "Safari/537.36"
                  )

              )


              # ====================================================
              # PROCESAR CADA CUENTA
              # ====================================================

              for account_index, account in enumerate(
                  accounts
              ):

                  print(
                      "\n"
                      "========================================"
                  )

                  print(
                      f"CUENTA "
                      f"{account_index + 1}/"
                      f"{len(accounts)}: "
                      f"{account}"
                  )

                  print(
                      "========================================"
                  )


                  profile_url = (
                      f"https://www.instagram.com/"
                      f"{account}/"
                  )


                  # =================================================
                  # ESTADO DE ESTA CUENTA
                  # =================================================

                  account_state = state.get(
                      account
                  )


                  legacy_state = False


                  if isinstance(
                      account_state,
                      dict
                  ):

                      known_hashes = set(
                          account_state.get(
                              "hashes",
                              []
                          )
                      )

                  elif isinstance(
                      account_state,
                      list
                  ):

                      # Estado antiguo
                      legacy_state = True

                      known_hashes = set()

                  else:

                      # Cuenta nueva
                      known_hashes = set()


                  account_is_new = (
                      account not in state
                  )


                  print(
                      "Hashes conocidos:",
                      len(known_hashes)
                  )


                  # =================================================
                  # NUEVA PÁGINA PARA ESTA CUENTA
                  # =================================================

                  page = context.new_page()


                  try:

                      # =============================================
                      # ABRIR SSSINSTAGRAM
                      # =============================================

                      print(
                          "\nAbriendo SSSInstagram..."
                      )

                      page.goto(
                          SSS_URL,
                          wait_until="domcontentloaded",
                          timeout=60000
                      )

                      page.wait_for_timeout(
                          3000
                      )


                      # =============================================
                      # INTRODUCIR PERFIL
                      # =============================================

                      print(
                          "Introduciendo perfil..."
                      )

                      input_box = page.locator(
                          "input[type='text'], "
                          "input[type='url']"
                      ).first


                      if not input_box.is_visible():

                          raise Exception(
                              "No se encontró el campo "
                              "para introducir el perfil."
                          )


                      input_box.fill(
                          profile_url
                      )


                      # =============================================
                      # BOTÓN DESCARGAR
                      # =============================================

                      print(
                          "Buscando botón Descargar..."
                      )

                      download_button = page.get_by_role(
                          "button",
                          name=re.compile(
                              "descargar",
                              re.I
                          )
                      ).first


                      if not download_button.is_visible():

                          download_button = page.get_by_text(
                              re.compile(
                                  "descargar",
                                  re.I
                              )
                          ).first


                      if not download_button.is_visible():

                          raise Exception(
                              "No se encontró "
                              "el botón Descargar."
                          )


                      print(
                          "Pulsando Descargar..."
                      )

                      download_button.click()


                      # =============================================
                      # ESPERAR RESULTADOS
                      # =============================================

                      print(
                          "Esperando resultados..."
                      )

                      page.wait_for_timeout(
                          10000
                      )


                      # =============================================
                      # BUSCAR STORIES
                      # =============================================

                      print(
                          "\nBuscando sección Stories..."
                      )

                      story_tab_found = False


                      patterns = [
                          r"stories",
                          r"story",
                          r"historias",
                          r"historia"
                      ]


                      for pattern in patterns:

                          try:

                              elements = page.get_by_text(
                                  re.compile(
                                      pattern,
                                      re.I
                                  )
                              )


                              count = elements.count()


                              for i in range(
                                  min(count, 15)
                              ):

                                  element = elements.nth(i)


                                  try:

                                      if not element.is_visible():
                                          continue


                                      text = (
                                          element
                                          .inner_text()
                                          .strip()
                                      )


                                      if not text:
                                          continue


                                      print(
                                          "Elemento encontrado:",
                                          repr(text)
                                      )


                                      element.click(
                                          timeout=3000
                                      )


                                      page.wait_for_timeout(
                                          5000
                                      )


                                      story_tab_found = True

                                      break


                                  except Exception:

                                      pass


                              if story_tab_found:

                                  break


                          except Exception:

                              pass


                      if story_tab_found:

                          print(
                              "✅ Se abrió "
                              "la sección Stories."
                          )

                      else:

                          print(
                              "⚠️ No se identificó "
                              "la pestaña Stories."
                          )


                      # =============================================
                      # OBTENER URLS MULTIMEDIA
                      # =============================================

                      print(
                          "\nBuscando URLs multimedia..."
                      )


                      links = page.locator(
                          "a"
                      )


                      media_urls = []


                      for i in range(
                          links.count()
                      ):

                          try:

                              href = (
                                  links
                                  .nth(i)
                                  .get_attribute(
                                      "href"
                                  )
                              )


                              if not href:
                                  continue


                              if (
                                  "media.sssinstagram.com/get"
                                  not in href.lower()
                              ):
                                  continue


                              if href not in media_urls:

                                  media_urls.append(
                                      href
                                  )


                          except Exception:

                              pass


                      print(
                          "URLs multimedia encontradas:",
                          len(media_urls)
                      )


                      # =============================================
                      # SI NO ENCONTRÓ STORIES
                      # =============================================

                      if not media_urls:

                          print(
                              "⚠️ No se encontraron "
                              "Stories para esta cuenta."
                          )

                          page.close()

                          continue


                      # =============================================
                      # PROCESAR MEDIA
                      # =============================================

                      for media_index, media_url in enumerate(
                          media_urls
                      ):

                          print(
                              f"\nProcesando media "
                              f"{media_index + 1}/"
                              f"{len(media_urls)}..."
                          )


                          # =========================================
                          # DESCARGAR
                          # =========================================

                          print(
                              "⬇️ Descargando..."
                          )


                          try:

                              response = requests.get(

                                  media_url,

                                  stream=True,

                                  timeout=60,

                                  headers={
                                      "User-Agent":
                                      "Mozilla/5.0"
                                  }

                              )

                          except Exception as e:

                              print(
                                  "❌ Error de descarga:",
                                  e
                              )

                              continue


                          print(
                              "HTTP:",
                              response.status_code
                          )


                          if response.status_code != 200:

                              print(
                                  "❌ No se pudo descargar."
                              )

                              continue


                          content_type = (
                              response
                              .headers
                              .get(
                                  "content-type",
                                  ""
                              )
                              .lower()
                          )


                          # =========================================
                          # EXTENSIÓN
                          # =========================================

                          if "video" in content_type:

                              extension = ".mp4"

                          elif "png" in content_type:

                              extension = ".png"

                          elif "webp" in content_type:

                              extension = ".webp"

                          else:

                              extension = ".jpg"


                          temp_filename = (
                              f"{DOWNLOAD_DIR}/"
                              f"temp_"
                              f"{account_index}_"
                              f"{media_index}"
                              f"{extension}"
                          )


                          # =========================================
                          # GUARDAR TEMPORAL
                          # =========================================

                          try:

                              with open(
                                  temp_filename,
                                  "wb"
                              ) as f:

                                  for chunk in response.iter_content(
                                      chunk_size=1024 * 1024
                                  ):

                                      if chunk:

                                          f.write(
                                              chunk
                                          )

                          except Exception as e:

                              print(
                                  "❌ Error guardando:",
                                  e
                              )

                              continue


                          filesize = os.path.getsize(
                              temp_filename
                          )


                          print(
                              "Tamaño:",
                              filesize,
                              "bytes"
                          )


                          if filesize == 0:

                              print(
                                  "❌ Archivo vacío."
                              )

                              os.remove(
                                  temp_filename
                              )

                              continue


                          # =========================================
                          # CALCULAR SHA-256
                          # =========================================

                          print(
                              "🔎 Calculando SHA-256..."
                          )


                          sha256 = hashlib.sha256()


                          with open(
                              temp_filename,
                              "rb"
                          ) as f:

                              while True:

                                  chunk = f.read(
                                      1024 * 1024
                                  )

                                  if not chunk:

                                      break

                                  sha256.update(
                                      chunk
                                  )


                          file_hash = (
                              sha256.hexdigest()
                          )


                          print(
                              "Hash:",
                              file_hash
                          )


                          # =========================================
                          # COMPROBAR DUPLICADO
                          # =========================================

                          if file_hash in known_hashes:

                              print(
                                  "⏭️ Esta Story ya "
                                  "fue enviada."
                              )

                              os.remove(
                                  temp_filename
                              )

                              continue


                          # =========================================
                          # CUENTA NUEVA
                          # =========================================
                          #
                          # Si la cuenta acaba de agregarse,
                          # las Stories que ya estaban activas
                          # NO se envían.
                          #
                          # Se registran como conocidas.
                          # =========================================

                          if account_is_new or legacy_state:

                              print(
                                  "🆕 Story actual de "
                                  "cuenta nueva."
                              )

                              print(
                                  "Se registra como conocida "
                                  "sin enviarla."
                              )

                              known_hashes.add(
                                  file_hash
                              )

                              os.remove(
                                  temp_filename
                              )

                              continue


                          # =========================================
                          # NUEVA STORY
                          # =========================================

                          filename = (
                              f"{DOWNLOAD_DIR}/"
                              f"{file_hash}"
                              f"{extension}"
                          )


                          os.rename(
                              temp_filename,
                              filename
                          )


                          downloaded.append({

                              "account": account,

                              "hash": file_hash,

                              "filename": filename,

                              "type": (
                                  "video"
                                  if extension == ".mp4"
                                  else "photo"
                              )

                          })


                          print(
                              "🆕 Story nueva encontrada."
                          )


                  except Exception as e:

                      print(
                          f"❌ Error procesando "
                          f"{account}:"
                      )

                      print(
                          str(e)
                      )


                  finally:

                      try:

                          page.close()

                      except Exception:

                          pass


                  # =================================================
                  # GUARDAR ESTADO DE CUENTA
                  # =================================================

                  state[account] = {

                      "hashes": list(
                          known_hashes
                      )[-100:]

                  }


                  print(
                      f"\nEstado de {account}: "
                      f"{len(known_hashes)} hashes."
                  )


              # ====================================================
              # CERRAR NAVEGADOR
              # ====================================================

              browser.close()


          # ========================================================
          # GUARDAR FILES.JSON
          # ========================================================

          with open(
              "files.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  downloaded,
                  f,
                  indent=2,
                  ensure_ascii=False
              )


          # ========================================================
          # GUARDAR ESTADO
          # ========================================================

          with open(
              STATE_FILE,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  state,
                  f,
                  indent=2,
                  ensure_ascii=False
              )


          # ========================================================
          # RESUMEN
          # ========================================================

          print(
              "\n========================================"
          )

          print(
              "RESUMEN"
          )

          print(
              "========================================"
          )

          print(
              "Cuentas procesadas:",
              len(accounts)
          )

          print(
              "Stories nuevas:",
              len(downloaded)
          )

          print(
              "========================================"
          )

          PY


          python monitor_instagram.py


      # ============================================================
      # 4. ENVIAR STORIES A TELEGRAM
      # ============================================================

      - name: Enviar Stories a Telegram

        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |

          if [ ! -f files.json ]; then

            echo "No existe files.json."

            exit 0

          fi


          COUNT=$(python -c "
          import json
          with open('files.json', encoding='utf-8') as f:
              print(len(json.load(f)))
          ")


          echo "Stories para enviar: $COUNT"


          if [ "$COUNT" -eq 0 ]; then

            echo "No hay Stories nuevas."

            exit 0

          fi


          python - <<'PY'

          import json
          import os
          import subprocess


          TOKEN = os.environ[
              "TELEGRAM_BOT_TOKEN"
          ]

          CHAT_ID = os.environ[
              "TELEGRAM_CHAT_ID"
          ]


          with open(
              "files.json",
              "r",
              encoding="utf-8"
          ) as f:

              files = json.load(f)


          successfully_sent = []


          for item in files:

              filename = item[
                  "filename"
              ]

              file_hash = item[
                  "hash"
              ]

              account = item[
                  "account"
              ]

              media_type = item[
                  "type"
              ]


              print(
                  "\n================================"
              )

              print(
                  f"Enviando Story de @{account}"
              )

              print(
                  f"Archivo: {filename}"
              )

              print(
                  "================================"
              )


              # ====================================================
              # CAPTION
              # ====================================================

              caption = (
                  "📱 Instagram Monitor\n"
                  f"@{account}\n"
                  "Nueva Story"
              )


              # ====================================================
              # VIDEO
              # ====================================================

              if media_type == "video":

                  endpoint = (
                      "https://api.telegram.org/"
                      f"bot{TOKEN}/sendVideo"
                  )


                  command = [

                      "curl",
                      "-sS",
                      "-X",
                      "POST",

                      endpoint,

                      "-F",
                      f"chat_id={CHAT_ID}",

                      "-F",
                      f"video=@{filename}",

                      "-F",
                      f"caption={caption}"

                  ]


              # ====================================================
              # IMAGEN
              # ====================================================

              else:

                  endpoint = (
                      "https://api.telegram.org/"
                      f"bot{TOKEN}/sendPhoto"
                  )


                  command = [

                      "curl",
                      "-sS",
                      "-X",
                      "POST",

                      endpoint,

                      "-F",
                      f"chat_id={CHAT_ID}",

                      "-F",
                      f"photo=@{filename}",

                      "-F",
                      f"caption={caption}"

                  ]


              # ====================================================
              # ENVIAR
              # ====================================================

              result = subprocess.run(

                  command,

                  capture_output=True,

                  text=True

              )


              response = result.stdout


              print(
                  "Respuesta Telegram:"
              )

              print(
                  response
              )


              # ====================================================
              # COMPROBAR RESPUESTA
              # ====================================================

              if '"ok":true' in response:

                  print(
                      "✅ Enviada correctamente."
                  )

                  successfully_sent.append({

                      "account": account,

                      "hash": file_hash

                  })

              else:

                  print(
                      "❌ Telegram NO confirmó "
                      "el envío."
                  )


          # ========================================================
          # CARGAR ESTADO
          # ========================================================

          state_file = (
              "data/instagram-state.json"
          )


          if os.path.exists(
              state_file
          ):

              try:

                  with open(
                      state_file,
                      "r",
                      encoding="utf-8"
                  ) as f:

                      state = json.load(f)

              except:

                  state = {}

          else:

              state = {}


          # ========================================================
          # GUARDAR SOLO STORIES ENVIADAS
          # ========================================================

          for item in successfully_sent:

              account = item[
                  "account"
              ]

              file_hash = item[
                  "hash"
              ]


              if not isinstance(
                  state.get(account),
                  dict
              ):

                  state[account] = {
                      "hashes": []
                  }


              hashes = set(
                  state[account].get(
                      "hashes",
                      []
                  )
              )


              hashes.add(
                  file_hash
              )


              state[account][
                  "hashes"
              ] = list(
                  hashes
              )[-100:]


          # ========================================================
          # GUARDAR ESTADO
          # ========================================================

          with open(
              state_file,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  state,
                  f,
                  indent=2,
                  ensure_ascii=False
              )


          print(
              "\n================================"
          )

          print(
              "Stories enviadas correctamente:",
              len(successfully_sent)
          )

          print(
              "================================"
          )

          PY


      # ============================================================
      # 5. GUARDAR ESTADO EN GITHUB
      # ============================================================

      - name: Guardar estado en GitHub

        run: |

          git config user.name \
            "Instagram Monitor"

          git config user.email \
            "instagram-monitor@users.noreply.github.com"


          git add data/instagram-state.json


          if git diff --cached --quiet; then

            echo "No hay cambios en el estado."

          else

            git commit \
              -m "Actualizar estado de Instagram"

            git push

          fi


      # ============================================================
      # 6. LIMPIAR
      # ============================================================

      - name: Limpiar archivos temporales

        if: always()

        run: |

          rm -rf downloads

          rm -f files.json

          rm -f monitor_instagram.py

          rm -f sssinstagram-debug.html

          rm -f sssinstagram-debug.png

          echo "🧹 Limpieza completada."
