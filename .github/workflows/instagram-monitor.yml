name: DIAGNOSTICO Instagram Stories

on:
  workflow_dispatch:

jobs:
  diagnostico:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium

      - name: Ejecutar diagnóstico
        shell: python
        run: |
          import time
          from playwright.sync_api import sync_playwright

          SSS_URL = "https://sssinstagram.com/es/story-saver"
          ACCOUNT = "laderechadiario"

          print("")
          print("=" * 70)
          print("DIAGNÓSTICO SSSINSTAGRAM")
          print("=" * 70)
          print(f"Cuenta: @{ACCOUNT}")
          print("=" * 70)

          def inspect_dom(page, momento):
              print("")
              print("-" * 70)
              print(f"INSPECCIÓN DEL DOM: {momento}")
              print("-" * 70)

              print(f"URL actual: {page.url}")

              try:
                  print(f"Título: {page.title()}")
              except Exception:
                  pass

              # -------------------------------------------------------
              # TEXTO VISIBLE
              # -------------------------------------------------------

              try:
                  body_text = page.locator("body").inner_text(
                      timeout=10000
                  )

                  print("")
                  print("TEXTO VISIBLE RELACIONADO:")
                  print("-" * 40)

                  lines = [
                      x.strip()
                      for x in body_text.splitlines()
                      if x.strip()
                  ]

                  keywords = [
                      "stories",
                      "story",
                      "descargar",
                      "download",
                      "instagram",
                      "hora",
                      "hours",
                      "minutes",
                      "minutos"
                  ]

                  interesting = []

                  for line in lines:
                      lower = line.lower()

                      if any(
                          keyword in lower
                          for keyword in keywords
                      ):
                          interesting.append(line)

                  for line in interesting[:150]:
                      print(line)

                  print("")
                  print(
                      f"Líneas interesantes encontradas: "
                      f"{len(interesting)}"
                  )

              except Exception as e:
                  print(
                      f"No se pudo leer body: {e}"
                  )

              # -------------------------------------------------------
              # CANTIDAD DE ELEMENTOS
              # -------------------------------------------------------

              selectors = {
                  "img":
                      "img",

                  "a":
                      "a",

                  "video":
                      "video",

                  "source":
                      "source",

                  "button":
                      "button",

                  "iframe":
                      "iframe",

                  "img.media-content__image":
                      "img.media-content__image",

                  "img.avatar__image":
                      "img.avatar__image",

                  "a.download-btn":
                      "a.download-btn",

                  "a[href*='media.sssinstagram.com/get']":
                      'a[href*="media.sssinstagram.com/get"]',

                  "img[src*='media.sssinstagram.com/get']":
                      'img[src*="media.sssinstagram.com/get"]',

                  "video[src*='media.sssinstagram.com/get']":
                      'video[src*="media.sssinstagram.com/get"]'
              }

              print("")
              print("CANTIDAD DE ELEMENTOS:")
              print("-" * 40)

              for name, selector in selectors.items():
                  try:
                      count = page.locator(selector).count()

                      print(
                          f"{name}: {count}"
                      )

                  except Exception as e:
                      print(
                          f"{name}: ERROR {e}"
                      )

              # -------------------------------------------------------
              # IMÁGENES
              # -------------------------------------------------------

              print("")
              print("IMÁGENES ENCONTRADAS:")
              print("-" * 40)

              try:
                  images = page.locator("img")
                  count = images.count()

                  for i in range(
                      min(count, 100)
                  ):
                      img = images.nth(i)

                      try:
                          src = (
                              img.get_attribute("src")
                              or ""
                          )

                          cls = (
                              img.get_attribute("class")
                              or ""
                          )

                          alt = (
                              img.get_attribute("alt")
                              or ""
                          )

                          if (
                              "media.sssinstagram.com"
                              in src
                              or "media-content"
                              in cls
                              or "avatar"
                              in cls
                          ):
                              print(
                                  f"[IMG {i}] "
                                  f"class={cls!r} "
                                  f"alt={alt!r}"
                              )

                              print(
                                  f"       src="
                                  f"{src[:700]}"
                              )

                      except Exception:
                          pass

              except Exception as e:
                  print(
                      f"Error inspeccionando imágenes: "
                      f"{e}"
                  )

              # -------------------------------------------------------
              # LINKS
              # -------------------------------------------------------

              print("")
              print("LINKS RELACIONADOS CON MEDIA:")
              print("-" * 40)

              try:
                  links = page.locator("a")
                  count = links.count()

                  encontrados = 0

                  for i in range(count):
                      link = links.nth(i)

                      try:
                          href = (
                              link.get_attribute("href")
                              or ""
                          )

                          cls = (
                              link.get_attribute("class")
                              or ""
                          )

                          text = (
                              link.inner_text()
                              .strip()
                          )

                          if (
                              "media.sssinstagram.com"
                              in href
                              or "download"
                              in cls.lower()
                              or text.lower()
                              == "descargar"
                          ):
                              print(
                                  f"[A {i}] "
                                  f"class={cls!r} "
                                  f"text={text!r}"
                              )

                              print(
                                  f"      href="
                                  f"{href[:1000]}"
                              )

                              encontrados += 1

                              if encontrados >= 100:
                                  break

                      except Exception:
                          pass

                  print(
                      "Links relacionados "
                      f"encontrados: {encontrados}"
                  )

              except Exception as e:
                  print(
                      f"Error inspeccionando links: "
                      f"{e}"
                  )

              # -------------------------------------------------------
              # VIDEOS
              # -------------------------------------------------------

              print("")
              print("VIDEOS:")
              print("-" * 40)

              try:
                  videos = page.locator("video")
                  count = videos.count()

                  print(
                      f"Cantidad de <video>: {count}"
                  )

                  for i in range(
                      min(count, 50)
                  ):
                      video = videos.nth(i)

                      try:
                          src = (
                              video.get_attribute("src")
                              or ""
                          )

                          cls = (
                              video.get_attribute("class")
                              or ""
                          )

                          print(
                              f"[VIDEO {i}] "
                              f"class={cls!r}"
                          )

                          print(
                              f"          src="
                              f"{src[:1000]}"
                          )

                          sources = video.locator(
                              "source"
                          )

                          scount = sources.count()

                          for j in range(scount):
                              source = sources.nth(j)

                              source_src = (
                                  source.get_attribute(
                                      "src"
                                  )
                                  or ""
                              )

                              print(
                                  f"          "
                                  f"source[{j}]="
                                  f"{source_src[:1000]}"
                              )

                      except Exception:
                          pass

              except Exception as e:
                  print(
                      f"Error inspeccionando videos: "
                      f"{e}"
                  )

              # -------------------------------------------------------
              # TODOS LOS ATRIBUTOS QUE CONTENGAN
              # media.sssinstagram.com
              # -------------------------------------------------------

              print("")
              print(
                  "URLS media.sssinstagram.com "
                  "EN EL DOM:"
              )
              print("-" * 40)

              try:
                  media_urls = page.evaluate(
                      """
                      () => {
                          const results = [];

                          for (
                              const el of
                              document.querySelectorAll('*')
                          ) {
                              for (
                                  const attr of
                                  Array.from(
                                      el.attributes || []
                                  )
                              ) {
                                  if (
                                      attr.value &&
                                      attr.value.includes(
                                          'media.sssinstagram.com'
                                      )
                                  ) {
                                      results.push({
                                          tag:
                                              el.tagName,
                                          cls:
                                              el.className || '',
                                          attr:
                                              attr.name,
                                          value:
                                              attr.value
                                      });
                                  }
                              }
                          }

                          return results;
                      }
                      """
                  )

                  print(
                      "Atributos con media "
                      f"encontrados: {len(media_urls)}"
                  )

                  for item in media_urls[:150]:
                      print(
                          f"<{item['tag'].lower()}> "
                          f"class="
                          f"{item['cls']!r} "
                          f"attr="
                          f"{item['attr']!r}"
                      )

                      print(
                          f"    "
                          f"{item['value'][:1000]}"
                      )

              except Exception as e:
                  print(
                      "Error buscando URLs media: "
                      f"{e}"
                  )

              # -------------------------------------------------------
              # ELEMENTOS QUE CONTIENEN "STORIES"
              # -------------------------------------------------------

              print("")
              print(
                  "ELEMENTOS QUE CONTIENEN "
                  "'STORIES':"
              )
              print("-" * 40)

              try:
                  elements = page.locator(
                      "text=/Stories/i"
                  )

                  count = elements.count()

                  print(
                      f"Coincidencias: {count}"
                  )

                  for i in range(
                      min(count, 30)
                  ):
                      el = elements.nth(i)

                      try:
                          tag = el.evaluate(
                              "(e) => e.tagName"
                          )

                          cls = (
                              el.get_attribute(
                                  "class"
                              )
                              or ""
                          )

                          text = (
                              el.inner_text()
                              .strip()
                          )

                          print(
                              f"[{i}] "
                              f"tag={tag}"
                          )

                          print(
                              f"    class="
                              f"{cls!r}"
                          )

                          print(
                              f"    text="
                              f"{text[:500]!r}"
                          )

                      except Exception:
                          pass

              except Exception as e:
                  print(
                      "Error buscando elementos "
                      f"Stories: {e}"
                  )

          def get_scrollables(page):
              return page.evaluate(
                  """
                  () => {
                      const elements = [
                          document.documentElement,
                          document.body,
                          ...document.querySelectorAll('*')
                      ];

                      const result = [];

                      elements.forEach(
                          (el, index) => {
                              try {
                                  const style =
                                      getComputedStyle(el);

                                  const scrollable =
                                      el.scrollHeight >
                                      el.clientHeight + 100;

                                  const overflow =
                                      style.overflowY === 'auto' ||
                                      style.overflowY === 'scroll' ||
                                      style.overflow === 'auto' ||
                                      style.overflow === 'scroll';

                                  if (
                                      scrollable &&
                                      overflow
                                  ) {
                                      result.push({
                                          index: index,
                                          tag:
                                              el.tagName,
                                          id:
                                              el.id || "",
                                          className:
                                              typeof el.className
                                              === "string"
                                                  ? el.className
                                                  : "",
                                          scrollHeight:
                                              el.scrollHeight,
                                          clientHeight:
                                              el.clientHeight,
                                          scrollTop:
                                              el.scrollTop
                                      });
                                  }

                              } catch (e) {}
                          }
                      );

                      return result;
                  }
                  """
              )

          def scroll_containers(
              page,
              rounds=20
          ):
              print("")
              print("=" * 70)
              print(
                  "BUSCANDO CONTENEDORES "
                  "CON SCROLL INTERNO"
              )
              print("=" * 70)

              stable_rounds = 0

              for round_number in range(
                  1,
                  rounds + 1
              ):

                  containers = get_scrollables(
                      page
                  )

                  print("")
                  print(
                      f"Ronda de scroll "
                      f"{round_number}/{rounds}"
                  )

                  print(
                      "Contenedores encontrados: "
                      f"{len(containers)}"
                  )

                  if containers:
                      for i, item in enumerate(
                          containers[:20]
                      ):
                          print(
                              f"  [{i}] "
                              f"<{item['tag'].lower()}> "
                              f"id={item['id']!r} "
                              f"class="
                              f"{item['className']!r} "
                              f"scrollTop="
                              f"{item['scrollTop']} "
                              f"scrollHeight="
                              f"{item['scrollHeight']} "
                              f"clientHeight="
                              f"{item['clientHeight']}"
                          )

                  moved = page.evaluate(
                      """
                      () => {
                          const elements = [
                              document.documentElement,
                              document.body,
                              ...document.querySelectorAll('*')
                          ];

                          let moved = 0;

                          for (
                              const el of elements
                          ) {
                              try {
                                  const style =
                                      getComputedStyle(el);

                                  const scrollable =
                                      el.scrollHeight >
                                      el.clientHeight + 100;

                                  const overflow =
                                      style.overflowY === 'auto' ||
                                      style.overflowY === 'scroll' ||
                                      style.overflow === 'auto' ||
                                      style.overflow === 'scroll';

                                  if (
                                      !scrollable ||
                                      !overflow
                                  ) {
                                      continue;
                                  }

                                  const oldTop =
                                      el.scrollTop;

                                  const amount =
                                      Math.max(
                                          500,
                                          Math.floor(
                                              el.clientHeight
                                              * 0.85
                                          )
                                      );

                                  const newTop =
                                      Math.min(
                                          oldTop + amount,
                                          el.scrollHeight
                                      );

                                  el.scrollTop =
                                      newTop;

                                  if (
                                      el.scrollTop !==
                                      oldTop
                                  ) {
                                      moved++;
                                  }

                              } catch (e) {}
                          }

                          return moved;
                      }
                      """
                  )

                  print(
                      f"Elementos desplazados: "
                      f"{moved}"
                  )

                  time.sleep(2)

                  media_count = page.evaluate(
                      """
                      () => {
                          const urls = new Set();

                          for (
                              const el of
                              document.querySelectorAll('*')
                          ) {
                              for (
                                  const attr of
                                  Array.from(
                                      el.attributes || []
                                  )
                              ) {
                                  if (
                                      attr.value &&
                                      attr.value.includes(
                                          'media.sssinstagram.com/get'
                                      )
                                  ) {
                                      urls.add(
                                          attr.value
                                      );
                                  }
                              }
                          }

                          return urls.size;
                      }
                      """
                  )

                  print(
                      "URLs media únicas "
                      "visibles en DOM: "
                      f"{media_count}"
                  )

                  if moved == 0:
                      stable_rounds += 1
                  else:
                      stable_rounds = 0

                  if stable_rounds >= 2:
                      print(
                          "No se detectan más "
                          "desplazamientos."
                      )
                      break

          # ==========================================================
          # INICIAR PLAYWRIGHT
          # ==========================================================

          with sync_playwright() as p:

              print("")
              print(
                  "Iniciando Chromium..."
              )

              browser = p.chromium.launch(
                  headless=True,
                  args=[
                      "--disable-blink-features="
                      "AutomationControlled"
                  ]
              )

              context = browser.new_context(
                  viewport={
                      "width": 1440,
                      "height": 1000
                  },
                  locale="es-ES"
              )

              page = context.new_page()

              # ======================================================
              # ABRIR SSSINSTAGRAM
              # ======================================================

              print("")
              print(
                  "Abriendo SSSInstagram..."
              )

              print(SSS_URL)

              page.goto(
                  SSS_URL,
                  wait_until="domcontentloaded",
                  timeout=60000
              )

              time.sleep(5)

              print("")
              print(
                  "Página inicial cargada."
              )

              inspect_dom(
                  page,
                  "ANTES DE INTRODUCIR LA CUENTA"
              )

              # ======================================================
              # INTRODUCIR CUENTA
              # ======================================================

              profile_url = (
                  f"https://www.instagram.com/"
                  f"{ACCOUNT}/"
              )

              print("")
              print("=" * 70)
              print(
                  "INTRODUCIENDO CUENTA"
              )
              print("=" * 70)
              print(profile_url)

              inputs = page.locator("input")

              print(
                  "Inputs encontrados: "
                  f"{inputs.count()}"
              )

              if inputs.count() == 0:
                  print(
                      "❌ NO SE ENCONTRÓ NINGÚN INPUT."
                  )

                  browser.close()

                  raise SystemExit(1)

              for i in range(
                  inputs.count()
              ):
                  try:
                      inp = inputs.nth(i)

                      print(
                          f"INPUT {i}: "
                          f"type="
                          f"{inp.get_attribute('type')!r} "
                          f"placeholder="
                          f"{inp.get_attribute('placeholder')!r} "
                          f"name="
                          f"{inp.get_attribute('name')!r}"
                      )

                  except Exception:
                      pass

              inputs.first.fill(
                  profile_url
              )

              time.sleep(2)

              inspect_dom(
                  page,
                  "DESPUÉS DE INTRODUCIR LA CUENTA"
              )

              # ======================================================
              # BOTÓN DESCARGAR
              # ======================================================

              print("")
              print("=" * 70)
              print(
                  "BUSCANDO BOTÓN DESCARGAR"
              )
              print("=" * 70)

              buttons = page.get_by_text(
                  "Descargar",
                  exact=True
              )

              print(
                  "Botones/textos "
                  "'Descargar': "
                  f"{buttons.count()}"
              )

              if buttons.count() == 0:
                  buttons = page.locator(
                      "button, input[type=submit]"
                  )

                  print(
                      "Botones alternativos: "
                      f"{buttons.count()}"
                  )

              if buttons.count() == 0:
                  print(
                      "❌ NO SE ENCONTRÓ EL BOTÓN."
                  )

                  browser.close()

                  raise SystemExit(1)

              print("")
              print(
                  "Pulsando el primer botón..."
              )

              buttons.first.click()

              # ======================================================
              # ESPERA GENERAL
              # ======================================================

              print("")
              print("=" * 70)
              print(
                  "ESPERANDO RESPUESTA "
                  "DE SSSINSTAGRAM"
              )
              print("=" * 70)

              for i in range(1, 13):

                  time.sleep(2)

                  print(
                      f"Espera {i}/12..."
                  )

                  try:
                      print(
                          f"  URL: {page.url}"
                      )

                      img_count = page.locator(
                          "img"
                      ).count()

                      a_count = page.locator(
                          "a"
                      ).count()

                      video_count = page.locator(
                          "video"
                      ).count()

                      media_links_count = (
                          page.locator(
                              'a[href*="media.sssinstagram.com/get"]'
                          ).count()
                      )

                      print(
                          f"  img: {img_count}"
                      )

                      print(
                          f"  a: {a_count}"
                      )

                      print(
                          f"  video: {video_count}"
                      )

                      print(
                          "  media links: "
                          f"{media_links_count}"
                      )

                  except Exception as e:
                      print(
                          "  Error leyendo estado: "
                          f"{e}"
                      )

              # ======================================================
              # PRIMERA INSPECCIÓN COMPLETA
              # ======================================================

              inspect_dom(
                  page,
                  "DESPUÉS DE CARGAR EL PERFIL"
              )

              # ======================================================
              # SCROLL INTERNO
              # ======================================================

              scroll_containers(
                  page,
                  rounds=20
              )

              # ======================================================
              # INSPECCIÓN FINAL
              # ======================================================

              inspect_dom(
                  page,
                  "DESPUÉS DEL SCROLL INTERNO"
              )

              # ======================================================
              # RESUMEN FINAL
              # ======================================================

              print("")
              print("=" * 70)
              print(
                  "RESUMEN FINAL DE URLs MEDIA"
              )
              print("=" * 70)

              media_urls = page.evaluate(
                  """
                  () => {
                      const urls = new Set();

                      for (
                          const el of
                          document.querySelectorAll('*')
                      ) {
                          for (
                              const attr of
                              Array.from(
                                  el.attributes || []
                              )
                          ) {
                              if (
                                  attr.value &&
                                  attr.value.includes(
                                      'media.sssinstagram.com/get'
                                  )
                              ) {
                                  urls.add(
                                      attr.value
                                  );
                              }
                          }
                      }

                      return Array.from(urls);
                  }
                  """
              )

              print(
                  "URLs únicas encontradas: "
                  f"{len(media_urls)}"
              )

              for i, url in enumerate(
                  media_urls,
                  1
              ):
                  print("")
                  print(
                      f"MEDIA {i}:"
                  )

                  print(
                      url[:1200]
                  )

              print("")
              print("=" * 70)
              print(
                  "DIAGNÓSTICO TERMINADO"
              )
              print("=" * 70)

              browser.close()
