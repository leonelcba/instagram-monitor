name: Instagram Monitor

on:
  workflow_dispatch:

jobs:
  test-download-telegram:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar imagen
        run: |
          curl -L \
            "https://www.wikimedia.org/portal/wikimedia.org/assets/img/welcome-image.svg" \
            -o historia.jpg

          echo "Imagen descargada:"
          ls -lh historia.jpg

      - name: Enviar imagen a Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -sS -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendPhoto" \
            -F "chat_id=${TELEGRAM_CHAT_ID}" \
            -F "photo=@historia.jpg" \
            -F "caption=📸 Instagram Monitor: imagen descargada correctamente"

      - name: Limpiar archivo temporal
        run: |
          rm -f historia.jpg
          echo "Archivo temporal eliminado."
