              )


              for account in accounts:

                  print(
                      f"  - @{account}"
                  )


              print(
                  "=" * 60
              )


              if not TELEGRAM_BOT_TOKEN:

                  raise RuntimeError(
                      "Falta "
                      "TELEGRAM_BOT_TOKEN"
                  )


              if not TELEGRAM_CHAT_ID:

                  raise RuntimeError(
                      "Falta "
                      "TELEGRAM_CHAT_ID"
                  )


              state = load_state()


              DOWNLOAD_DIR.mkdir(
                  parents=True,
                  exist_ok=True
              )


              total_sent = 0


              with sync_playwright() as p:

                  browser = p.chromium.launch(

                      headless=True,

                      args=[
                          "--disable-blink-features="
                          "AutomationControlled"
                      ]

                  )


                  for account in accounts:

                      try:

                          total_sent += (
                              process_account(
                                  browser,
                                  account,
                                  state
                              )
                          )


                      except Exception as e:

                          print()
                          print(
                              f"❌ ERROR en "
                              f"@{account}:"
                          )

                          print(
                              repr(e)
                          )


                  browser.close()


              save_state(
                  state
              )


              print()
              print(
                  "=" * 60
              )

              print(
                  "RESUMEN"
              )

              print(
                  "=" * 60
              )

              print(
                  "Cuentas procesadas:",
                  len(accounts)
              )

              print(
                  "Stories enviadas:",
                  total_sent
              )

              print(
                  "Estado:",
                  STATE_FILE
              )

              print(
                  "=" * 60
              )


          if __name__ == "__main__":

              main()

