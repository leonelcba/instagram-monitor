name: Instagram Stories - DIAGNOSTICO API SNAPGRAM

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Python y Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium
          playwright install-deps chromium

      - name: Ejecutar diagnóstico
        run: |
          python <<'PY'
          import asyncio
          import json
          from urllib.parse import urlparse

          from playwright.async_api import async_playwright


          SNAPGRAM_URL = "https://www.snapgram.io/instagram-story-downloader/"

          ACCOUNTS = [
              "zero.design.oficial",
              "carenballen",
              "laderechadiario",
          ]


          KEYWORDS = [
              "api",
              "instagram",
              "story",
              "stories",
              "media",
              "download",
              "graphql",
              "ajax",
              "json",
              "result",
              "fetch",
          ]


          def interesting_url(url):
              u = url.lower()

              # Ignorar recursos estáticos normales de Snapgram
              ignored = [
                  "/_next/static/",
                  ".css",
                  ".js",
                  ".woff",
                  ".woff2",
                  ".png",
                  ".jpg",
                  ".jpeg",
                  ".svg",
                  ".ico",
              ]

              if any(x in u for x in ignored):
                  return False

              return any(k in u for k in KEYWORDS)


          async def safe_text(response):
              try:
                  return await response.text()
              except Exception as e:
                  return f"[NO SE PUDO LEER BODY: {e}]"


          async def diagnosticar(browser, username):

              print()
              print("=" * 90)
              print(f"CUENTA: @{username}")
              print("=" * 90)

              page = await browser.new_page()

              interesting_requests = []
              interesting_responses = []

              async def on_request(request):

                  url = request.url

                  if interesting_url(url):

                      print()
                      print(">>> REQUEST INTERESANTE <<<")
                      print("METHOD:", request.method)
                      print("URL:", url)

                      try:
                          headers = await request.all_headers()

                          selected = {}

                          for key, value in headers.items():
                              if key.lower() in [
                                  "content-type",
                                  "accept",
                                  "origin",
                                  "referer",
                                  "user-agent",
                              ]:
                                  selected[key] = value

                          if selected:
                              print("HEADERS:")
                              print(json.dumps(
                                  selected,
                                  indent=2,
                                  ensure_ascii=False
                              ))

                      except Exception:
                          pass

                      try:
                          post_data = request.post_data

                          if post_data:
                              print("REQUEST BODY:")
                              print(post_data[:10000])

                      except Exception:
                          pass

                      interesting_requests.append(request)

              async def on_response(response):

                  url = response.url

                  if interesting_url(url):

                      print()
                      print("<<< RESPONSE INTERESANTE <<<")
                      print("HTTP:", response.status)
                      print("METHOD:", response.request.method)
                      print("URL:", url)

                      try:
                          headers = await response.all_headers()

                          content_type = headers.get(
                              "content-type",
                              ""
                          )

                          print("Content-Type:", content_type)

                          interesting_responses.append(response)

                          # Solo intentamos leer cuerpos que puedan contener
                          # información útil.
                          if (
                              "json" in content_type.lower()
                              or "text" in content_type.lower()
                          ):

                              body = await safe_text(response)

                              print("RESPONSE BODY:")
                              print(body[:20000])

                      except Exception as e:
                          print("Error procesando respuesta:", e)


              page.on("request", on_request)
              page.on("response", on_response)


              print()
              print("Abriendo:")
              print(SNAPGRAM_URL)

              await page.goto(
                  SNAPGRAM_URL,
                  wait_until="domcontentloaded",
                  timeout=60000
              )

              await page.wait_for_timeout(5000)

              print()
              print("Página cargada.")

              # Buscar campo de entrada
              inputs = page.locator("input")

              count = await inputs.count()

              print("Inputs encontrados:", count)

              input_found = None

              for i in range(count):

                  try:
                      el = inputs.nth(i)

                      if await el.is_visible():

                          placeholder = await el.get_attribute(
                              "placeholder"
                          )

                          name = await el.get_attribute("name")
                          value = await el.get_attribute("value")

                          print(
                              f"INPUT #{i}: "
                              f"placeholder={placeholder!r} "
                              f"name={name!r} "
                              f"value={value!r}"
                          )

                          input_found = el
                          break

                  except Exception:
                      pass


              if input_found is None:

                  print("❌ No se encontró un input visible.")

                  await page.screenshot(
                      path=f"diagnostico_{username}_sin_input.png",
                      full_page=True
                  )

                  await page.close()
                  return


              story_url = (
                  f"https://www.instagram.com/stories/{username}/"
              )

              print()
              print("URL QUE SE ENVIARÁ A SNAPGRAM:")
              print(story_url)

              await input_found.fill(story_url)

              await page.wait_for_timeout(1000)


              # Buscar botón Download
              buttons = page.get_by_role(
                  "button",
                  name="Download"
              )

              button_count = await buttons.count()

              print()
              print("Botones Download encontrados:", button_count)

              button_found = None

              for i in range(button_count):

                  try:

                      el = buttons.nth(i)

                      if await el.is_visible():

                          button_found = el
                          break

                  except Exception:
                      pass


              # Si no encuentra por role, buscar botones/enlaces por texto.
              if button_found is None:

                  print(
                      "No apareció botón por role; "
                      "buscando elementos con texto Download..."
                  )

                  candidates = page.locator(
                      "button, a"
                  )

                  c = await candidates.count()

                  for i in range(c):

                      try:

                          el = candidates.nth(i)

                          if not await el.is_visible():
                              continue

                          text = (
                              await el.inner_text()
                          ).strip().lower()

                          if text == "download":

                              button_found = el
                              break

                      except Exception:
                          pass


              if button_found is None:

                  print("❌ No se encontró botón Download.")

                  await page.screenshot(
                      path=f"diagnostico_{username}_sin_boton.png",
                      full_page=True
                  )

                  await page.close()
                  return


              print()
              print(">>> HACIENDO CLICK EN DOWNLOAD <<<")
              print()

              await button_found.click()

              # Esperamos suficiente para capturar llamadas API.
              for i in range(30):

                  await page.wait_for_timeout(1000)

                  print(
                      f"Esperando red... "
                      f"{i + 1}/30"
                  )


              print()
              print("=" * 90)
              print("RESUMEN")
              print("=" * 90)

              print(
                  "Requests interesantes:",
                  len(interesting_requests)
              )

              print(
                  "Responses interesantes:",
                  len(interesting_responses)
              )


              print()
              print("URL FINAL DE LA PÁGINA:")
              print(page.url)


              print()
              print("TÍTULO:")
              print(await page.title())


              print()
              print("=" * 90)
              print("TODAS LAS PETICIONES INTERESANTES CAPTURADAS")
              print("=" * 90)

              seen = set()

              for request in interesting_requests:

                  key = (
                      request.method,
                      request.url
                  )

                  if key in seen:
                      continue

                  seen.add(key)

                  print(
                      request.method,
                      request.url
                  )


              print()
              print("=" * 90)
              print("FIN CUENTA")
              print("=" * 90)

              await page.screenshot(
                  path=f"diagnostico_{username}_final.png",
                  full_page=True
              )

              await page.close()


          async def main():

              async with async_playwright() as p:

                  browser = await p.chromium.launch(
                      headless=True,
                      args=[
                          "--no-sandbox",
                          "--disable-dev-shm-usage",
                      ]
                  )

                  for username in ACCOUNTS:

                      try:

                          await diagnosticar(
                              browser,
                              username
                          )

                      except Exception as e:

                          print()
                          print(
                              f"❌ ERROR EN @{username}: {e}"
                          )

                  await browser.close()


          asyncio.run(main())

          PY

      - name: Guardar diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-snapgram-api
          path: |
            diagnostico_*.png
          if-no-files-found: ignore
