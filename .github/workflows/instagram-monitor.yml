name: Instagram Monitor

on:
  workflow_dispatch:

  schedule:
    - cron: '0 * * * *'

jobs:
  monitor-instagram:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. INSTALAR PLAYWRIGHT
      # ============================================================

      - name: Instalar Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests
          playwright install --with-deps chromium


      # ============================================================
      # 2. BUSCAR STORIES
      # ============================================================

      - name: Buscar Stories
        env:
          INSTAGRAM_PROFILE: "https://www.instagram.com/zero.design.oficial/"
          SSS_URL: "https://sssinstagram.com/es/story-saver"
        run: |

          cat > monitor_instagram.py <<'PY'

          from playwright.sync_api import sync_playwright
          import requests
          import hashlib
          import json
          import os
          import re
          from urllib.parse import urlparse, parse_qs, unquote


          PROFILE = "zero.design.oficial"
          PROFILE_URL = f"https://www.instagram.com/{PROFILE}/"

          STATE_FILE = "data/instagram-state.json"

          os.makedirs("downloads", exist_ok=True)
          os.makedirs("data", exist_ok=True)


          # ========================================================
          # CARGAR ESTADO
          # ========================================================

          if os.path.exists(STATE_FILE):

              with open(
                  STATE_FILE,
                  "r",
                  encoding="utf-8"
              ) as f:

                  state = json.load(f)

          else:

              state = {}


          sent = set(
              state.get(PROFILE, [])
          )

          new_ids = []
          downloaded = []


          print("======================================")
          print("INSTAGRAM MONITOR")
          print("======================================")

          print(
              "Perfil:",
              PROFILE
          )

          print(
              "Stories ya enviadas:",
              len(sent)
          )


          # ========================================================
          # PLAYWRIGHT
          # ========================================================

          with sync_playwright() as p:

              browser = p.chromium.launch(
                  headless=True
              )

              context = browser.new_context(
                  viewport={
                      "width": 1366,
                      "height": 900
                  },
                  user_agent=(
                      "Mozilla/5.0 (X11; Linux x86_64) "
                      "AppleWebKit/537.36 "
                      "(KHTML, like Gecko) "
                      "Chrome/139.0.0.0 Safari/537.36"
                  )
              )

              page = context.new_page()


              # ====================================================
              # ABRIR SSSINSTAGRAM
              # ====================================================

              print("\nAbriendo SSSInstagram...")

              page.goto(
                  "https://sssinstagram.com/es/story-saver",
                  wait_until="domcontentloaded",
                  timeout=60000
              )

              page.wait_for_timeout(3000)


              # ====================================================
              # INTRODUCIR PERFIL
              # ====================================================

              print("Introduciendo perfil...")

              input_box = page.locator(
                  "input[type='text'], input[type='url']"
              ).first

              input_box.fill(
                  PROFILE_URL
              )


              # ====================================================
              # BOTÓN DESCARGAR
              # ====================================================

              print("Pulsando Descargar...")

              download_button = page.get_by_role(
                  "button",
                  name=re.compile(
                      "descargar",
                      re.I
                  )
              ).first

              if not download_button.is_visible():

                  download_button = page.get_by_text(
                      re.compile(
                          "descargar",
                          re.I
                      )
                  ).first


              if not download_button.is_visible():

                  raise Exception(
                      "No se encontró el botón Descargar."
                  )


              download_button.click()


              # ====================================================
              # ESPERAR RESULTADOS
              # ====================================================

              print(
                  "Esperando resultados..."
              )

              page.wait_for_timeout(
                  10000
              )


              # ====================================================
              # BUSCAR STORIES
              # ====================================================

              print(
                  "\nBuscando sección Stories..."
              )

              story_tab_found = False

              for pattern in [
                  r"stories",
                  r"story",
                  r"historias",
                  r"historia"
              ]:

                  try:

                      elements = page.get_by_text(
                          re.compile(
                              pattern,
                              re.I
                          )
                      )

                      for i in range(
                          min(
                              elements.count(),
                              10
                          )
                      ):

                          element = elements.nth(i)

                          try:

                              if element.is_visible():

                                  text = (
                                      element
                                      .inner_text()
                                      .strip()
                                  )

                                  if text:

                                      print(
                                          "Encontrado:",
                                          repr(text)
                                      )

                                      element.click(
                                          timeout=3000
                                      )

                                      page.wait_for_timeout(
                                          5000
                                      )

                                      story_tab_found = True

                                      break

                          except:
                              pass

                      if story_tab_found:
                          break

                  except:
                      pass


              if story_tab_found:

                  print(
                      "Se abrió Stories."
                  )

              else:

                  print(
                      "No se detectó explícitamente "
                      "la pestaña Stories."
                  )


              # ====================================================
              # BUSCAR URLs DE MEDIA
              # ====================================================

              print(
                  "\nBuscando archivos multimedia..."
              )

              links = page.locator("a")

              media_urls = []


              for i in range(
                  links.count()
              ):

                  link = links.nth(i)

                  try:

                      href = link.get_attribute(
                          "href"
                      )

                      if not href:
                          continue


                      if (
                          "media.sssinstagram.com/get"
                          not in href.lower()
                      ):
                          continue


                      if href not in media_urls:

                          media_urls.append(
                              href
                          )

                  except:
                      pass


              print(
                  "URLs multimedia encontradas:",
                  len(media_urls)
              )


              if not media_urls:

                  page.screenshot(
                      path="sssinstagram-debug.png",
                      full_page=True
                  )

                  with open(
                      "sssinstagram-debug.html",
                      "w",
                      encoding="utf-8"
                  ) as f:

                      f.write(
                          page.content()
                      )

                  raise Exception(
                      "No se encontraron Stories."
                  )


              # ====================================================
              # PROCESAR CADA STORY
              # ====================================================

              for index, media_url in enumerate(
                  media_urls
              ):

                  print(
                      f"\nProcesando Story {index + 1}..."
                  )


                  # ------------------------------------------------
                  # EXTRAER URI REAL DE INSTAGRAM
                  # ------------------------------------------------

                  try:

                      parsed = urlparse(
                          media_url
                      )

                      query = parse_qs(
                          parsed.query
                      )

                      real_uri = query.get(
                          "uri",
                          [media_url]
                      )[0]

                      real_uri = unquote(
                          real_uri
                      )

                  except:

                      real_uri = media_url


                  # ------------------------------------------------
                  # ID ESTABLE
                  # ------------------------------------------------

                  story_id = hashlib.sha256(
                      real_uri.encode(
                          "utf-8"
                      )
                  ).hexdigest()[:20]


                  print(
                      "ID:",
                      story_id
                  )


                  # ------------------------------------------------
                  # YA ENVIADA
                  # ------------------------------------------------

                  if story_id in sent:

                      print(
                          "Esta Story ya fue enviada."
                      )

                      continue


                  # ------------------------------------------------
                  # DESCARGAR INMEDIATAMENTE
                  # ------------------------------------------------

                  print(
                      "Descargando..."
                  )

                  response = requests.get(
                      media_url,
                      stream=True,
                      timeout=60,
                      headers={
                          "User-Agent":
                          "Mozilla/5.0"
                      }
                  )


                  print(
                      "HTTP:",
                      response.status_code
                  )


                  if response.status_code != 200:

                      print(
                          "No se pudo descargar."
                      )

                      continue


                  content_type = (
                      response
                      .headers
                      .get(
                          "content-type",
                          ""
                      )
                      .lower()
                  )


                  # ------------------------------------------------
                  # EXTENSIÓN
                  # ------------------------------------------------

                  if "video" in content_type:

                      extension = ".mp4"

                  elif "png" in content_type:

                      extension = ".png"

                  elif "webp" in content_type:

                      extension = ".webp"

                  else:

                      extension = ".jpg"


                  filename = (
                      f"downloads/"
                      f"{story_id}"
                      f"{extension}"
                  )


                  # ------------------------------------------------
                  # GUARDAR
                  # ------------------------------------------------

                  with open(
                      filename,
                      "wb"
                  ) as f:

                      for chunk in response.iter_content(
                          chunk_size=1024 * 1024
                      ):

                          if chunk:

                              f.write(
                                  chunk
                              )


                  filesize = os.path.getsize(
                      filename
                  )


                  print(
                      "Descargado:",
                      filename
                  )

                  print(
                      "Tamaño:",
                      filesize,
                      "bytes"
                  )


                  if filesize == 0:

                      os.remove(
                          filename
                      )

                      continue


                  downloaded.append(
                      filename
                  )

                  new_ids.append(
                      story_id
                  )


              browser.close()


          # ========================================================
          # GUARDAR NUEVOS IDs
          # ========================================================

          if PROFILE not in state:

              state[PROFILE] = []


          state[PROFILE].extend(
              new_ids
          )


          # Eliminar duplicados
          state[PROFILE] = list(
              dict.fromkeys(
                  state[PROFILE]
              )
          )


          with open(
              STATE_FILE,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  state,
                  f,
                  indent=2,
                  ensure_ascii=False
              )


          # ========================================================
          # LISTA DE ARCHIVOS PARA TELEGRAM
          # ========================================================

          with open(
              "files.txt",
              "w",
              encoding="utf-8"
          ) as f:

              for filename in downloaded:

                  f.write(
                      filename + "\n"
                  )


          print(
              "\n======================================"
          )

          print(
              "Stories nuevas:",
              len(downloaded)
          )

          print(
              "======================================"
          )

          PY


          python monitor_instagram.py


      # ============================================================
      # 3. ENVIAR STORIES NUEVAS A TELEGRAM
      # ============================================================

      - name: Enviar Stories nuevas a Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |

          if [ ! -f files.txt ]; then

            echo "No hay archivos."

            exit 0

          fi


          while IFS= read -r FILE; do

            [ -z "$FILE" ] && continue


            echo "Enviando:"
            echo "$FILE"


            if [[ "$FILE" == *.mp4 ]]; then

              RESPONSE=$(curl -sS \
                -X POST \
                "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendVideo" \
                -F "chat_id=${TELEGRAM_CHAT_ID}" \
                -F "video=@${FILE}" \
                -F "caption=📱 Instagram Monitor — zero.design.oficial")

            else

              RESPONSE=$(curl -sS \
                -X POST \
                "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendPhoto" \
                -F "chat_id=${TELEGRAM_CHAT_ID}" \
                -F "photo=@${FILE}" \
                -F "caption=📱 Instagram Monitor — zero.design.oficial")

            fi


            echo "$RESPONSE"


            if ! echo "$RESPONSE" | grep -q '"ok":true'; then

              echo "❌ Error enviando a Telegram."

              exit 1

            fi


            echo "✅ Enviado correctamente."

          done < files.txt


      # ============================================================
      # 4. GUARDAR EL ESTADO EN GITHUB
      # ============================================================

      - name: Guardar estado
        run: |

          git config user.name "Instagram Monitor"

          git config user.email "instagram-monitor@users.noreply.github.com"

          git add data/instagram-state.json

          if git diff --cached --quiet; then

            echo "No hubo cambios en el estado."

          else

            git commit \
              -m "Actualizar estado de Instagram"

            git push

          fi


      # ============================================================
      # 5. LIMPIAR ARCHIVOS TEMPORALES
      # ============================================================

      - name: Limpiar
        if: always()
        run: |

          rm -rf downloads

          rm -f files.txt

          rm -f sssinstagram-debug.html

          rm -f sssinstagram-debug.png

          echo "Archivos temporales eliminados."
