name: Test Snapgram API desde navegador

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Instalar Playwright
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium

      - name: Interceptar API de Snapgram
        shell: bash
        run: |
          python3 <<'PY'
          import asyncio
          import json
          import re
          from playwright.async_api import async_playwright

          ACCOUNTS = [
              "zero.design.oficial",
              "carenballen",
              "laderechadiario"
          ]

          SNAPGRAM_URL = "https://www.snapgram.io/instagram-story-downloader/"

          async def main():

              async with async_playwright() as p:

                  browser = await p.chromium.launch(
                      headless=True,
                      args=[
                          "--no-sandbox",
                          "--disable-dev-shm-usage"
                      ]
                  )

                  page = await browser.new_page(
                      user_agent=(
                          "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                          "AppleWebKit/537.36 (KHTML, like Gecko) "
                          "Chrome/139.0.0.0 Safari/537.36"
                      ),
                      viewport={
                          "width": 1365,
                          "height": 900
                      }
                  )

                  for username in ACCOUNTS:

                      print()
                      print("=" * 75)
                      print(f"CUENTA: @{username}")
                      print("=" * 75)

                      api_response = None
                      api_body = None

                      async def response_handler(response):

                          nonlocal api_response, api_body

                          url = response.url

                          if "api.sssgram.com/st-tik/ins/dl" not in url:
                              return

                          print()
                          print(">>> API DE SNAPGRAM DETECTADA <<<")
                          print(f"HTTP: {response.status}")
                          print("URL: api.sssgram.com/st-tik/ins/dl")
                          print()

                          try:
                              text = await response.text()

                              api_response = response
                              api_body = text

                              print("Respuesta recibida:")
                              print(text[:1000])

                          except Exception as e:
                              print(f"Error leyendo respuesta: {e}")

                      page.on("response", response_handler)

                      try:

                          print("Abriendo Snapgram...")
                          await page.goto(
                              SNAPGRAM_URL,
                              wait_until="domcontentloaded",
                              timeout=60000
                          )

                          await page.wait_for_timeout(3000)

                          story_url = (
                              f"https://www.instagram.com/stories/"
                              f"{username}/"
                          )

                          print(f"URL de Stories:")
                          print(story_url)

                          # Buscar el campo de entrada.
                          inputs = page.locator("input")

                          input_count = await inputs.count()

                          print(f"Inputs encontrados: {input_count}")

                          target_input = None

                          for i in range(input_count):

                              try:
                                  inp = inputs.nth(i)

                                  if await inp.is_visible():

                                      placeholder = await inp.get_attribute(
                                          "placeholder"
                                      )

                                      name = await inp.get_attribute("name")
                                      aria = await inp.get_attribute(
                                          "aria-label"
                                      )

                                      print(
                                          f"Input #{i}: "
                                          f"placeholder={placeholder!r} "
                                          f"name={name!r} "
                                          f"aria={aria!r}"
                                      )

                                      target_input = inp
                                      break

                              except Exception:
                                  pass

                          if target_input is None:
                              print("❌ No se encontró un input visible.")
                              continue

                          await target_input.fill(story_url)

                          print("Campo completado.")

                          # Buscar botón Download.
                          buttons = page.get_by_role(
                              "button",
                              name=re.compile(
                                  r"download",
                                  re.IGNORECASE
                              )
                          )

                          button_count = await buttons.count()

                          print(
                              f"Botones Download encontrados: "
                              f"{button_count}"
                          )

                          if button_count == 0:
                              print("❌ No se encontró botón Download.")
                              continue

                          button = buttons.first

                          await button.click()

                          print("Download pulsado.")
                          print("Esperando respuesta de la API...")

                          # Esperar hasta 30 segundos.
                          for second in range(30):

                              await page.wait_for_timeout(1000)

                              if api_body is not None:
                                  print(
                                      f"API detectada después de "
                                      f"{second + 1} segundos."
                                  )
                                  break

                              if second % 5 == 4:
                                  print(
                                      f"Esperando... "
                                      f"{second + 1}/30"
                                  )

                          if api_body is None:
                              print(
                                  "❌ No se detectó la petición "
                                  "a api.sssgram.com"
                              )
                              continue

                          # --------------------------------------------------
                          # Analizar JSON
                          # --------------------------------------------------

                          try:
                              data = json.loads(api_body)

                          except Exception as e:
                              print(
                                  "❌ La respuesta de la API "
                                  f"no es JSON válido: {e}"
                              )
                              continue

                          print()
                          print("ANÁLISIS DE LA RESPUESTA")
                          print("-" * 75)

                          print(f"code: {data.get('code')}")
                          print(f"msg: {data.get('msg')}")

                          result = data.get("result")

                          if not isinstance(result, dict):
                              print(
                                  "❌ 'result' no es un objeto válido."
                              )
                              continue

                          print(f"count: {result.get('count')}")
                          print(f"next: {result.get('next')}")
                          print(f"cursor: {result.get('cursor')}")
                          print(f"userId: {result.get('userId')}")

                          stories = result.get("insBos", [])

                          if not isinstance(stories, list):
                              print("❌ insBos no es una lista.")
                              continue

                          print()
                          print(
                              f"STORIES DEVUELTOS: {len(stories)}"
                          )
                          print()

                          if not stories:
                              print(
                                  "⚠️ La API no devolvió Stories "
                                  "para esta cuenta."
                              )
                              continue

                          # --------------------------------------------------
                          # Mostrar cada Story
                          # --------------------------------------------------

                          for index, story in enumerate(stories, 1):

                              if not isinstance(story, dict):
                                  print(
                                      f"Story #{index}: "
                                      "formato inesperado"
                                  )
                                  continue

                              story_id = story.get("id")

                              original_url = story.get(
                                  "originalUrl"
                              )

                              fallback_url = story.get("url")

                              media_url = (
                                  original_url
                                  or fallback_url
                              )

                              print(
                                  f"STORY #{index}"
                              )
                              print("-" * 50)

                              print(
                                  f"ID: {story_id}"
                              )

                              print(
                                  "Campos: "
                                  + ", ".join(
                                      sorted(story.keys())
                                  )
                              )

                              # Duración directa si existe.
                              duration = (
                                  story.get("duration")
                                  or story.get("duration_s")
                                  or story.get("videoDuration")
                              )

                              print(
                                  f"Duración directa: {duration}"
                              )

                              if media_url:

                                  parsed = (
                                      __import__(
                                          "urllib.parse",
                                          fromlist=["urlparse"]
                                      ).urlparse(media_url)
                                  )

                                  # No imprimimos los tokens temporales.
                                  safe_url = (
                                      f"{parsed.scheme}://"
                                      f"{parsed.netloc}"
                                      f"{parsed.path}"
                                  )

                                  print(
                                      f"Media URL: {safe_url}"
                                  )

                                  print(
                                      "Query/token: OCULTO"
                                  )

                                  path = parsed.path.lower()

                                  if ".mp4" in path:
                                      print(
                                          "Tipo detectado: VIDEO"
                                      )
                                  elif any(
                                      ext in path
                                      for ext in [
                                          ".jpg",
                                          ".jpeg",
                                          ".png"
                                      ]
                                  ):
                                      print(
                                          "Tipo detectado: IMAGEN"
                                      )
                                  else:
                                      print(
                                          "Tipo detectado: "
                                          "DESCONOCIDO"
                                      )

                              else:
                                  print(
                                      "❌ No hay originalUrl ni url."
                                  )

                              # Buscar información adicional dentro del
                              # objeto por si la duración está anidada.
                              text_dump = json.dumps(
                                  story,
                                  ensure_ascii=False
                              )

                              duration_matches = re.findall(
                                  r'"duration(?:_s)?":\s*([0-9.]+)',
                                  text_dump
                              )

                              if duration_matches:
                                  print(
                                      "Duraciones encontradas "
                                      "dentro del objeto: "
                                      + ", ".join(
                                          duration_matches
                                      )
                                  )

                              if "INSTAGRAM.STORY" in text_dump:
                                  print(
                                      "✅ Marcador INSTAGRAM.STORY "
                                      "encontrado."
                                  )

                              print()

                      except Exception as e:

                          print()
                          print(
                              f"❌ ERROR procesando "
                              f"@{username}: {e}"
                          )

                      finally:

                          # Quitamos el listener para que las cuentas
                          # siguientes no acumulen respuestas.
                          try:
                              page.remove_listener(
                                  "response",
                                  response_handler
                              )
                          except Exception:
                              pass

                  await browser.close()

          asyncio.run(main())

          print()
          print("=" * 75)
          print("FIN DE LA PRUEBA")
          print("=" * 75)
          print()
          print("No se modificó instagram-state.json.")
          print("No se descargaron Stories.")
          print("No se envió nada a Telegram.")
          PY
